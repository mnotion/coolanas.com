<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#eaf3ff"><title>Enter PIN — coolanas</title><style>
:root{color-scheme:light;--ink:#1d2b3d;--muted:#718198}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--ink);background:radial-gradient(ellipse at 8% 4%,rgba(124,183,255,.32),transparent 34rem),radial-gradient(ellipse at 93% 27%,rgba(107,202,255,.22),transparent 31rem),#edf5ff;font:14px/1.55 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.pin-card{width:min(420px,100%);padding:34px;border:1px solid rgba(255,255,255,.9);border-radius:26px;background:linear-gradient(145deg,rgba(255,255,255,.86),rgba(220,239,255,.62));box-shadow:inset 0 1px 0 #fff,0 18px 46px rgba(44,105,181,.12)}
.brand{display:block;width:210px;height:118px;object-fit:contain;object-position:left center;margin:-12px 0 14px -10px}
h1{margin:0;font-size:27px;letter-spacing:-.055em}p{margin:7px 0 24px;color:var(--muted);font-size:12px}
label{display:block;margin-bottom:8px;color:#557795;font-size:11px;font-weight:700}
input{width:100%;height:48px;padding:0 14px;border:1px solid rgba(104,160,220,.35);border-radius:13px;outline:none;background:rgba(255,255,255,.75);color:var(--ink);font:600 16px ui-sans-serif,system-ui;letter-spacing:.18em}
input:focus{border-color:#6aa9e8;box-shadow:0 0 0 3px rgba(106,169,232,.14)}
button{width:100%;height:46px;margin-top:14px;border:1px solid rgba(255,255,255,.9);border-radius:13px;background:linear-gradient(145deg,#d8ecff,#a9d1f8);color:#205c96;font:750 12px ui-sans-serif,system-ui;cursor:pointer}
.error{min-height:18px;margin:10px 2px 0;color:#b34d67;font-size:11px}@media(max-width:480px){.pin-card{padding:26px}}
</style></head><body><main class="pin-card"><img class="brand" src="assets/branding%20and%20logo/coolanas_light%20(1).svg" alt="coolanas"><h1>Welcome back</h1><p>Enter your PIN to continue to your dashboard.</p><form id="pin-form"><label for="pin">Your PIN</label><input id="pin" name="pin" type="password" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="16" required aria-describedby="pin-error"><button type="submit">Continue</button><div class="error" id="pin-error" role="alert" aria-live="polite"></div></form></main>
<script>
const form=document.getElementById("pin-form"),field=document.getElementById("pin"),error=document.getElementById("pin-error");
form.addEventListener("submit",async event=>{event.preventDefault();error.textContent="";const value=field.value.trim().toUpperCase();const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));const hash=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,"0")).join("");if(hash==="bcd147460adf0408dd4f6fd86ce70c22461924debb0607aa649a1e02eabd4240"){sessionStorage.setItem("coolanas-pin-unlocked","1");location.href="dashboard.html"}else{error.textContent="That PIN isn't correct. Try again.";field.value="";field.focus()}});
</script></body></html>
