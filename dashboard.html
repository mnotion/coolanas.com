<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>mnotion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; min-height:100%; margin:0; background:#fff; color:#111; transition:background .18s ease; }
    body:has(.bottom-nav:hover), body:has(.bottom-nav:focus-within) { background:#d9d9d9; }
    body:has(.bottom-nav:hover) main, body:has(.bottom-nav:focus-within) main { filter:brightness(.72) blur(2px); }
    body { min-height:100vh; font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { min-height:100vh; padding:24px 24px 112px; }
    .study-stopwatch{position:fixed;top:50%;left:50%;right:auto;transform:translate(-50%,-50%);width:min(360px,calc(100vw - 180px));min-width:220px;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}
    .study-stopwatch-time{margin:8px 0 18px;text-align:center;font-size:42px;font-weight:650;letter-spacing:-.055em;font-variant-numeric:tabular-nums;line-height:1.2}
    .study-stopwatch-actions{display:flex;gap:9px}
    .study-stopwatch-actions button{flex:1;padding:10px 12px;border:1px solid #ddd;border-radius:9px;background:#fff;color:#222;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .study-stopwatch-actions .primary{border-color:#222;background:#222;color:#fff}
    .study-stopwatch-actions button:disabled{opacity:.45;cursor:not-allowed}
    .task-placeholder{position:fixed;top:calc(50% + 155px);right:28px;transform:translateY(-50%);width:min(320px,calc(100vw - 170px));min-width:220px;padding:20px;border:1px solid #e3e3e3;border-radius:16px;background:#f3f3f3;box-shadow:0 4px 18px rgba(0,0,0,.035)}
    .task-placeholder-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .task-placeholder h2{margin:0;font-size:18px;font-weight:650;letter-spacing:-.02em}
    .task-placeholder-tag{padding:4px 8px;border-radius:999px;background:#e5e5e5;color:#666;font-size:11px;font-weight:600}
    .task-placeholder-empty{padding:22px 12px;text-align:center;border:1px dashed #d4d4d4;border-radius:11px;color:#777}
    .task-placeholder-empty strong{display:block;margin-bottom:4px;color:#444;font-size:13px;font-weight:600}
    .task-placeholder-empty p{margin:0;font-size:12px}
    @media(max-width:620px){.study-stopwatch{top:42%;right:14px;bottom:auto;left:132px;transform:translateY(-50%);width:auto;min-width:0;padding:0}.study-stopwatch-time{font-size:32px}.task-placeholder{top:auto;right:14px;bottom:100px;left:132px;transform:none;width:auto;min-width:0;padding:15px}.task-placeholder h2,.study-stopwatch h2{font-size:16px}.task-placeholder-empty{padding:16px 8px}}
    .contribution-card{position:fixed;z-index:10;top:50%;left:18px;transform:translateY(-50%);box-sizing:border-box;width:112px;max-height:72vh;overflow:visible;padding:10px 14px;border:1px solid #dedede;border-radius:16px;background:#bdbdbd;box-shadow:0 4px 18px rgba(0,0,0,.045)}
    .contribution-scroll{width:100%;max-height:72vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
    .contribution-scroll::-webkit-scrollbar{display:none}
    .contribution-grid{display:grid;grid-auto-flow:row;grid-template-columns:repeat(7,9px);grid-auto-rows:9px;gap:3px;width:max-content;max-width:100%;margin:0 auto}
    .contribution-day{width:9px;height:9px;border-radius:2.5px;background:#f5f5f5}
    .contribution-day.passed{background:#d94b4b}
    .contribution-day.today{outline:1px solid #d94b4b;outline-offset:1px}
    .contribution-day.empty{visibility:hidden}
    .contribution-tooltip{position:fixed;z-index:30;display:none;pointer-events:none;padding:6px 9px;border:1px solid rgba(0,0,0,.1);border-radius:7px;background:#222;color:#fff;font-size:12px;font-weight:550;line-height:1.2;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.16)}
    .contribution-tooltip.visible{display:block}
    @media(max-width:480px){.contribution-card{width:104px;padding:13px 12px;max-height:66vh}.contribution-scroll{max-height:66vh}.contribution-grid{grid-template-columns:repeat(7,8px);grid-auto-rows:8px;gap:3px}.contribution-day{width:8px;height:8px}}
    .profile-button{position:fixed;z-index:12;top:20px;right:22px;width:42px;height:42px;padding:0;overflow:hidden;border:1px solid rgba(0,0,0,.1);border-radius:50%;background:#eee;color:#555;cursor:pointer;box-shadow:0 2px 9px rgba(0,0,0,.1);display:grid;place-items:center}
    .profile-button img,.profile-identity img{width:100%;height:100%;object-fit:cover}
    #profile-avatar-fallback,#drawer-avatar-fallback{font-weight:650;font-size:15px}
    #profile-avatar[hidden],#drawer-avatar[hidden],#profile-avatar-fallback[hidden],#drawer-avatar-fallback[hidden]{display:none!important}
    .profile-backdrop{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.18);backdrop-filter:blur(2px)}
    .profile-backdrop[hidden]{display:none}
    .profile-drawer{position:fixed;z-index:20;top:0;right:0;width:min(360px,88vw);height:100dvh;padding:22px;background:rgba(255,255,255,.96);border-left:1px solid rgba(0,0,0,.08);box-shadow:-12px 0 40px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .22s ease;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .profile-drawer.open{transform:translateX(0)}
    .profile-drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 22px;border-bottom:1px solid #eee}
    .profile-identity{display:flex;align-items:center;gap:12px;min-width:0}
    .profile-identity img,.profile-identity #drawer-avatar-fallback{width:46px;height:46px;flex:none;border-radius:50%;background:#eee;display:grid;place-items:center}
    .profile-identity div{display:grid;min-width:0}
    .profile-identity strong,.profile-identity small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .profile-identity strong{font-size:14px}.profile-identity small{color:#777;font-size:12px}
    .profile-actions{display:grid;gap:4px;padding-top:16px}.profile-actions .menu-item{padding:13px 10px}
    @media(max-width:480px){.profile-button{top:12px;right:14px}}
    @media(prefers-reduced-motion:reduce){.profile-drawer{transition:none}}
    .bottom-nav {
      position:fixed; z-index:10; left:50%; bottom:20px; transform:translateX(-50%);
      width:min(300px,calc(100% - 24px)); min-height:44px; padding:3px;
      display:grid; grid-template-columns:repeat(4,1fr); gap:3px;
      background:rgba(235,236,238,.9); border:1px solid rgba(0,0,0,.06);
      border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,.055), inset 0 1px 0 rgba(255,255,255,.65);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    }
    .nav-button {
      display:flex; align-items:center; justify-content:center; min-height:36px;
      text-decoration:none;
      border:1px solid rgba(0,0,0,.045); border-radius:9px;
      background:rgba(255,255,255,.28); color:#555; cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
      position:relative; z-index:1;
      transition:transform .08s ease-out, background .16s ease, border-color .16s ease, box-shadow .16s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .bottom-nav:has(.nav-button:hover) .nav-button:not(:hover) { transform:scale(.94); }
    .nav-button:hover { z-index:2; transform:translate3d(var(--shift-x,0px),var(--shift-y,0px),0) scale(1.12); background:rgba(255,255,255,.72); border-color:rgba(0,0,0,.09); box-shadow:0 4px 12px rgba(0,0,0,.07), inset 0 1px 0 rgba(255,255,255,.8); }
    .nav-button:active { transform:translate3d(var(--shift-x,0px),var(--shift-y,0px),0) scale(1.06); }
    .nav-button[aria-expanded="true"] { background:rgba(215,217,220,.55); border-color:rgba(0,0,0,.09); }
    .nav-button svg { width:17px; height:17px; }
    .panel {
      position:fixed; z-index:9; left:50%; bottom:84px; transform:translateX(-50%);
      width:min(420px,calc(100% - 32px)); max-height:min(60vh,520px); overflow:auto; padding:18px;
      border:1px solid rgba(255,255,255,.9); border-radius:18px;
      background:rgba(255,255,255,.86); backdrop-filter:blur(18px) saturate(150%);
      -webkit-backdrop-filter:blur(18px) saturate(150%);
      box-shadow:0 10px 34px rgba(0,0,0,.11), inset 0 1px 0 #fff;
    }
    .panel[hidden] { display:none; }
    .panel-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .panel-heading h2 { margin:0; font-size:16px; font-weight:700; }
    .close-button { width:32px; height:32px; border:0; border-radius:9px; background:rgba(0,0,0,.05); cursor:pointer; font-size:20px; line-height:1; }
    .search-input {
      width:100%; height:48px; padding:0 14px; border:1px solid #d5d5d5;
      border-radius:10px; outline:none; font:inherit; background:rgba(255,255,255,.8);
    }
    .search-input:focus { border-color:#111; }
    .menu-list { display:grid; gap:4px; }
    .menu-item { display:block; width:100%; padding:12px; border:0; border-radius:9px; background:transparent; color:#111; text-align:left; font:500 14px/1.3 Inter,ui-sans-serif,system-ui,sans-serif; cursor:pointer; }
    .menu-item:hover { background:rgba(0,0,0,.05); }
    .upload-button {
      display:flex; width:100%; min-height:44px; align-items:center; justify-content:center; gap:8px;
      border:1px solid rgba(0,0,0,.12); border-radius:10px; background:rgba(255,255,255,.8);
      color:#111; font:600 13px Inter,ui-sans-serif,system-ui,sans-serif; cursor:pointer;
    }
    .upload-button:hover { background:#fff; }
    .empty-state { padding:22px 12px 18px; text-align:center; color:#666; font-size:13px; }
    .empty-state svg { width:30px; height:30px; margin-bottom:8px; color:#888; }
    .file-list { display:grid; gap:7px; margin-top:12px; }
    .file-row { display:flex; align-items:center; gap:10px; padding:10px; border:1px solid rgba(0,0,0,.07); border-radius:10px; background:rgba(255,255,255,.7); }
    .file-row svg { width:19px; height:19px; flex:none; color:#666; }
    .file-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
    .file-size { margin-left:auto; flex:none; color:#888; font-size:11px; }
    .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:480px) { main { padding:16px 16px 104px; }  .bottom-nav { bottom:12px; } .panel { bottom:76px; } }
    @media (prefers-reduced-motion:reduce) {
      html, body { transition:none; }
      .nav-button { transition:none; }
      .nav-button:hover,.nav-button:active,.bottom-nav:has(.nav-button:hover) .nav-button:not(:hover) { transform:none; }
      body:has(.bottom-nav:hover) main, body:has(.bottom-nav:focus-within) main { filter:none; }
    }
  </style>
</head>

  <script type="module">
    const SUPABASE_URL="https://nacwftrsdpglzrhasmit.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY="sb_publishable_4OLO5cw2lr_l90MECEAG0A_MJY1NQQF";
    const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2.119.0");
    const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:false,
        experimental:{passkey:true}
      }
    });
    const accountStatus=document.getElementById("account-status");
    const usernameForm=document.getElementById("username-form");
    const usernameInput=document.getElementById("username-input");
    const usernameError=document.getElementById("username-error");
    const usernameSubmit=document.getElementById("username-submit");
    const callbackParams=new URLSearchParams(location.search);
    const callbackCode=callbackParams.get("code");
    const callbackError=callbackParams.get("error_description")||callbackParams.get("error");
    const hashParams=new URLSearchParams(location.hash.replace(/^#/,""));
    const isAuthCallback=Boolean(callbackCode||callbackError||hashParams.has("access_token"));

    async function getCallbackSession(){
      if(callbackError){
        throw new Error(callbackError);
      }

      if(callbackCode){
        const {data,error}=await supabase.auth.exchangeCodeForSession(callbackCode);
        if(error) throw error;
        return data.session||null;
      }

      const accessToken=hashParams.get("access_token");
      const refreshToken=hashParams.get("refresh_token");
      if(accessToken&&refreshToken){
        const {data,error}=await supabase.auth.setSession({
          access_token:accessToken,
          refresh_token:refreshToken
        });
        if(error) throw error;
        return data.session||null;
      }

      const {data:{session},error}=await supabase.auth.getSession();
      if(error) throw error;
      return session;
    }

    function validateUsername(value){
      const length=[...value].length;
      if(length<4||length>100) return "Username must be 4–100 characters.";
      if(/\s/u.test(value)) return "Spaces are not allowed.";
      if(/[\p{Extended_Pictographic}\p{Regional_Indicator}\p{Emoji_Modifier}\u20E3]/u.test(value)) return "Emojis are not allowed.";
      return "";
    }
    async function requireUsername(session){
      const {data:profile,error:profileError}=await supabase.from("profiles").select("username").eq("id",session.user.id).maybeSingle();
      if(profileError) throw profileError;
      if(profile?.username){return;}
      accountStatus.textContent="One more step: create your Coolanas username.";
      usernameForm.hidden=false;
      usernameForm.style.display="block";
      usernameSubmit.disabled=false;
      usernameInput.focus();
      await new Promise((resolve)=>{
        usernameForm.addEventListener("submit",async(event)=>{
          event.preventDefault();
          const username=usernameInput.value;
          const validation=validateUsername(username);
          if(validation){usernameError.textContent=validation;return;}
          usernameSubmit.disabled=true;
          usernameError.textContent="Checking username…";
          try{
            const {error:updateError}=await supabase.from("profiles").update({username}).eq("id",session.user.id);
            if(updateError){
              if(/duplicate key|profiles_username_lower_key|profiles_username_key/i.test(updateError.message)) throw new Error("That username is already taken.");
              throw updateError;
            }
            const {error:metadataError}=await supabase.auth.updateUser({data:{username}});
            if(metadataError) console.warn("Username profile saved; auth metadata sync failed:",metadataError.message);
            usernameError.textContent="";
            resolve();
          }catch(error){
            usernameError.textContent=error?.message||"Could not save username.";
            usernameSubmit.disabled=false;
          }
        });
      });
    }


    const profileButton=document.getElementById("profile-button");
    const profileDrawer=document.getElementById("profile-drawer");
    const profileBackdrop=document.getElementById("profile-backdrop");
    const profilePictureInput=document.getElementById("profile-picture-input");
    const profileAvatar=document.getElementById("profile-avatar");
    const drawerAvatar=document.getElementById("drawer-avatar");
    const avatarFallback=document.getElementById("profile-avatar-fallback");
    const drawerAvatarFallback=document.getElementById("drawer-avatar-fallback");
    const removePfpButton=document.getElementById("remove-pfp");
    let googleAvatarUrl="";

    function setAvatar(url){
      for(const img of [profileAvatar,drawerAvatar]){
        img.onerror=null;
        if(url){
          img.src=url;
          img.hidden=false;
          img.onerror=()=>{
            img.onerror=null;
            if(customProfilePicture&&googleAvatarUrl&&url!==googleAvatarUrl){
              customProfilePicture=false;
              setAvatar(googleAvatarUrl);
            }else{
              img.hidden=true;
              avatarFallback.hidden=true;
              drawerAvatarFallback.hidden=true;
            }
          };
        }else{
          img.removeAttribute("src");
          img.hidden=true;
        }
      }
      avatarFallback.hidden=Boolean(url);
      drawerAvatarFallback.hidden=Boolean(url);
      removePfpButton.hidden=!customProfilePicture;
    }
    let customProfilePicture=false;
    async function profileAction(action,payload={}){
      const {data,error}=await supabase.functions.invoke("coolanas-files-b2",{body:{action,...payload}});
      if(error)throw new Error(error.message||"Profile picture request failed.");
      if(data?.error)throw new Error(data.error);
      return data;
    }
    async function refreshProfilePicture(){
      const result=await profileAction("profile_picture_get");
      customProfilePicture=Boolean(result.exists&&result.url);
      setAvatar(customProfilePicture?result.url:googleAvatarUrl);
    }
    function loadContributionGraph(){
      const grid=document.getElementById("contribution-grid");
      const today=new Date();
      const yearStart=new Date(2026,0,1);
      const yearEnd=new Date(2027,0,1);
      const todayStart=new Date(today.getFullYear(),today.getMonth(),today.getDate());
      const firstWeekday=(yearStart.getDay()+6)%7;
      grid.replaceChildren();
      let tooltip=document.getElementById("contribution-tooltip");
      if(!tooltip){
        tooltip=document.createElement("div");
        tooltip.id="contribution-tooltip";
        tooltip.className="contribution-tooltip";
        tooltip.setAttribute("role","status");
        document.body.appendChild(tooltip);
      }
      const hideTooltip=()=>tooltip.classList.remove("visible");
      function positionTooltip(event){
        if(event.pointerType==="touch")return;
        const offset=12;
        const width=tooltip.offsetWidth;
        const height=tooltip.offsetHeight;
        const left=Math.min(window.innerWidth-width-8,event.clientX+offset);
        const top=Math.max(8,event.clientY-height-offset);
        tooltip.style.left=Math.max(8,left)+"px";
        tooltip.style.top=top+"px";
      }
      for(let i=0;i<firstWeekday;i++){
        const blank=document.createElement("span");
        blank.className="contribution-day empty";
        blank.setAttribute("aria-hidden","true");
        grid.appendChild(blank);
      }
      for(let date=new Date(yearStart);date<yearEnd;date.setDate(date.getDate()+1)){
        const cell=document.createElement("span");
        cell.className="contribution-day";
        const day=new Date(date.getFullYear(),date.getMonth(),date.getDate());
        if(day<todayStart)cell.classList.add("passed");
        if(day.getTime()===todayStart.getTime())cell.classList.add("today");
        const dateLabel=date.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
        cell.setAttribute("aria-label",dateLabel+(day<todayStart?", passed":""));
        cell.addEventListener("pointerenter",event=>{
          if(event.pointerType==="touch")return;
          tooltip.textContent=dateLabel;
          tooltip.classList.add("visible");
          positionTooltip(event);
        });
        cell.addEventListener("pointermove",positionTooltip);
        cell.addEventListener("pointerleave",hideTooltip);
        cell.addEventListener("focus",()=>{
          tooltip.textContent=dateLabel;
          tooltip.classList.add("visible");
          const rect=cell.getBoundingClientRect();
          positionTooltip({clientX:rect.right,clientY:rect.top,pointerType:"mouse"});
        });
        cell.addEventListener("blur",hideTooltip);
        grid.appendChild(cell);
      }
    }

    // Lightweight YPT-style stopwatch. Elapsed time is persisted locally and
    // recalculated from timestamps, so it remains accurate when the tab sleeps.
    (function setupStudyStopwatch(){
      const timeEl=document.getElementById("study-stopwatch-time");
      const toggleButton=document.getElementById("study-stopwatch-toggle");
      const resetButton=document.getElementById("study-stopwatch-reset");
      const storageKey="coolanas-study-stopwatch-v1";
      let state={elapsed:0,startedAt:null};
      try{
        const saved=JSON.parse(localStorage.getItem(storageKey)||"null");
        if(saved&&typeof saved.elapsed==="number"){
          state={elapsed:Math.max(0,saved.elapsed),startedAt:Number.isFinite(saved.startedAt)?saved.startedAt:null};
        }
      }catch(error){console.warn("Could not restore stopwatch:",error);}
      const elapsedNow=()=>state.elapsed+(state.startedAt?Math.max(0,Date.now()-state.startedAt):0);
      const format=milliseconds=>{
        const total=Math.floor(milliseconds/1000);
        const hours=Math.floor(total/3600);
        const minutes=Math.floor((total%3600)/60);
        const seconds=total%60;
        return [hours,minutes,seconds].map(value=>String(value).padStart(2,"0")).join(":");
      };
      function save(){
        try{localStorage.setItem(storageKey,JSON.stringify(state));}catch(error){console.warn("Could not save stopwatch:",error);}
      }
      function render(){
        timeEl.textContent=format(elapsedNow());
        const running=Boolean(state.startedAt);
        toggleButton.textContent=running?"Pause":(state.elapsed>0?"Resume":"Start");
      }
      toggleButton.addEventListener("click",()=>{
        if(state.startedAt){
          state.elapsed=elapsedNow();
          state.startedAt=null;
        }else{
          state.startedAt=Date.now();
        }
        save();render();
      });
      resetButton.addEventListener("click",()=>{
        state.elapsed=0;
        state.startedAt=null;
        save();render();
      });
      render();
      setInterval(render,250);
    })();

    async function initialiseProfile(session){
      const meta=session.user.user_metadata||{};
      googleAvatarUrl=typeof meta.avatar_url==="string"?meta.avatar_url:(typeof meta.picture==="string"?meta.picture:"");
      const displayName=meta.full_name||meta.name||meta.user_name||session.user.email||"Account";
      document.getElementById("profile-name").textContent=displayName;
      document.getElementById("profile-email").textContent=session.user.email||"";
      loadContributionGraph();
      avatarFallback.textContent=String(displayName).trim().charAt(0).toUpperCase()||"?";
      drawerAvatarFallback.textContent=avatarFallback.textContent;
      // Keep the Google avatar hidden until storage confirms whether a custom
      // Coolanas picture exists, preventing the wrong image from flashing.
      setAvatar("");
      try{
        await refreshProfilePicture();
      }catch(error){
        console.warn("Could not load custom profile picture:",error.message);
        customProfilePicture=false;
        setAvatar(googleAvatarUrl);
      }
    }
    function closeProfileDrawer(){
      profileDrawer.classList.remove("open");
      profileDrawer.setAttribute("aria-hidden","true");
      profileButton.setAttribute("aria-expanded","false");
      profileBackdrop.hidden=true;
    }
    function openProfileDrawer(){
      profileDrawer.classList.add("open");
      profileDrawer.setAttribute("aria-hidden","false");
      profileButton.setAttribute("aria-expanded","true");
      profileBackdrop.hidden=false;
    }
    profileButton.addEventListener("click",openProfileDrawer);
    document.getElementById("profile-close").addEventListener("click",closeProfileDrawer);
    profileBackdrop.addEventListener("click",closeProfileDrawer);
    document.getElementById("change-pfp").addEventListener("click",()=>profilePictureInput.click());
    async function convertProfilePictureToPng(file){
      if(file.size>20*1024*1024)throw new Error("Choose an image smaller than 20 MB.");
      if(!file.type.startsWith("image/")&&!/\.(avif|bmp|gif|heic|heif|jpe?g|png|svg|tiff?|webp)$/i.test(file.name)){
        throw new Error("Choose an image file.");
      }
      let bitmap;
      try{
        bitmap=await createImageBitmap(file,{imageOrientation:"from-image"});
      }catch{
        throw new Error("This image format cannot be opened by this browser. Try converting it to a standard image first.");
      }
      try{
        const side=Math.min(bitmap.width,bitmap.height);
        if(!side)throw new Error("This image has invalid dimensions.");
        const sourceX=(bitmap.width-side)/2;
        const sourceY=(bitmap.height-side)/2;
        const canvas=document.createElement("canvas");
        canvas.width=512;
        canvas.height=512;
        const context=canvas.getContext("2d",{alpha:true});
        if(!context)throw new Error("Image conversion is unavailable in this browser.");
        context.drawImage(bitmap,sourceX,sourceY,side,side,0,0,512,512);
        const png=await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("Could not convert this image to PNG.")),"image/png"));
        if(png.size>5*1024*1024)throw new Error("The converted PNG is larger than 5 MB. Choose a simpler image.");
        return png;
      }finally{
        bitmap.close?.();
      }
    }
    profilePictureInput.addEventListener("change",async()=>{
      const file=profilePictureInput.files?.[0];
      profilePictureInput.value="";
      if(!file)return;
      try{
        const png=await convertProfilePictureToPng(file);
        const signed=await profileAction("profile_picture_upload",{contentType:"image/png"});
        const response=await fetch(signed.uploadUrl,{method:"PUT",headers:{"Content-Type":"image/png"},body:png});
        if(!response.ok)throw new Error("Image upload failed (HTTP "+response.status+").");
        await refreshProfilePicture();
        closeProfileDrawer();
      }catch(error){alert(error.message||"Could not update profile picture.");}
    });
    removePfpButton.addEventListener("click",async()=>{
      try{
        await profileAction("profile_picture_delete");
        customProfilePicture=false;
        setAvatar(googleAvatarUrl);
        closeProfileDrawer();
      }catch(error){alert(error.message||"Could not remove profile picture.");}
    });
    async function leaveAccount(){
      const {error}=await supabase.auth.signOut({scope:"local"});
      if(error)throw error;
      location.assign("/index.html");
    }
    document.getElementById("profile-signout").addEventListener("click",async()=>{try{await leaveAccount();}catch(error){alert(error.message);}});
    document.getElementById("change-account").addEventListener("click",async()=>{try{await leaveAccount();}catch(error){alert(error.message);}});
    document.addEventListener("keydown",event=>{if(event.key==="Escape")closeProfileDrawer();});

    try{
      let session;
      if(isAuthCallback){
        accountStatus.textContent="Completing Google sign-in…";
        session=await getCallbackSession();
        if(!session){
          throw new Error("Google returned without an active Coolanas session. Return to sign-in and try again.");
        }
        history.replaceState(null,document.title,location.pathname);
        await requireUsername(session);
        await initialiseProfile(session);
      }else{
        const {data:{session:storedSession},error}=await supabase.auth.getSession();
        if(error) throw error;
        session=storedSession;
        if(!session){
          accountStatus.textContent="You are not signed in.";
          accountStatus.textContent="You are not signed in. Return to sign in.";
        }else{
          await requireUsername(session);
          await initialiseProfile(session);
        }
      }
    }catch(authError){
      accountStatus.textContent="Google sign-in could not be completed.";
      accountStatus.textContent=authError?.message||"Authentication failed. Return to sign-in and try again.";
      console.error("Coolanas OAuth callback failed:",authError);
    }

    const navSearch=document.getElementById("search-toggle");
    const navMenu=document.getElementById("menu-toggle");
    const searchPanel=document.getElementById("search-panel");
    const menuPanel=document.getElementById("menu-panel");
    function closeNavPanels(){
      searchPanel.hidden=true;
      menuPanel.hidden=true;
      navSearch.setAttribute("aria-expanded","false");
      navMenu.setAttribute("aria-expanded","false");
    }
    function toggleNavPanel(panel,button){
      const shouldOpen=panel.hidden;
      closeNavPanels();
      if(shouldOpen){
        panel.hidden=false;
        button.setAttribute("aria-expanded","true");
        panel.querySelector("input")?.focus();
      }
    }
    navMenu.addEventListener("click",()=>toggleNavPanel(menuPanel,navMenu));
    document.querySelectorAll(".panel [data-close]").forEach(button=>button.addEventListener("click",closeNavPanels));
    document.getElementById("menu-home").addEventListener("click",closeNavPanels);
    document.getElementById("menu-files").addEventListener("click",()=>location.assign("files.html"));
    document.addEventListener("keydown",event=>{if(event.key==="Escape")closeNavPanels();});
  </script></body>
