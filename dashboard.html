<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>mnotion — Fingerprint setup</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #fff;
      color: #111;
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(520px, 100%);
      padding: 36px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 14px 38px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.05);
    }
    .eyebrow { margin: 0 0 10px; color: #666; font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; letter-spacing: -.055em; }
    p { color: #555; }
    button {
      width: 100%; min-height: 48px; margin-top: 20px; padding: 12px 16px;
      border: 1px solid #111; border-radius: 9px; background: #111; color: #fff;
      font: 700 14px/1.2 Inter, ui-sans-serif, system-ui, sans-serif; cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: .6; }
    #status { min-height: 22px; margin: 18px 0 0; font-size: 13px; }
    #status[data-kind="error"] { color: #a00000; }
    #status[data-kind="success"] { color: #176b37; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) { main { padding: 26px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">mnotion · account security</p>
    <h1>Fingerprint setup</h1>
    <p>Your PIN has been verified. Register one passkey using your device's fingerprint, face unlock, or screen-lock method. Biometric data stays on your device; Supabase stores the public credential.</p>
    <button id="register-button" type="button" disabled>Register my fingerprint</button>
    <p id="status" role="status" aria-live="polite">Checking your secure session…</p>
  </main>
  <script type="module" src="js/passkey-setup.js"></script>
</body>
</html>
