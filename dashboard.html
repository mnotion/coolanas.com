<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>mnotion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; min-height:100%; margin:0; background:#fff; color:#111; }
    body { min-height:100vh; font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { min-height:100vh; padding:24px 24px 112px; }
    .bottom-nav {
      position:fixed; z-index:10; left:50%; bottom:20px; transform:translateX(-50%);
      width:min(420px,calc(100% - 32px)); min-height:76px; padding:8px;
      display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
      background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.9);
      border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,.09), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
    }
    .nav-button {
      display:flex; align-items:center; justify-content:center;
      min-height:58px; border:1px solid rgba(0,0,0,.055); border-radius:14px;
      background:rgba(255,255,255,.48); color:#222; cursor:pointer;
      box-shadow:0 2px 8px rgba(0,0,0,.025), inset 0 1px 0 rgba(255,255,255,.8);
      transition:transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .nav-button:hover {
      transform:translateY(-3px);
      background:rgba(255,255,255,.94);
      border-color:rgba(0,0,0,.12);
      box-shadow:0 7px 16px rgba(0,0,0,.09), inset 0 1px 0 #fff;
    }
    .nav-button:active { transform:translateY(-1px) scale(.98); }
    .nav-button[aria-expanded="true"] { background:rgba(245,245,245,.94); border-color:rgba(0,0,0,.13); }
    .nav-button svg { width:22px; height:22px; }
    .panel {
      position:fixed; z-index:9; left:50%; bottom:112px; transform:translateX(-50%);
      width:min(420px,calc(100% - 32px)); padding:18px;
      border:1px solid rgba(255,255,255,.9); border-radius:18px;
      background:rgba(255,255,255,.82); backdrop-filter:blur(18px) saturate(150%);
      -webkit-backdrop-filter:blur(18px) saturate(150%);
      box-shadow:0 10px 34px rgba(0,0,0,.11), inset 0 1px 0 #fff;
    }
    .panel[hidden] { display:none; }
    .search-input {
      width:100%; height:48px; padding:0 14px; border:1px solid #d5d5d5;
      border-radius:10px; outline:none; font:inherit; background:rgba(255,255,255,.8);
    }
    .search-input:focus { border-color:#111; }
    .menu-list { display:grid; gap:4px; }
    .menu-item {
      display:block; width:100%; padding:12px; border:0; border-radius:9px;
      background:transparent; color:#111; text-align:left; font:500 14px/1.3 inherit;
      cursor:pointer;
    }
    .menu-item:hover { background:rgba(0,0,0,.05); }
    @media (max-width:480px) {
      main { padding:16px 16px 104px; }
      .bottom-nav { bottom:12px; }
      .panel { bottom:100px; }
    }
    @media (prefers-reduced-motion:reduce) {
      .nav-button { transition:none; }
      .nav-button:hover,.nav-button:active { transform:none; }
    }
  </style>
</head>
<body>
  <main aria-label="Dashboard"></main>

  <section class="panel" id="search-panel" aria-label="Search" hidden>
    <input class="search-input" id="search-input" type="search" placeholder="Search…" autocomplete="off">
  </section>

  <section class="panel" id="menu-panel" aria-label="Menu" hidden>
    <nav class="menu-list">
      <button class="menu-item" type="button">Home</button>
      <button class="menu-item" type="button">Settings</button>
    </nav>
  </section>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-button" id="search-toggle" type="button" aria-label="Search" aria-expanded="false" aria-controls="search-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
    </button>
    <button class="nav-button" id="files-toggle" type="button" aria-label="Files">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5z"></path><path d="M3.5 10h17"></path></svg>
    </button>
    <button class="nav-button" id="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
  </nav>

  <script>
    const searchToggle = document.getElementById("search-toggle");
    const filesToggle = document.getElementById("files-toggle");
    const menuToggle = document.getElementById("menu-toggle");
    const searchPanel = document.getElementById("search-panel");
    const menuPanel = document.getElementById("menu-panel");
    const searchInput = document.getElementById("search-input");

    function closePanels() {
      searchPanel.hidden = true;
      menuPanel.hidden = true;
      searchToggle.setAttribute("aria-expanded", "false");
      menuToggle.setAttribute("aria-expanded", "false");
    }

    searchToggle.addEventListener("click", () => {
      const opening = searchPanel.hidden;
      closePanels();
      if (opening) {
        searchPanel.hidden = false;
        searchToggle.setAttribute("aria-expanded", "true");
        searchInput.focus();
      }
    });

    filesToggle.addEventListener("click", () => {
      closePanels();
      // Files panel will be implemented when its contents are defined.
    });

    menuToggle.addEventListener("click", () => {
      const opening = menuPanel.hidden;
      closePanels();
      if (opening) {
        menuPanel.hidden = false;
        menuToggle.setAttribute("aria-expanded", "true");
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closePanels();
    });
  </script>
</body>
</html>
