<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>mnotion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; min-height:100%; margin:0; background:#fff; color:#111; transition:background .18s ease; }
    body:has(.bottom-nav:hover), body:has(.bottom-nav:focus-within) { background:#d9d9d9; }
    body:has(.bottom-nav:hover) main, body:has(.bottom-nav:focus-within) main { filter:brightness(.72) blur(2px); }
    body { min-height:100vh; font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { min-height:100vh; padding:24px 24px 112px; }
    .bottom-nav {
      position:fixed; z-index:10; left:50%; bottom:20px; transform:translateX(-50%);
      width:min(260px,calc(100% - 24px)); min-height:44px; padding:3px;
      display:grid; grid-template-columns:repeat(3,1fr); gap:3px;
      background:rgba(235,236,238,.9); border:1px solid rgba(0,0,0,.06);
      border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,.055), inset 0 1px 0 rgba(255,255,255,.65);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    }
    .nav-button {
      display:flex; align-items:center; justify-content:center; min-height:36px;
      border:1px solid rgba(0,0,0,.045); border-radius:9px;
      background:rgba(255,255,255,.28); color:#555; cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
      position:relative; z-index:1;
      transition:transform .08s ease-out, background .16s ease, border-color .16s ease, box-shadow .16s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .bottom-nav:has(.nav-button:hover) .nav-button:not(:hover) { transform:scale(.94); }
    .nav-button:hover { z-index:2; transform:translate3d(var(--shift-x,0px),var(--shift-y,0px),0) scale(1.12); background:rgba(255,255,255,.72); border-color:rgba(0,0,0,.09); box-shadow:0 4px 12px rgba(0,0,0,.07), inset 0 1px 0 rgba(255,255,255,.8); }
    .nav-button:active { transform:translate3d(var(--shift-x,0px),var(--shift-y,0px),0) scale(1.06); }
    .nav-button[aria-expanded="true"] { background:rgba(215,217,220,.55); border-color:rgba(0,0,0,.09); }
    .nav-button svg { width:17px; height:17px; }
    .panel {
      position:fixed; z-index:9; left:50%; bottom:84px; transform:translateX(-50%);
      width:min(420px,calc(100% - 32px)); max-height:min(60vh,520px); overflow:auto; padding:18px;
      border:1px solid rgba(255,255,255,.9); border-radius:18px;
      background:rgba(255,255,255,.86); backdrop-filter:blur(18px) saturate(150%);
      -webkit-backdrop-filter:blur(18px) saturate(150%);
      box-shadow:0 10px 34px rgba(0,0,0,.11), inset 0 1px 0 #fff;
    }
    .panel[hidden] { display:none; }
    .panel-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .panel-heading h2 { margin:0; font-size:16px; font-weight:700; }
    .close-button { width:32px; height:32px; border:0; border-radius:9px; background:rgba(0,0,0,.05); cursor:pointer; font-size:20px; line-height:1; }
    .search-input {
      width:100%; height:48px; padding:0 14px; border:1px solid #d5d5d5;
      border-radius:10px; outline:none; font:inherit; background:rgba(255,255,255,.8);
    }
    .search-input:focus { border-color:#111; }
    .menu-list { display:grid; gap:4px; }
    .menu-item { display:block; width:100%; padding:12px; border:0; border-radius:9px; background:transparent; color:#111; text-align:left; font:500 14px/1.3 Inter,ui-sans-serif,system-ui,sans-serif; cursor:pointer; }
    .menu-item:hover { background:rgba(0,0,0,.05); }
    .upload-button {
      display:flex; width:100%; min-height:44px; align-items:center; justify-content:center; gap:8px;
      border:1px solid rgba(0,0,0,.12); border-radius:10px; background:rgba(255,255,255,.8);
      color:#111; font:600 13px Inter,ui-sans-serif,system-ui,sans-serif; cursor:pointer;
    }
    .upload-button:hover { background:#fff; }
    .empty-state { padding:22px 12px 18px; text-align:center; color:#666; font-size:13px; }
    .empty-state svg { width:30px; height:30px; margin-bottom:8px; color:#888; }
    .file-list { display:grid; gap:7px; margin-top:12px; }
    .file-row { display:flex; align-items:center; gap:10px; padding:10px; border:1px solid rgba(0,0,0,.07); border-radius:10px; background:rgba(255,255,255,.7); }
    .file-row svg { width:19px; height:19px; flex:none; color:#666; }
    .file-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
    .file-size { margin-left:auto; flex:none; color:#888; font-size:11px; }
    .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:480px) { main { padding:16px 16px 104px; }  .bottom-nav { bottom:12px; } .panel { bottom:76px; } }
    @media (prefers-reduced-motion:reduce) {
      html, body { transition:none; }
      .nav-button { transition:none; }
      .nav-button:hover,.nav-button:active,.bottom-nav:has(.nav-button:hover) .nav-button:not(:hover) { transform:none; }
      body:has(.bottom-nav:hover) main, body:has(.bottom-nav:focus-within) main { filter:none; }
    }
  </style>
</head>
<body>
  <main aria-label="Dashboard"></main>

  <section class="panel" id="search-panel" aria-label="Search" hidden>
    <div class="panel-heading"><h2>Search</h2><button class="close-button" type="button" data-close aria-label="Close">×</button></div>
    <input class="search-input" id="search-input" type="search" placeholder="Search…" autocomplete="off">
  </section>

  <section class="panel" id="files-panel" aria-label="Files" hidden>
    <div class="panel-heading"><h2>Files</h2><button class="close-button" type="button" data-close aria-label="Close">×</button></div>
    <label class="upload-button" for="file-picker">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      Add files
    </label>
    <input class="visually-hidden" id="file-picker" type="file" multiple>
    <div class="empty-state" id="files-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5z"/><path d="M3.5 10h17"/></svg>
      <div>No files selected</div>
      <div>Choose files to see them listed here.</div>
    </div>
    <div class="file-list" id="file-list" aria-live="polite"></div>
  </section>

  <section class="panel" id="menu-panel" aria-label="Menu" hidden>
    <div class="panel-heading"><h2>Menu</h2><button class="close-button" type="button" data-close aria-label="Close">×</button></div>
    <nav class="menu-list">
      <button class="menu-item" type="button">Home</button>
      <button class="menu-item" type="button">Settings</button>
    </nav>
  </section>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-button" id="search-toggle" type="button" aria-label="Search" aria-expanded="false" aria-controls="search-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
    </button>
    <button class="nav-button" id="files-toggle" type="button" aria-label="Files" aria-expanded="false" aria-controls="files-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5z"></path><path d="M3.5 10h17"></path></svg>
    </button>
    <button class="nav-button" id="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
  </nav>

  <script>
    const toggles = {
      search: document.getElementById("search-toggle"),
      files: document.getElementById("files-toggle"),
      menu: document.getElementById("menu-toggle")
    };
    const panels = {
      search: document.getElementById("search-panel"),
      files: document.getElementById("files-panel"),
      menu: document.getElementById("menu-panel")
    };
    const searchInput = document.getElementById("search-input");
    const filePicker = document.getElementById("file-picker");
    const fileList = document.getElementById("file-list");
    const filesEmpty = document.getElementById("files-empty");

    function closePanels() {
      Object.entries(panels).forEach(([name, panel]) => {
        panel.hidden = true;
        toggles[name].setAttribute("aria-expanded", "false");
      });
    }

    function togglePanel(name) {
      const opening = panels[name].hidden;
      closePanels();
      if (opening) {
        panels[name].hidden = false;
        toggles[name].setAttribute("aria-expanded", "true");
        if (name === "search") searchInput.focus();
      }
    }

    Object.entries(toggles).forEach(([name, button]) => {
      button.addEventListener("click", () => togglePanel(name));
      button.addEventListener("pointermove", event => {
        if (event.pointerType !== "mouse") return;
        const rect = button.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width - 0.5;
        const y = (event.clientY - rect.top) / rect.height - 0.5;
        button.style.setProperty("--shift-x", (x * 8).toFixed(2) + "px");
        button.style.setProperty("--shift-y", (y * 8).toFixed(2) + "px");
      });
      button.addEventListener("pointerleave", () => {
        button.style.removeProperty("--shift-x");
        button.style.removeProperty("--shift-y");
      });
    });

    document.querySelectorAll("[data-close]").forEach(button => {
      button.addEventListener("click", closePanels);
    });

    filePicker.addEventListener("change", () => {
      const files = Array.from(filePicker.files || []);
      fileList.replaceChildren();
      filesEmpty.hidden = files.length > 0;

      files.forEach(file => {
        const row = document.createElement("div");
        row.className = "file-row";
        const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        icon.setAttribute("viewBox", "0 0 24 24");
        icon.setAttribute("fill", "none");
        icon.setAttribute("stroke", "currentColor");
        icon.setAttribute("stroke-width", "1.7");
        icon.innerHTML = '<path d="M6 3.5h8l4 4V20H6z"/><path d="M14 3.5V8h4M9 13h6M9 16h6"/>';
        const name = document.createElement("span");
        name.className = "file-name";
        name.textContent = file.name;
        const size = document.createElement("span");
        size.className = "file-size";
        size.textContent = file.size < 1048576
          ? Math.max(1, Math.round(file.size / 1024)) + " KB"
          : (file.size / 1048576).toFixed(1) + " MB";
        row.append(icon, name, size);
        fileList.append(row);
      });
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closePanels();
    });
  </script>
</body>
</html>
