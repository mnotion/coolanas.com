<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/suitcase.svg?v=suitcase-1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>mnotion</title>
  <script src="/js/theme.js?v=account-settings-4"></script>
  <link rel="stylesheet" href="/css/dashboard.css?v=dark-pause-2">
  <link rel="stylesheet" href="/css/theme.css?v=sitewide-theme-2">
</head>
<body>
  <main aria-label="Dashboard"><div id="account-status" class="visually-hidden" aria-live="polite"></div><button id="mail-button" class="mail-button" type="button" aria-label="Open mail" aria-expanded="false" aria-controls="mail-popover">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="m4 7 8 6 8-6"></path></svg>
      <span id="mail-unread-indicator" class="mail-unread-indicator" aria-hidden="true"></span>
    </button>
    <section class="mail-popover" id="mail-popover" aria-label="Mail" hidden><h2>Mail</h2><div class="mail-notifications" id="mail-notifications"><p class="mail-empty">Loading mail…</p></div></section>
    <button id="profile-button" class="profile-button" type="button" aria-label="Open account menu" aria-expanded="false" aria-controls="profile-drawer"><img id="profile-avatar" alt="" hidden><span id="profile-avatar-fallback" aria-hidden="true">?</span></button>
    <section class="contribution-card" id="contribution-card" aria-label="2026 calendar">
      <div class="contribution-scroll"><div class="contribution-grid" id="contribution-grid" aria-label="Days passed in 2026"></div></div>
    </section>
    <section class="study-stopwatch" aria-label="Study timer">
      <div class="study-stopwatch-time" id="study-stopwatch-time" role="timer" aria-live="off">00:00:00</div>
      <div class="study-stopwatch-actions">
        <button id="study-stopwatch-reset" type="button" aria-label="Reset timer" title="Reset">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.32 4H3.5a9 9 0 1 0 2.1-4.1L8 7.3H2V1.5l3.05 3.05A8.96 8.96 0 0 1 12 2z"/></svg>
        </button>
        <button class="primary" id="study-stopwatch-toggle" type="button" aria-label="Start timer" title="Start">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8c0-.8.9-1.3 1.6-.9l11 7.1a1.2 1.2 0 0 1 0 2l-11 7.1c-.7.4-1.6-.1-1.6-.9z"/></svg>
        </button>
      </div>
      <div class="active-subject-label" id="active-subject-label" aria-live="polite"></div>
    </section>
    <div class="subject-selection-hint" id="subject-selection-hint" role="status"></div>
    <div class="study-subjects loading" id="study-subjects" aria-label="Subjects">
      <button class="study-subject-add" id="study-subject-add" type="button" aria-label="Add subject">+</button>
      <input class="study-subject-input" id="study-subject-input" type="text" maxlength="32" placeholder="Subject name" aria-label="New subject" hidden>
    </div>
    <div class="subject-context-menu" id="subject-context-menu" hidden><button type="button" data-action="rename">Rename</button><button type="button" data-action="colour">Colour</button><div class="subject-menu-colours" id="subject-menu-colours" hidden></div><button type="button" data-action="delete">Delete</button></div>
    <section class="task-list-card" aria-labelledby="task-list-title">
      <div class="task-list-head"><h2 id="task-list-title">Task list</h2></div>
      <form class="task-add-row" id="task-add-form">
        <input class="task-add-input" id="task-add-input" type="text" maxlength="180" placeholder="Add a task…" aria-label="New task" autocomplete="off">
        <button class="task-add-button" type="submit" aria-label="Add task">+</button>
      </form>
      <div class="task-items" id="task-items" aria-live="polite"><div class="task-empty">Loading tasks…</div></div>
      <div class="task-error" id="task-error" role="status"></div>
    </section>
  </main>
  <div class="profile-backdrop" id="profile-backdrop" hidden></div>
  <aside class="profile-drawer" id="profile-drawer" aria-label="Account menu" aria-hidden="true">
    <div class="profile-drawer-head"><div class="profile-identity"><img id="drawer-avatar" alt="" hidden><span id="drawer-avatar-fallback">?</span><div><strong id="profile-name">Account</strong><small id="profile-email"></small></div></div><button class="close-button" id="profile-close" type="button" aria-label="Close">×</button></div>
    <nav class="profile-actions">
      <button class="menu-item" id="change-pfp" type="button">Change profile picture</button>
      <button class="menu-item" id="remove-pfp" type="button" hidden>Remove profile picture</button>
      <button class="menu-item" id="change-account" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 8v6m-3-3h6"/></svg><span>Change account</span></button>
      <button class="menu-item" id="profile-settings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.6.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.9l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.6-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.6.9l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1-.1 1.8Z"/></svg><span>Settings</span></button>
      <button class="menu-item" id="theme-toggle" type="button">Switch to dark mode</button>
      <button class="menu-item" id="profile-signout" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg><span>Sign out</span></button>
    </nav>
    <input id="profile-picture-input" type="file" accept="image/*" hidden>
  </aside>
  <form id="username-form" hidden style="display:none;margin:18px auto;max-width:420px;padding:16px;border:1px solid #e5e5e5;border-radius:12px"><label for="username-input" style="display:block;margin-bottom:8px;font-weight:600">Choose your username</label><input id="username-input" type="text" minlength="4" maxlength="100" autocomplete="username" required style="width:100%;height:44px;padding:0 12px;border:1px solid #ccc;border-radius:8px;font:inherit"><p style="margin:8px 0;color:#666;font-size:12px">4–100 characters. No spaces or emojis. Other characters are allowed.</p><p id="username-error" role="status" style="font-size:12px;color:#a00000"></p><button id="username-submit" type="submit" style="padding:10px 16px;border:1px solid #111;border-radius:9px;background:#111;color:#fff;cursor:pointer">Save username</button></form>

  <section class="panel" id="search-panel" aria-label="Search" hidden>
    <div class="panel-heading"><h2>Search</h2><button class="close-button" type="button" data-close aria-label="Close">×</button></div>
    <input class="search-input" id="search-input" type="search" placeholder="Search…" autocomplete="off">
  </section>

  <section class="panel" id="analytics-panel" aria-label="Analytics" hidden>
    <div class="panel-heading"><h2>Analytics</h2><button class="close-button" type="button" data-close aria-label="Close">×</button></div>
    <div class="empty-state"><p>Study analytics are coming soon.</p></div>
  </section>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="nav-button" id="home-toggle" href="/dashboard.html" aria-label="Home" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"></path><path d="M5 9v11h14V9"></path><path d="M9 20v-6h6v6"></path></svg>
    </a>
    <a class="nav-button" id="search-toggle" href="/coming-soon.html" aria-label="Coolanas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="14" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></a>
    <a class="nav-button" id="files-toggle" href="/exhibitions.html" aria-label="Open Bucket">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.1 8.2C3.3 5.1 5.7 2.5 12 2.5s8.7 2.6 6.9 5.7"/><path d="M3.2 8.2h17.6l-2 12.1c-4.4 1.6-9.2 1.6-13.6 0L3.2 8.2Z"/><path d="M3.2 8.2c4.9 1.1 12.7 1.1 17.6 0"/><path d="M6.1 17.5c3.8 1 8 1 11.8 0"/></svg>
    </a>
    <a class="nav-button" id="analytics-toggle" href="/analytics.html" aria-label="Analytics">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5"></path><path d="M4 19h17"></path><path d="m7 15 4-4 3 2 5-6"></path><path d="M19 7h-4"></path><path d="M19 7v4"></path></svg>
    </a>
  </nav>

  <script type="module" src="/js/dashboard.js?v=account-settings-2"></script>
  <script src="/js/upload-manager.js?v=3" defer></script>
</body>
</html>
