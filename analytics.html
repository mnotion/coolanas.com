<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/suitcase.svg?v=suitcase-1">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/suitcase.svg?v=suitcase-1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f7f7">
  <title>Analytics · Coolanas</title>
  <script src="/js/theme.js?v=cloud-json-sync-4"></script>
  <link rel="stylesheet" href="/css/analytics.css?v=task-day-history-1">
  <link rel="stylesheet" href="/css/theme.css?v=sitewide-theme-2">
</head>
<body>
  <header class="topbar"><a class="brand" href="/dashboard.html">Coolanas</a><a class="back" href="/dashboard.html">← Back</a></header>
  <main class="layout">
    <aside class="sidebar" aria-label="Analytics sections">
      <h1>Analytics</h1>
      <p id="analytics-sync-status" class="analytics-sync-status" role="status" aria-live="polite">Connecting to your account…</p>
      <button class="topic active" type="button" data-section="time" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6M12 2v3"/></svg>Monthly</button>
      <button class="topic" type="button" data-section="calendar" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Calendar</button>
      <button class="topic" type="button" data-section="buckets" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.1 8.2C3.3 5.1 5.7 2.5 12 2.5s8.7 2.6 6.9 5.7"/><path d="M3.2 8.2h17.6l-2 12.1c-4.4 1.6-9.2 1.6-13.6 0L3.2 8.2Z"/><path d="M3.2 8.2c4.9 1.1 12.7 1.1 17.6 0"/></svg>Buckets</button>
    </aside>
    <div class="content">
      <section class="section active" id="section-time">
        <h2>Monthly</h2>
        <div class="time-card monthly-chart-card">
          <div class="setting-copy"><strong>Monthly study time</strong></div>
          <div class="chart-wrap"><svg id="monthly-time-chart" viewBox="0 0 760 280" role="img" aria-label="Monthly study time chart"></svg><div id="chart-tooltip" class="chart-tooltip" role="status" aria-live="polite"></div></div>
          <div class="study-insights-row">
            <section class="study-heatmap" aria-labelledby="study-heatmap-title">
              <div class="study-heatmap-heading"><strong id="study-heatmap-title">Heat map</strong></div>
              <div class="study-heatmap-scroll" id="study-heatmap-scroll" tabindex="0" aria-label="Study time heatmap from January to today">
                <div class="study-heatmap-months" id="study-heatmap-months"></div>
                <div class="study-heatmap-body">
                  <div class="study-heatmap-weekdays" aria-hidden="true"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>
                  <div class="study-heatmap-grid" id="study-heatmap-grid"></div>
                </div>
              </div>
            </section>
            <section class="monthly-overview" aria-label="Monthly overview">
              <div class="monthly-overview-panel">
                <article class="monthly-overview-stat"><span>Total study time</span><strong id="monthly-overview-total">—</strong></article>
                <article class="monthly-overview-stat"><span>Days studied</span><strong id="monthly-overview-days">—</strong></article>
                <article class="monthly-overview-stat"><span>Daily average</span><strong id="monthly-overview-average">—</strong></article>
                <article class="monthly-overview-stat"><span>Best study day</span><strong id="monthly-overview-best">—</strong></article>
              </div>
            </section>
          </div>
 
        </div>
      </section>
      <section class="section" id="section-calendar">
        <div class="calendar-card">
          <div class="calendar-toolbar"><div class="calendar-month" id="calendar-month"></div></div>
          <div class="calendar-grid" id="calendar-grid" aria-label="Monthly calendar"></div>
        </div>
        <section class="calendar-details" id="calendar-details" aria-live="polite" hidden>
          <div class="calendar-details-heading"><div><div class="calendar-details-date" id="calendar-details-date"></div><div class="calendar-details-total" id="calendar-details-total"></div></div></div>
          <div class="calendar-details-content" id="calendar-details-content"></div>
        </section>
      </section>
      <section class="section" id="section-buckets">
        <h2>Buckets</h2>
        <div class="bucket-summary"><div class="bucket-stat"><strong id="bucket-count">—</strong><span>Buckets</span></div><div class="bucket-stat"><strong id="file-count">—</strong><span>Files</span></div></div>
        <!-- From Uiverse.io by ashif_6672 - https://uiverse.io/ashif_6672/nice-warthog-84 | MIT License, Copyright (c) ashif_6672 (Ashif) -->
        <div class="tree-container" id="bucket-tree" aria-live="polite"><p class="empty">Loading bucket structure…</p></div>
        <div class="bucket-list" id="bucket-list" hidden></div>
        <hr class="bucket-section-divider">
        <h3 class="shared-bucket-section-title">Shared with me</h3>
        <div class="tree-container shared-bucket-tree-container" id="shared-bucket-tree" aria-live="polite"><p class="empty">Loading shared buckets…</p></div>
      </section>
    </div>
  </main>
  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="nav-button" href="/dashboard.html" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg></a>
    <a class="nav-button" href="/coming-soon.html" aria-label="Coolanas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="14" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></a>
    <a class="nav-button" href="/exhibitions.html" aria-label="Bucket"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.1 8.2C3.3 5.1 5.7 2.5 12 2.5s8.7 2.6 6.9 5.7"/><path d="M3.2 8.2h17.6l-2 12.1c-4.4 1.6-9.2 1.6-13.6 0L3.2 8.2Z"/><path d="M3.2 8.2c4.9 1.1 12.7 1.1 17.6 0"/></svg></a>
    <a class="nav-button" href="/analytics.html" aria-label="Analytics" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h17"/><path d="m7 15 4-4 3 2 5-6"/><path d="M19 7h-4"/><path d="M19 7v4"/></svg></a>
  </nav>
  <script type="module" src="/js/analytics.js?v=cloud-json-sync-4"></script>
  <script src="/js/upload-manager.js?v=4" defer></script>
</body>
</html>
