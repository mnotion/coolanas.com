<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>mnotion — Verify email</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; padding:24px; display:grid; place-items:center; background:#fff; color:#111; font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; }

    p { color:#555; }
  </style>
</head>

  <main>
    <h1>Verifying your email</h1>
    <p id="status" role="status" aria-live="polite">Please wait…</p>
