function guildElapsedNow(){
 const base=Number(guildStopwatchState.elapsed_ms)||0;
 return base+(guildStopwatchState.started_at?
   Math.max(0,Date.now()+guildStopwatchClockOffset-Date.parse(guildStopwatchState.started_at)):0);
}
const GUILD_DIGIT_SEGMENTS={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgcde","7":"abc","8":"abcdefg","9":"abfgcd"};
const GUILD_SEGMENT_PATHS={a:"M12 9H36",b:"M39 12V32",c:"M39 40V60",d:"M12 63H36",e:"M9 40V60",f:"M9 12V32",g:"M12 36H36"};
const GUILD_SVG_NS="http://www.w3.org/2000/svg";
let lastGuildTimerMarkup="";
function makeGuildSvg(className,viewBox){
 const svg=document.createElementNS(GUILD_SVG_NS,"svg");
 svg.setAttribute("class",className);svg.setAttribute("viewBox",viewBox);svg.setAttribute("aria-hidden","true");
 return svg;
}
function renderGuildStopwatch(){
 const display=document.getElementById("sca-guild-time");
 if(!display)return;
 let seconds=Math.floor(guildElapsedNow()/1000);
 const days=Math.floor(seconds/86400);seconds%=86400;
 const hours=Math.floor(seconds/3600);seconds%=3600;
 const minutes=Math.floor(seconds/60);seconds%=60;
 const hh=String(hours).padStart(2,"0"),mm=String(minutes).padStart(2,"0"),ss=String(seconds).padStart(2,"0");
 const value=days?String(days)+"d "+hh+":"+mm+":"+ss:hh+":"+mm+":"+ss;
 if(value===lastGuildTimerMarkup)return;
 lastGuildTimerMarkup=value;
 const nodes=[];
 for(const character of value){
  if(/[0-9]/.test(character)){
   const svg=makeGuildSvg("sca-guild-digit","0 0 48 72");
   for(const segment of GUILD_DIGIT_SEGMENTS[character]){
    const path=document.createElementNS(GUILD_SVG_NS,"path");
    path.setAttribute("d",GUILD_SEGMENT_PATHS[segment]);svg.append(path);
   }
   nodes.push(svg);
  }else if(character===":"){
   const svg=makeGuildSvg("sca-guild-colon","0 0 16 72");
   for(const y of [24,48]){
    const circle=document.createElementNS(GUILD_SVG_NS,"circle");
    circle.setAttribute("cx","8");circle.setAttribute("cy",String(y));circle.setAttribute("r","3.4");svg.append(circle);
   }
   nodes.push(svg);
  }else if(character==="d"){
   const label=document.createElement("span");label.className="sca-guild-day-label";label.textContent="d";nodes.push(label);
  }
 }
 display.replaceChildren(...nodes);
}
function applyGuildStopwatchRow(row){
 if(!row)return;
 const serverNow=Date.parse(row.server_now||"");
 if(Number.isFinite(serverNow))guildStopwatchClockOffset=serverNow-Date.now();
 guildStopwatchState.elapsed_ms=Math.max(0,Number(row.elapsed_ms)||0);
 guildStopwatchState.started_at=row.started_at||null;
 renderGuildStopwatch();
}

 if(generation!==guildStopwatchLoadGeneration)return;
 const row=Array.isArray(data)?data[0]:data;
 if(!row)throw new Error("The stopwatch terminal returned no state.");
 applyGuildStopwatchRow(row);
}

let scaActiveTimersPoll=null,scaActiveTimersTick=null,scaActiveTimersClockOffset=0,scaActiveTimersLoading=false;
function formatPublicStudyTime(milliseconds){
 let total=Math.max(0,Math.floor(milliseconds/1000));
 const days=Math.floor(total/86400);total%=86400;
 const hours=Math.floor(total/3600);total%=3600;
 const minutes=Math.floor(total/60);const seconds=total%60;
 const clock=[String(hours).padStart(2,"0"),String(minutes).padStart(2,"0"),String(seconds).padStart(2,"0")].join(":");
 return days?days+"d "+clock:clock;
}
function renderScaActiveTimer(person){
 const row=document.createElement("div");row.className="sca-active-user";row.setAttribute("role","listitem");
 const avatar=document.createElement("span");avatar.className="sca-active-user-avatar";
 const label=(person.username||"User").trim();
 if(person.avatar_url){
  const img=document.createElement("img");img.src=person.avatar_url;img.alt="";img.loading="lazy";
  img.onerror=()=>{img.remove();avatar.textContent=(label[0]||"U").toUpperCase();};avatar.append(img);
 }else avatar.textContent=(label[0]||"U").toUpperCase();
 const identity=document.createElement("div");identity.className="sca-active-user-identity";

 const timer=document.createElement("time");timer.className="sca-active-user-timer";timer.dateTime=person.started_at||"";
 timer.dataset.elapsedMs=String(Math.max(0,Number(person.elapsed_ms)||0));
 timer.dataset.startedAt=person.started_at||"";

function tickScaActiveTimers(){
 const list=document.getElementById("sca-active-users-list");if(!list)return;
 list.querySelectorAll(".sca-active-user-timer").forEach(timer=>{
  const elapsed=Number(timer.dataset.elapsedMs)||0;
  const started=Date.parse(timer.dataset.startedAt||"");
  const running=Number.isFinite(started)?Math.max(0,Date.now()+scaActiveTimersClockOffset-started):0;
  const totalMs=elapsed+running;
  timer.textContent=formatPublicStudyTime(totalMs);
  const card=timer.closest(".sca-active-user");
  if(card){
   card.classList.remove("study-time-1h","study-time-2h","study-time-3h","study-time-5h","study-time-7h","study-time-10h");
   const hours=totalMs/3600000;
   if(hours>=10)card.classList.add("study-time-10h");
   else if(hours>=7)card.classList.add("study-time-7h");
   else if(hours>=5)card.classList.add("study-time-5h");
   else if(hours>=3)card.classList.add("study-time-3h");
   else if(hours>=2)card.classList.add("study-time-2h");
   else if(hours>=1)card.classList.add("study-time-1h");
  }
 });
}
async function loadScaActiveTimers(){
 const list=document.getElementById("sca-active-users-list");

 scaActiveTimersLoading=true;
 try{
  const {data,error}=await supabase.rpc("coolanas_public_running_timers",{p_limit:500});
  if(error)throw error;
  const timers=Array.isArray(data)?data:[];
  const serverNow=Date.parse(timers[0]?.server_now||"");
  if(Number.isFinite(serverNow))scaActiveTimersClockOffset=serverNow-Date.now();
  const fragment=document.createDocumentFragment();
  timers.forEach(person=>fragment.append(renderScaActiveTimer(person)));
  if(!timers.length){
   const empty=document.createElement("p");empty.className="sca-active-users-message";
   empty.textContent="No one is studying right now.";fragment.append(empty);
  }
  list.replaceChildren(fragment);

async function searchScaUsers(query){

 friendHint(friendResults,"Searching…");
 const {data,error}=await supabase.rpc("coolanas_friend_search",{p_query:query.trim()});
 if(request!==friendSearchRequest)return;
 if(error){friendHint(friendResults,error.message||"Search failed.");return;}
 friendResults.replaceChildren();
 if(!data?.length){friendHint(friendResults,"No users found.");return;}
 const normalizedQuery=query.trim().toLocaleLowerCase();
 const matches=data;

 for(const person of matches){
  const row=document.createElement("div");row.className="sca-friend-result";if((person.username||"").toLocaleLowerCase()===normalizedQuery)row.classList.add("is-exact-match");

  const action=document.createElement("button");action.type="button";
  let pending=person.friendship_status==="pending";
  const paint=()=>{action.textContent=pending?"Pending":"Add friend";action.classList.toggle("pending",pending);action.disabled=false;};
  paint();
  action.addEventListener("click",async()=>{
   action.disabled=true;
   if(pending){
    const {data:requests,error:requestsError}=await supabase.rpc("coolanas_friend_requests");
    const existing=(requests||[]).find(item=>item.direction==="outgoing"&&item.user_id===person.user_id);

    const {error:cancelError}=await supabase.rpc("coolanas_friend_cancel",{p_friendship_id:existing.friendship_id});

      const {data:result,error:responseError}=await supabase.functions.invoke("coolanas-files-b2",{body:{action:"bucket_invitation_respond",invitationId:notification.invitation_id,response}});
      if(responseError)throw responseError;
      if(result?.error)throw new Error(result.error);
      await refreshMail();
     }catch(error){
      const feedback=document.createElement("span");feedback.className="mail-notification-status";feedback.textContent=error.message||"Could not update this invitation.";card.append(feedback);
      accept.disabled=false;decline.disabled=false;
     }
    };
    accept.addEventListener("click",()=>respond("accept"));
    decline.addEventListener("click",()=>respond("decline"));
    actions.append(accept,decline);card.append(actions);
   }else if(notification.type==="bucket_invitation"&&status){
    const label=document.createElement("span");label.className="mail-notification-status";
    label.textContent=(status==="accepted"||status==="accept")?"Invitation accepted":(status==="declined"||status==="decline")?"Invitation declined":status==="revoked"?"Access withdrawn":"";
    card.append(label);
   }
   if(!notification.read_at){
    supabase.functions.invoke("coolanas-files-b2",{body:{action:"mail_mark_read",notificationId:notification.id}}).catch(()=>{});
   }
   mailNotifications.append(card);
  }
 }catch(error){mailNotifications.replaceChildren();const empty=document.createElement("p");empty.className="mail-empty";empty.textContent=error.message||"Could not load mail.";mailNotifications.append(empty);}
}

function applyTheme(mode){window.CoolanasTheme?.apply(mode);document.documentElement.classList.toggle("dark-mode",mode==="dark");document.documentElement.dataset.theme=mode;themeToggle.textContent=mode==="dark"?"Switch to light mode":"Switch to dark mode";}
applyTheme(window.CoolanasTheme?.get()||"light");

let googleAvatarUrl=user.user_metadata?.avatar_url||user.user_metadata?.picture||"";
let customProfilePicture=false;
function setAvatar(url){
 for(const img of [profileAvatar,drawerAvatar]){img.onerror=null;if(url){img.src=url;img.hidden=false;img.onerror=()=>{img.onerror=null;img.hidden=true;};}else{img.removeAttribute("src");img.hidden=true;}}
 avatarFallback.hidden=Boolean(url);drawerAvatarFallback.hidden=Boolean(url);
 avatarFallback.textContent=String(displayName).trim().charAt(0).toUpperCase()||"?";
 drawerAvatarFallback.textContent=avatarFallback.textContent;
 removePfpButton.hidden=!customProfilePicture;
}
async function profileAction(action,payload={}){const {data,error}=await supabase.functions.invoke("coolanas-files-b2",{body:{action,...payload}});if(error)throw new Error(error.message||"Profile picture request failed.");if(data?.error)throw new Error(data.error);return data;}
async function refreshProfilePicture(){const result=await profileAction("profile_picture_get");customProfilePicture=Boolean(result.exists&&result.url);setAvatar(customProfilePicture?result.url:googleAvatarUrl);}
function closeProfileDrawer(){profileDrawer.classList.remove("open");profileDrawer.setAttribute("aria-hidden","true");profileButton.setAttribute("aria-expanded","false");profileBackdrop.hidden=true;}
function openProfileDrawer(){profileDrawer.classList.add("open");profileDrawer.setAttribute("aria-hidden","false");profileButton.setAttribute("aria-expanded","true");profileBackdrop.hidden=false;}
profileButton.addEventListener("click",openProfileDrawer);
document.getElementById("profile-settings").addEventListener("click",()=>location.assign("/settings.html"));
document.getElementById("profile-close").addEventListener("click",closeProfileDrawer);
profileBackdrop.addEventListener("click",closeProfileDrawer);
document.getElementById("change-pfp").addEventListener("click",()=>profilePictureInput.click());
async function convertProfilePictureToPng(file){
 if(file.size>20*1024*1024)throw new Error("Choose an image smaller than 20 MB.");
 if(!file.type.startsWith("image/")&&!/\.(avif|bmp|gif|heic|heif|jpe?g|png|svg|tiff?|webp)$/i.test(file.name))throw new Error("Choose an image file.");
 let bitmap;try{bitmap=await createImageBitmap(file,{imageOrientation:"from-image"});}catch{throw new Error("This image format cannot be opened by this browser.");}
 try{const side=Math.min(bitmap.width,bitmap.height);if(!side)throw new Error("This image has invalid dimensions.");const canvas=document.createElement("canvas");canvas.width=512;canvas.height=512;const ctx=canvas.getContext("2d",{alpha:true});if(!ctx)throw new Error("Image conversion is unavailable.");ctx.drawImage(bitmap,(bitmap.width-side)/2,(bitmap.height-side)/2,side,side,0,0,512,512);return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("Could not convert image.")),"image/png"));}finally{bitmap.close?.();}
}
profilePictureInput.addEventListener("change",async()=>{const file=profilePictureInput.files?.[0];profilePictureInput.value="";if(!file)return;try{if(file.size>20*1024*1024)throw new Error("Choose an image smaller than 20 MB.");const isGif=file.type==="image/gif"||/\.gif$/i.test(file.name);const contentType=isGif?"image/gif":"image/png";const uploadBody=isGif?file:await convertProfilePictureToPng(file);const signed=await profileAction("profile_picture_upload",{contentType});const response=await fetch(signed.uploadUrl,{method:"PUT",headers:{"Content-Type":contentType},body:uploadBody});if(!response.ok)throw new Error("Image upload failed.");await refreshProfilePicture();closeProfileDrawer();}catch(error){alert(error.message||"Could not update profile picture.");}});
removePfpButton.addEventListener("click",async()=>{try{await profileAction("profile_picture_delete");customProfilePicture=false;setAvatar(googleAvatarUrl);closeProfileDrawer();}catch(error){alert(error.message||"Could not remove profile picture.");}});
async function leaveAccount(){const {error}=await supabase.auth.signOut({scope:"local"});if(error)throw error;location.assign("/index.html");}
document.getElementById("profile-signout").addEventListener("click",async()=>{try{await leaveAccount();}catch(error){alert(error.message);}});
document.getElementById("change-account").addEventListener("click",async()=>{try{await leaveAccount();}catch(error){alert(error.message);}});
document.addEventListener("keydown",event=>{if(event.key==="Escape")closeProfileDrawer();});
setAvatar(googleAvatarUrl);try{await refreshProfilePicture();}catch(error){console.warn("Could not load profile picture:",error.message);}
</script>
