<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A little personal space on the internet.">
  <meta name="theme-color" content="#eaf3ff">
  <title>coolanas — personal space</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2b3d;
      --muted: #718198;
      --paper: #edf5ff;
      --blue: #347bd1;
      --line: rgba(255,255,255,.82);
      --width: 1050px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 28px; }
    body {
      position: relative;
      isolation: isolate;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 9% 5%, rgba(124,183,255,.34), transparent 33rem),
        radial-gradient(ellipse at 92% 32%, rgba(107,202,255,.24), transparent 30rem),
        radial-gradient(ellipse at 55% 92%, rgba(167,194,255,.20), transparent 34rem),
        var(--paper);
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      inset: -25%;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 25% 35%, rgba(93,169,255,.16), transparent 27%),
        radial-gradient(ellipse at 75% 65%, rgba(80,205,255,.13), transparent 29%);
      filter: none;
      animation: none;
    }
    a { color: inherit; }
    button, input { font: inherit; }
    .shell { width: min(var(--width), calc(100% - 48px)); margin: 0 auto; }
    .topbar {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: -.035em;
      text-decoration: none;
    }
    .mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid rgba(84,148,224,.28);
      border-radius: 10px;
      background: #e4f0ff;
      color: #2568b7;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(57,125,204,.10), inset 0 1px 0 #fff;
    }
    .top-right { display: flex; align-items: center; gap: 14px; }
    .top-note { color: var(--muted); font-size: 12px; }
    .login {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #245e9e;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }
    main { padding: 52px 0 150px; }
    .hero {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      min-height: 245px;
      padding: 40px 48px;
      border-radius: 30px;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      width: 390px;
      height: 390px;
      right: 4%;
      top: -115px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f2f9ff 0 13%, #d9edff 31%, #a7cff7 51%, rgba(125,180,245,0) 70%);
      opacity: .9;
      pointer-events: none;
      animation: orb-breathe 9s ease-in-out infinite;
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 110px;
      height: 110px;
      right: 13%;
      bottom: 12%;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 50%;
      box-shadow: 0 0 48px rgba(74,156,237,.13), inset 0 0 28px rgba(255,255,255,.45);
      pointer-events: none;
      animation: orbit-drift 12s ease-in-out infinite;
    }
    .hero-copy { position: relative; z-index: 1; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 20px;
      color: #3474bd;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4d9be9;
      box-shadow: 0 0 0 5px #e7f2ff, 0 0 18px rgba(55,147,239,.68);
      animation: none;
    }
    h1 {
      max-width: 610px;
      margin: 0;
      font-size: clamp(44px, 7vw, 76px);
      font-weight: 650;
      line-height: .96;
      letter-spacing: -.08em;
    }
    .hero-copy p {
      max-width: 440px;
      margin: 21px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .hero-aside {
      position: relative;
      z-index: 2;
      justify-self: end;
      width: min(100%, 215px);
      padding: 20px;
      border-radius: 19px;
      transform: rotate(3deg);
    }
    .aside-label { color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .date { margin-top: 8px; color: #244d7b; font-size: 25px; font-weight: 750; letter-spacing: -.055em; }
    .aside-bottom { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: #3679c8; font-size: 11px; }
    .sparkle { display: inline-block; font-size: 17px; animation: none; }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin: 42px 2px 16px;
    }
    h2 { margin: 0; font-size: 14px; font-weight: 750; letter-spacing: -.02em; }
    .section-hint { color: #8192a8; font-size: 11px; }
    .shortcut-grid { display: grid; grid-template-columns: minmax(210px, 260px); gap: 14px; }
    .shortcut {
      position: relative;
      display: flex;
      min-height: 125px;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      padding: 18px;
      border-radius: 18px;
      text-decoration: none;
      transition: border-color .25s ease, box-shadow .25s ease;
    }
    .shortcut-icon {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 11px;
      color: #276fba;
      background: linear-gradient(145deg, rgba(255,255,255,.96), rgba(198,226,255,.72));
      box-shadow: inset 0 1px 0 #fff, 0 4px 12px rgba(56,113,184,.09);
    }
    .shortcut-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .shortcut-name { font-size: 13px; font-weight: 750; }
    .arrow { color: #6596c7; font-size: 16px; transition: transform .25s ease; }
    .shortcut:hover .arrow { transform: translate(3px,-3px); }
    .dock-wrap {
      position: fixed;
      z-index: 20;
      right: 16px;
      bottom: max(22px, env(safe-area-inset-bottom));
      left: 16px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    .dock-group { display: flex; align-items: center; gap: 9px; pointer-events: auto; }
    .dock {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px;
      border-radius: 21px;
    }
    .dock a {
      display: flex;
      min-width: 78px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 8px 12px;
      border-radius: 14px;
      color: #71869e;
      font-size: 10px;
      font-weight: 650;
      text-decoration: none;
      transition: color .2s ease, background .2s ease;
    }
    .dock a:hover, .dock a[aria-current="page"] {
      background: linear-gradient(145deg, rgba(255,255,255,.92), rgba(189,221,255,.72));
      color: #155cae;
    }
    .dock svg { width: 17px; height: 17px; stroke: currentColor; }
    .ai-launch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 54px;
      padding: 0 17px;
      border: 1px solid rgba(255,255,255,.92);
      border-radius: 18px;
      color: #155cae;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .ai-launch svg { width: 17px; height: 17px; stroke: currentColor; }
    .ai-launch kbd {
      padding: 2px 5px;
      border: 1px solid rgba(70,130,195,.18);
      border-radius: 5px;
      color: #6c8daf;
      font: 9px ui-monospace, monospace;
    }

    /* Shared liquid-glass surface treatment. */
    .liquid-glass {
      --glow-x: 16%;
      --glow-y: 10%;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.86);
      background: linear-gradient(145deg,
        rgba(255,255,255,.78),
        rgba(235,246,255,.50) 38%,
        rgba(207,230,255,.36) 72%,
        rgba(255,255,255,.50));
      -webkit-backdrop-filter: blur(12px) saturate(145%);
      backdrop-filter: blur(12px) saturate(145%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.98),
        inset 1px 0 0 rgba(255,255,255,.62),
        inset -1px 0 0 rgba(111,174,246,.25),
        inset 0 -1px 0 rgba(79,142,224,.22),
        0 18px 46px rgba(44,105,181,.10),
        0 3px 10px rgba(35,74,128,.06);
    }
    .liquid-glass::after {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(240px circle at var(--glow-x) var(--glow-y),
          rgba(255,255,255,.66), rgba(225,242,255,.17) 38%, transparent 72%),
        linear-gradient(145deg, rgba(255,255,255,.33), transparent 24% 68%, rgba(75,151,243,.12));
      opacity: .92;
      mix-blend-mode: normal;
    }
    .liquid-glass > * { position: relative; z-index: 1; }
    .hero.liquid-glass {
      box-shadow: inset 0 1px 0 rgba(255,255,255,1), inset 0 0 0 1px rgba(123,180,242,.12),
        0 24px 62px rgba(44,105,181,.12), 0 4px 14px rgba(35,74,128,.05);
    }
    .hero-aside.liquid-glass {
      background: linear-gradient(145deg, rgba(255,255,255,.82), rgba(214,235,255,.46));
      box-shadow: inset 0 1px 0 #fff, inset 1px 0 0 rgba(255,255,255,.72), 0 15px 34px rgba(53,108,174,.14);
    }
    .shortcut.liquid-glass { background: linear-gradient(145deg, rgba(255,255,255,.78), rgba(220,239,255,.48)); }
    .shortcut.liquid-glass:hover, .ai-launch:hover {
      border-color: rgba(112,177,245,.92);
      box-shadow: inset 0 1px 0 #fff, inset 0 0 0 1px rgba(116,174,239,.20), 0 20px 38px rgba(48,111,190,.16);
    }

    /* Entrance, ambient and hover motion. */
    .reveal {
      opacity: 0;
      transform: translateY(22px) scale(.985);
      animation: reveal-in .9s cubic-bezier(.2,.8,.2,1) forwards;
      animation-delay: var(--delay, 0ms);
    }
    .float-gently { animation: none; }
    @keyframes reveal-in {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes atmosphere-drift {
      0% { transform: translate3d(-2%, -1%, 0) rotate(-4deg) scale(1); }
      100% { transform: translate3d(2%, 2%, 0) rotate(4deg) scale(1.08); }
    }
    @keyframes orb-breathe {
      0%,100% { transform: scale(.97); opacity: .78; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes orbit-drift {
      0%,100% { transform: translate(0,0) scale(1); opacity: .42; }
      50% { transform: translate(-12px,-8px) scale(1.12); opacity: .8; }
    }
    @keyframes float-gently {
      0%,100% { transform: translateY(0) rotate(3deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }
    @keyframes status-pulse {
      0%,100% { box-shadow: 0 0 0 4px #e7f2ff, 0 0 12px rgba(55,147,239,.35); }
      50% { box-shadow: 0 0 0 7px rgba(231,242,255,.55), 0 0 22px rgba(55,147,239,.6); }
    }
    @keyframes sparkle-turn { to { transform: rotate(360deg); } }
    @keyframes hover-float {
      0%,100% { transform: translateY(-3px) scale(1); }
      50% { transform: translateY(-8px) scale(1.012); }
    }
    @keyframes glass-breathe {
      0%,100% { opacity: .66; filter: brightness(1); }
      50% { opacity: 1; filter: brightness(1.12); }
    }
    @keyframes nav-bob {
      0%,100% { transform: translateY(-2px); }
      50% { transform: translateY(-5px); }
    }
    @media (hover:hover) and (pointer:fine) {
      .shortcut:hover, .stat-card:hover, .panel:hover, .collection-card:hover, .ai-launch:hover {
        border-color: rgba(112,177,245,.78);
        box-shadow: 0 12px 28px rgba(48,111,190,.12);
      }
      .dock a:hover { background: rgba(255,255,255,.55); }
    }

</style>
</head>
<body id="top">
  <header class="shell topbar reveal" style="--delay:40ms">
    <a class="wordmark" href="#top" aria-label="coolanas home">
      <span class="mark">c.</span><span>coolanas</span>
    </a>
    <div class="top-right">
      
      <a class="login liquid-glass" href="dashboard.html" data-searchable>Login <span aria-hidden="true">↗</span></a>
    </div>
  </header>

  <main class="shell">
    <section class="hero liquid-glass reveal" aria-labelledby="welcome-title" style="--delay:150ms">
      <div class="hero-copy">
        
        <h1 id="welcome-title">Hello stranger</h1>
        <p>This is my land - you can inspect it and also do some stuff</p>
      </div>
    </section>

    <section id="links" aria-labelledby="links-title" class="reveal" style="--delay:340ms">
      <div class="section-head">
        
        
      </div>
      <div class="shortcut-grid">
        <a class="shortcut liquid-glass hover-float" href="https://github.com/mnotion/coolanas.com" target="_blank" rel="noopener noreferrer" data-searchable>
          <span class="shortcut-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-4.3 1.3-4.3-2.2-6-2.7M15 21v-3.3a3 3 0 0 0-.8-2.3c2.7-.3 5.5-1.3 5.5-6A4.7 4.7 0 0 0 18.4 6a4.3 4.3 0 0 0-.1-3S17.3 2.7 15 4.3a13 13 0 0 0-6 0C6.7 2.7 5.7 3 5.7 3A4.3 4.3 0 0 0 5.6 6a4.7 4.7 0 0 0-1.3 3.4c0 4.7 2.8 5.7 5.5 6A3 3 0 0 0 9 17.7V21"/></svg>
          </span>
          <span class="shortcut-bottom"><span class="shortcut-name">GitHub</span><span class="arrow">↗</span></span>
        </a>
      </div>
    </section>
  </main>

  <button class="search-close" id="ai-close" type="button" aria-label="Close s</body>
</html>
