<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Login — coolanas</title>
  <style>
    * { box-sizing: border-box; }
    html { overflow-x: clip; }
    body {
      min-height:100vh; margin:0; padding:24px; display:grid; place-items:center;
      overflow-x:clip; background:#fff; color:#000;
      font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    main {
      width:min(480px,100%); padding:40px; background:#fff; border:0; border-radius:16px;
      box-shadow:0 14px 36px rgba(0,0,0,.13),0 3px 10px rgba(0,0,0,.07);
    }
    h1 { margin:0 0 8px; font-size:clamp(3rem,8vw,5rem); line-height:1.02; font-weight:800; letter-spacing:-.07em; }
    .subtitle { margin:0 0 34px; }
    button {
      display:block; width:100%; min-height:50px; padding:12px 16px; border:1px solid #000;
      border-radius:9px; background:#000; color:#fff; font:700 14px/1.2 inherit; cursor:pointer;
    }
    button:hover { background:#292929; }
    button:disabled { opacity:.55; cursor:wait; }
    .passkey { min-height:56px; }
    .secondary {
      margin-top:12px; background:#fff; color:#111; border-color:#bbb;
    }
    .secondary:hover { background:#f4f4f4; }
    .pin-panel { margin-top:24px; padding-top:22px; border-top:1px solid #e5e5e5; }
    [hidden] { display:none !important; }
    label { display:block; margin:0 0 8px; font-size:13px; font-weight:700; }
    input {
      display:block; width:100%; height:52px; padding:0 14px; border:1px solid #000;
      border-radius:9px; background:#fff; color:#000; font:inherit; outline-offset:3px;
    }
    .error { min-height:18px; margin:12px 2px 0; color:#333; font-size:13px; overflow-wrap:anywhere; }
    .error[data-kind="success"] { color:#176b37; }
    .error[data-kind="error"] { color:#a00000; }
    @media(max-width:480px) { main { padding:28px; } }
  </style>
</head>
<body>
  <main>
    <h1>Welcome.</h1>
    <p class="subtitle">Choose how to sign in.</p>

    <button class="passkey" id="passkey-login" type="button">Continue with fingerprint</button>
    <p class="error" id="passkey-status" role="status" aria-live="polite"></p>

    <button class="secondary" id="show-pin" type="button">Use PIN instead</button>

    <form class="pin-panel" id="pin-form" novalidate hidden>
      <label for="pin">Your PIN</label>
      <input id="pin" name="pin" type="password" inputmode="text" autocomplete="off"
        autocapitalize="characters" maxlength="16" aria-describedby="pin-error">
      <button type="submit" id="pin-submit">Continue with PIN</button>
      <p class="error" id="pin-error" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script type="module" src="js/pin.js"></script>
</body>
</html>
