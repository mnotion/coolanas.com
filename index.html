<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Login — coolanas</title>
  <style>
    * { box-sizing: border-box; }
    html { overflow-x: clip; }
    body {
      min-height:100vh; margin:0; padding:24px; display:grid; place-items:center;
      overflow-x:clip; background:#fff; color:#000;
      font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    main {
      width:min(600px,100%); padding:44px; background:#fff; border-radius:18px;
      box-shadow:0 14px 36px rgba(0,0,0,.13),0 3px 10px rgba(0,0,0,.07);
    }
    h1 { margin:0 0 8px; font-size:clamp(3.2rem,9vw,6rem); line-height:1.02; font-weight:800; letter-spacing:-.075em; }
    p { margin:0 0 30px; }
    button {
      display:block; width:100%; min-height:62px; padding:14px 16px; border:1px solid #000;
      border-radius:10px; background:#000; color:#fff; font:700 15px/1.2 Inter,ui-sans-serif,system-ui,sans-serif; cursor:pointer;
    }
    button:hover { background:#292929; }
    button:disabled { opacity:.55; cursor:wait; }
    .status { min-height:18px; margin:14px 2px 0; color:#333; font-size:13px; overflow-wrap:anywhere; }
    .status[data-kind="error"] { color:#a00000; }
    .auth-form{display:grid;gap:10px;margin-top:22px}
    .auth-form input{width:100%;height:48px;padding:0 13px;border:1px solid #ddd;border-radius:9px;font:inherit}
    .auth-form button{min-height:48px}
    .secondary{background:#fff;color:#111}
    .auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .auth-actions button{min-height:44px;font-size:13px}
    @media(max-width:480px) { main { padding:28px; } }
  </style>
</head>
<body>
  <main>
    <h1>Welcome.</h1>
    <p>Sign in with your fingerprint.</p>
    <button id="passkey-login" type="button">Continue with fingerprint</button>
    <p class="status" id="passkey-status" role="status" aria-live="polite">Loading passkey sign-in…</p>
    <div class="auth-form">
      <input id="email" type="email" autocomplete="email" placeholder="Email address" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password (at least 8 characters)" minlength="8" required>
      <div class="auth-actions">
        <button class="secondary" id="email-login" type="button">Sign in</button>
        <button id="signup" type="button">Sign up</button>
      </div>
      <p class="status" id="email-status" role="status" aria-live="polite">Friends can create their own account here.</p>
    </div>
  </main>

  <script type="module">
    const SUPABASE_URL = "https://nacwftrsdpglzrhasmit.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4OLO5cw2lr_l90MECEAG0A_MJY1NQQF";
    const OWNER_USER_ID = "bfc1c21b-11a1-4020-9a2f-2846dd4069bf";
    let supabaseClient;
    async function getClient(){
      if(!supabaseClient){
        const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2.119.0");
        supabaseClient=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,experimental:{passkey:true}}});
      }
      return supabaseClient;
    }
    const emailStatus=document.getElementById("email-status");
    const emailInput=document.getElementById("email");
    const passwordInput=document.getElementById("password");
    async function emailAuth(mode){
      const email=emailInput.value.trim(),password=passwordInput.value;
      if(!email||password.length<8){emailStatus.textContent="Enter a valid email and a password with at least 8 characters.";emailStatus.dataset.kind="error";return;}
      const buttons=[document.getElementById("email-login"),document.getElementById("signup")];buttons.forEach(b=>b.disabled=true);
      try{
        const client=await getClient();
        const result=mode==="signup"
          ? await client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+"/dashboard.html"}})
          : await client.auth.signInWithPassword({email,password});
        if(result.error)throw result.error;
        if(mode==="signup"&&!result.data.session){emailStatus.textContent="Account created. Check your email to confirm it, then sign in.";return;}
        location.replace("dashboard.html");
      }catch(error){emailStatus.textContent=error.message||"Authentication failed.";emailStatus.dataset.kind="error";}
      finally{buttons.forEach(b=>b.disabled=false);}
    }
    document.getElementById("email-login").addEventListener("click",()=>emailAuth("login"));
    document.getElementById("signup").addEventListener("click",()=>emailAuth("signup"));

    const button = document.getElementById("passkey-login");
    const status = document.getElementById("passkey-status");
    const showStatus = (message, kind = "") => {
      status.textContent = message;
      status.dataset.kind = kind;
    };

    button.addEventListener("click", async () => {
      if (!window.isSecureContext || !window.PublicKeyCredential || !navigator.credentials) {
        showStatus("Passkeys are not supported by this browser or page.", "error");
        return;
      }

      button.disabled = true;
      showStatus("Waiting for your device's passkey prompt…");
      try {
        const supabase = await getClient();
        const { data, error } = await supabase.auth.signInWithPasskey();
        if (error) throw error;
        if (data.user?.id !== OWNER_USER_ID) {
          await supabase.auth.signOut();
          throw new Error("This passkey is not authorised for this site.");
        }

        sessionStorage.setItem("coolanas-pin-unlocked", "1");
        location.replace("dashboard.html");
      } catch (error) {
        showStatus(error?.message || "Passkey sign-in failed.", "error");
      } finally {
        button.disabled = false;
      }
    });

    showStatus("Ready. Use your device's saved passkey.");
  </script>
</body>
</html>
