<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Login — coolanas</title>
  <link rel="stylesheet" href="css/pin.css">
</head>
<body>
  <main class="pin-card">
    <h1>Welcome back</h1>
    <p>Enter your PIN to continue.</p>
    <form id="pin-form">
      <label for="pin">Your PIN</label>
      <input id="pin" name="pin" type="password" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="16" required aria-describedby="pin-error" autofocus>
      <button type="submit">Continue</button>
      <div class="error" id="pin-error" role="alert" aria-live="polite"></div>
    </form>
  </main>
  <script src="js/pin.js"></script>
</body>
</html>
