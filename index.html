<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Coolanas</title>
  <style>
    * { box-sizing: border-box; }
    html { overflow-x: clip; color-scheme:light; }
    html[data-theme="dark"] { color-scheme:dark; }
    body {
      min-height:100vh; margin:0; padding:24px; display:grid; place-items:center;
      overflow-x:clip; background:#fff; color:#000;
      font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-tap-highlight-color:transparent;
    }
    main {
      width:min(600px,100%); padding:44px; background:#fff; border-radius:18px;
      box-shadow:0 14px 36px rgba(0,0,0,.13),0 3px 10px rgba(0,0,0,.07);
    }
    h1 { margin:0 0 30px; font-size:clamp(3.2rem,9vw,6rem); line-height:1.02; font-weight:800; letter-spacing:-.075em; }
    button {
      display:flex; align-items:center; justify-content:center; gap:12px;
      width:100%; min-height:58px; padding:14px 18px;
      border:1px solid #dadce0; border-radius:6px; background:#fff; color:#3c4043;
      font:600 15px/1.2 Arial,Roboto,sans-serif; cursor:pointer;
      -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    }
    @media (hover:hover) and (pointer:fine) { button:hover { background:#f8faff; border-color:#d2e3fc; box-shadow:0 1px 2px rgba(60,64,67,.18); } }
    button:active { background:#f3f4f4; }
    button:disabled { opacity:.55; cursor:wait; }
    button:focus:not(:focus-visible) { outline:none; box-shadow:none; }
    button:focus-visible { outline:2px solid #777; outline-offset:3px; }
    @media (hover:none) and (pointer:coarse) { button:focus,button:focus-visible { outline:none!important; box-shadow:none!important; } }
    .google-logo { width:20px; height:20px; flex:none; }
    .status { margin:16px 2px 0; color:#a00000; font-size:13px; overflow-wrap:anywhere; }
    .status[hidden] { display:none; }
    .theme-toggle{
      position:fixed;top:18px;right:18px;z-index:5;
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      width:auto;min-height:42px;padding:9px 13px;border:1px solid #dadce0;
      border-radius:999px;background:#fff;color:#202124;
      font:600 13px/1 ui-sans-serif,system-ui,sans-serif;
    }
    html[data-theme="dark"] body{background:#111;color:#f5f5f5}
    html[data-theme="dark"] main{background:#1d1d1f;color:#f5f5f5;box-shadow:0 14px 36px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.3)}
    html[data-theme="dark"] #google-login{background:#292a2d;border-color:#5f6368;color:#e8eaed}
    html[data-theme="dark"] #google-login:active{background:#35363a}
    html[data-theme="dark"] .theme-toggle{background:#292a2d;border-color:#5f6368;color:#f5f5f5}
    html[data-theme="dark"] .status{color:#ff8a80}
    @media(max-width:480px) { main { padding:28px; } .theme-toggle{top:12px;right:12px;} }
  </style>
</head>
<body>
  <main>
    <h1 id="greeting">Welcome</h1>
    <button id="google-login" type="button">
      <img class="google-logo" src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="" aria-hidden="true">
      <span>Continue with Google</span>
    </button>
    <p class="status" id="login-status" role="status" aria-live="polite" hidden></p>
  </main>

  <script type="module">
    const SUPABASE_URL = "https://nacwftrsdpglzrhasmit.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4OLO5cw2lr_l90MECEAG0A_MJY1NQQF";
    const googleButton = document.getElementById("google-login");
    const status = document.getElementById("login-status");
    const themeToggle = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-icon");
    const themeLabel = document.getElementById("theme-label");
    const savedTheme = localStorage.getItem("coolanas-theme");
    const initialTheme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      const dark = theme === "dark";
      themeIcon.textContent = dark ? "☀" : "☾";
      themeLabel.textContent = dark ? "Light mode" : "Dark mode";
      themeToggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      themeToggle.setAttribute("aria-pressed", String(dark));
      document.querySelector('meta[name="theme-color"]').content = dark ? "#111111" : "#ffffff";
    }
    applyTheme(initialTheme);
    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem("coolanas-theme", next);
      applyTheme(next);
    });
    const greetings = [
      "Welcome", "Hello", "Hey there", "Good to see you", "Nice to see you",
      "Welcome back", "Hello again", "Good day", "Glad you're here", "Let's get started"
    ];
    document.getElementById("greeting").textContent = greetings[Math.floor(Math.random() * greetings.length)];

    let supabase;
    async function getClient() {
      if (!supabase) {
        const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2.119.0");
        supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        });
      }
      return supabase;
    }

    googleButton.addEventListener("click", async () => {
      googleButton.disabled = true;
      status.hidden = false;
      status.textContent = "Redirecting to Google…";
      try {
        const client = await getClient();
        const { error } = await client.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: "https://coolanas.com/dashboard.html",
            queryParams: { prompt: "select_account" }
          }
        });
        if (error) throw error;
      } catch (error) {
        status.textContent = error?.message || "Google sign-in could not start. Try again.";
        googleButton.disabled = false;
      }
    });

    (async () => {
      try {
        const client = await getClient();
        const { data: { session }, error } = await client.auth.getSession();
        if (error) throw error;
        if (session) location.replace("dashboard.html");
      } catch (error) {
        status.hidden = false;
        status.textContent = error?.message || "Could not check your sign-in session.";
      }
    })();
  </script>
</body>
</html>
