<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Login — coolanas</title>
  <style>
    * { box-sizing: border-box; }
    html { overflow-x: clip; }
    body {
      min-height:100vh; margin:0; padding:24px; display:grid; place-items:center;
      overflow-x:clip; background:#fff; color:#000;
      font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    main {
      width:min(600px,100%); padding:44px; background:#fff; border-radius:18px;
      box-shadow:0 14px 36px rgba(0,0,0,.13),0 3px 10px rgba(0,0,0,.07);
    }
    h1 { margin:0 0 8px; font-size:clamp(3.2rem,9vw,6rem); line-height:1.02; font-weight:800; letter-spacing:-.075em; }
    .subtitle { margin:0 0 34px; }
    button {
      display:block; width:100%; min-height:54px; padding:14px 16px; border:1px solid #000;
      border-radius:10px; background:#000; color:#fff; font:700 15px/1.2 Inter,ui-sans-serif,system-ui,sans-serif; cursor:pointer;
    }
    button:hover { background:#292929; }
    button:disabled { opacity:.55; cursor:wait; }
    .passkey { min-height:62px; }
    .secondary { margin-top:14px; background:#fff; color:#111; border-color:#bbb; }
    .secondary:hover { background:#f4f4f4; }
    .pin-panel { margin-top:24px; padding-top:22px; border-top:1px solid #e5e5e5; }
    [hidden] { display:none !important; }
    label { display:block; margin:0 0 8px; font-size:13px; font-weight:700; }
    input {
      display:block; width:100%; height:54px; margin-bottom:12px; padding:0 14px;
      border:1px solid #000; border-radius:9px; background:#fff; color:#000; font:inherit;
    }
    .status { min-height:18px; margin:12px 2px 0; color:#333; font-size:13px; overflow-wrap:anywhere; }
    .status[data-kind="success"] { color:#176b37; }
    .status[data-kind="error"] { color:#a00000; }
    @media(max-width:480px) { main { padding:28px; } }
  </style>
</head>
<body>
  <main>
    <h1>Welcome.</h1>
    <p class="subtitle">Choose how to sign in.</p>

    <button class="passkey" id="passkey-login" type="button">Continue with fingerprint</button>
    <p class="status" id="passkey-status" role="status" aria-live="polite">Loading passkey sign-in…</p>

    <button class="secondary" id="show-pin" type="button">Use PIN instead</button>

    <form class="pin-panel" id="pin-form" novalidate hidden>
      <label for="pin">Your PIN</label>
      <input id="pin" name="pin" type="password" inputmode="text" autocomplete="off"
        autocapitalize="characters" maxlength="16" aria-describedby="pin-status">
      <button type="submit" id="pin-submit">Continue with PIN</button>
      <p class="status" id="pin-status" role="alert" aria-live="polite"></p>
    </form>
  </main>

  <script type="module">
    const SUPABASE_URL = "https://nacwftrsdpglzrhasmit.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4OLO5cw2lr_l90MECEAG0A_MJY1NQQF";
    const OWNER_USER_ID = "bfc1c21b-11a1-4020-9a2f-2846dd4069bf";

    const passkeyButton = document.getElementById("passkey-login");
    const passkeyStatus = document.getElementById("passkey-status");
    const showPinButton = document.getElementById("show-pin");
    const pinForm = document.getElementById("pin-form");
    const pinField = document.getElementById("pin");
    const pinStatus = document.getElementById("pin-status");
    const pinSubmit = document.getElementById("pin-submit");

    const showStatus = (element, message, kind = "") => {
      element.textContent = message;
      element.dataset.kind = kind;
    };

    let supabase;

    showPinButton.addEventListener("click", () => {
      pinForm.hidden = !pinForm.hidden;
      showPinButton.textContent = pinForm.hidden ? "Use PIN instead" : "Hide PIN login";
      if (!pinForm.hidden) pinField.focus();
    });

    passkeyButton.addEventListener("click", async () => {
      if (!supabase) {
        showStatus(passkeyStatus, "Login is still loading. Refresh the page and try again.", "error");
        return;
      }
      if (!window.isSecureContext || !window.PublicKeyCredential || !navigator.credentials) {
        showStatus(passkeyStatus, "Passkeys are not supported by this browser or page.", "error");
        return;
      }

      passkeyButton.disabled = true;
      showStatus(passkeyStatus, "Waiting for your device's passkey prompt…");
      try {
        const { data, error } = await supabase.auth.signInWithPasskey();
        if (error) {
          showStatus(passkeyStatus, error.message || "Passkey sign-in failed.", "error");
          return;
        }
        if (data.user?.id !== OWNER_USER_ID) {
          await supabase.auth.signOut();
          showStatus(passkeyStatus, "This passkey is not authorised for this site.", "error");
          return;
        }
        sessionStorage.setItem("coolanas-pin-unlocked", "1");
        location.replace("dashboard.html");
      } catch (error) {
        showStatus(passkeyStatus, error?.message || "Passkey sign-in was cancelled or failed.", "error");
      } finally {
        passkeyButton.disabled = false;
      }
    });

    pinForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      showStatus(pinStatus, "");
      const pin = pinField.value.trim().toUpperCase();
      if (!pin) {
        showStatus(pinStatus, "Enter your PIN first.", "error");
        return;
      }
      if (!supabase) {
        showStatus(pinStatus, "Login is still loading. Refresh the page and try again.", "error");
        return;
      }

      pinSubmit.disabled = true;
      pinSubmit.textContent = "Checking…";
      try {
        const { data, error } = await supabase.functions.invoke(
          "coolanas-pin-passkey-session",
          { body: { pin } }
        );
        if (error || !data?.sent) {
          showStatus(pinStatus, data?.error || error?.message || "Could not verify the PIN.", "error");
          return;
        }
        pinField.value = "";
        showStatus(pinStatus, "PIN accepted. Check your email for the one-time sign-in link.", "success");
        pinSubmit.textContent = "Email sent";
      } catch (error) {
        showStatus(pinStatus, error?.message || "Connection failed. Try again.", "error");
      } finally {
        if (pinSubmit.textContent !== "Email sent") {
          pinSubmit.disabled = false;
          pinSubmit.textContent = "Continue with PIN";
        }
      }
    });

    try {
      const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2.119.0");
      supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: false,
          experimental: { passkey: true }
        }
      });
      showStatus(passkeyStatus, "Ready. Use your device's saved passkey.");
    } catch (error) {
      showStatus(passkeyStatus, "Could not load sign-in: " + (error?.message || "module load failed"), "error");
      passkeyButton.disabled = true;
    }
  </script>
</body>
</html>
