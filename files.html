<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Files · mnotion</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0;background:#f7f7f7;color:#111;transition:background .18s ease}
    body{min-height:100vh;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;padding:24px 24px 100px}
    .add-wrap{position:relative;z-index:31;display:flex;align-items:center;justify-content:center;width:168px;min-height:176px;flex:none;border-radius:12px}
    .add-button{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(0,0,0,.06);border-radius:12px;background:#f1f2f3;color:#555;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.045);transition:background .15s,transform .15s}
    .add-button:hover{background:#e8e9eb;transform:scale(1.04)}
    .add-button svg{width:20px;height:20px}
    .add-menu{position:absolute;z-index:30;top:50px;left:0;width:170px;padding:5px;border:1px solid #eee;border-radius:11px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12)}
    .add-menu[hidden]{display:none}
    .add-option{display:block;width:100%;padding:10px;border:0;border-radius:7px;background:transparent;color:#222;text-align:left;font:13px/1.4 Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer}
    .add-option:hover{background:#f2f2f2}
    .files-list{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:18px;width:100%;margin:0;padding:0}
    .file-card{display:flex;flex-direction:column;align-items:center;gap:10px;width:168px;min-height:176px;padding:18px;border:0;border-radius:12px;background:#fff;color:#222;font:inherit;font-size:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.07);cursor:pointer;transform:scale(var(--card-scale,1));transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease;transform-origin:center;position:relative;z-index:var(--card-z,1)}
    .file-card:hover,.file-card.is-pointer-hover{background:#fafafa;box-shadow:0 5px 16px rgba(0,0,0,.10);}
    .file-card:focus-visible{outline:2px solid #aaa;outline-offset:3px}
    .file-card.is-pointer-near{box-shadow:0 4px 14px rgba(0,0,0,.085)}
    .files-toolbar{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 18px;color:#333}
    .files-toolbar[hidden]{display:none}
    .crumb-button{border:0;background:transparent;padding:5px 8px;border-radius:7px;font:inherit;cursor:pointer}
    .crumb-button:hover{background:#f1f1f1}
    .crumb-current{font-size:14px;color:#777}
    .file-viewer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(20,20,20,.24);backdrop-filter:blur(5px)}
    .file-viewer[hidden]{display:none}
    .viewer-panel{width:min(900px,100%);height:min(720px,90vh);display:flex;flex-direction:column;overflow:hidden;border:1px solid #eee;border-radius:16px;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.18)}
    .viewer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #eee}
    .viewer-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .viewer-close{width:32px;height:32px;border:0;border-radius:8px;background:#f1f1f1;font-size:20px;cursor:pointer}
    .viewer-content{flex:1;min-height:0;overflow:auto;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}
    .viewer-content img,.viewer-content iframe{display:block;width:100%;height:100%;border:0;object-fit:contain}
    .folder-icon{width:112px;height:112px;flex:none;color:#e3b52f}
    .file-icon{width:112px;height:112px;flex:none;color:#888}
    .file-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .drop-hint{position:fixed;inset:12px;z-index:20;display:grid;place-items:center;border:2px dashed #b9bdc2;border-radius:18px;background:rgba(245,246,247,.88);color:#555;font-size:16px;pointer-events:none}
    .drop-hint[hidden]{display:none}
    .bottom-nav{
      position:fixed;z-index:10;left:50%;bottom:20px;transform:translateX(-50%);
      width:min(260px,calc(100% - 24px));min-height:44px;padding:3px;
      display:grid;grid-template-columns:repeat(3,1fr);gap:3px;
      background:rgba(235,236,238,.9);border:1px solid rgba(0,0,0,.06);
      border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.055),inset 0 1px 0 rgba(255,255,255,.65);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)
    }
    .nav-button{
      display:flex;align-items:center;justify-content:center;min-height:36px;
      border:1px solid rgba(0,0,0,.045);border-radius:9px;
      background:rgba(255,255,255,.28);color:#555;cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
      position:relative;z-index:1;
      transition:transform .08s ease-out,background .16s ease,border-color .16s ease,box-shadow .16s ease;
      -webkit-tap-highlight-color:transparent
    }
    .bottom-nav:has(.nav-button:hover) .nav-button:not(:hover):not([aria-current="page"]){transform:scale(.94)}
    .nav-button:hover{z-index:2;transform:translate3d(var(--shift-x,0px),var(--shift-y,0px),0) scale(1.12);background:rgba(255,255,255,.72);border-color:rgba(0,0,0,.09);box-shadow:0 4px 12px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.8)}
    .nav-button:active{transform:translate3d(var(--shift-x,0px),var(--shift-y,0px),0) scale(1.06)}
    .nav-button svg{width:17px;height:17px}
    .nav-button[aria-current="page"]{color:#333;background:rgba(185,188,192,.48);border-color:rgba(0,0,0,.10);box-shadow:inset 0 1px 2px rgba(0,0,0,.07)}
    body:has(.bottom-nav:hover),body:has(.bottom-nav:focus-within){background:#d9d9d9}
    body:has(.bottom-nav:hover) main,body:has(.bottom-nav:focus-within) main{filter:brightness(.72) blur(2px)}
    .panel{position:fixed;z-index:9;left:50%;bottom:84px;transform:translateX(-50%);width:min(420px,calc(100% - 32px));padding:18px;border:1px solid rgba(255,255,255,.9);border-radius:18px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 34px rgba(0,0,0,.11),inset 0 1px 0 #fff}
    .panel[hidden]{display:none}
    .panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .panel-heading h2{margin:0;font-size:15px;font-weight:650}
    .close-button{width:30px;height:30px;border:0;border-radius:8px;background:rgba(0,0,0,.05);cursor:pointer;font-size:19px;line-height:1}
    .search-input{width:100%;height:42px;padding:0 12px;border:1px solid #ddd;border-radius:9px;outline:none;font:inherit;background:rgba(255,255,255,.85)}
    .menu-list{display:grid;gap:3px}
    .menu-item{display:block;width:100%;padding:11px;border:0;border-radius:8px;background:transparent;color:#222;text-align:left;font:500 13px Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer}
    .menu-item:hover{background:rgba(0,0,0,.05)}
    @media(max-width:480px){main{padding:16px 16px 90px}.bottom-nav{bottom:12px}.panel{bottom:76px}}
    @media(prefers-reduced-motion:reduce){html,body{transition:none}.nav-button{transition:none}.nav-button:hover,.nav-button:active,.bottom-nav:has(.nav-button:hover) .nav-button:not(:hover){transform:none}body:has(.bottom-nav:hover) main,body:has(.bottom-nav:focus-within) main{filter:none}}
  </style>
</head>
<body>
  <main aria-label="Files">
    <input id="file-picker" type="file" multiple style="position:fixed;left:-10000px;width:1px;height:1px;opacity:0">
    <input id="folder-picker" type="file" webkitdirectory multiple style="position:fixed;left:-10000px;width:1px;height:1px;opacity:0">
    <div class="files-toolbar" id="files-toolbar" hidden><button class="crumb-button" id="back-folder" type="button">← Back</button><span class="crumb-current" id="current-folder"></span></div>
    <div class="files-list" id="files-list" role="list" aria-label="Files and folders"></div>
  </main>
  <div class="drop-hint" id="drop-hint" hidden>Drop files or folders to add them</div>
  <div class="file-viewer" id="file-viewer" hidden><section class="viewer-panel"><header class="viewer-head"><strong id="viewer-title"></strong><button class="viewer-close" id="viewer-close" type="button" aria-label="Close">×</button></header><div class="viewer-content" id="viewer-content"></div></section></div>
  <section class="panel" id="search-panel" aria-label="Search" hidden>
    <div class="panel-heading"><h2>Search</h2><button class="close-button" type="button" data-close aria-label="Close">×</button></div>
    <input class="search-input" type="search" placeholder="Search…" autocomplete="off">
  </section>
  <section class="panel" id="menu-panel" aria-label="Menu" hidden>
    <div class="panel-heading"><h2>Menu</h2><button class="close-button" type="button" data-close aria-label="Close">×</button></div>
    <nav class="menu-list"><button class="menu-item" type="button" onclick="location.href='dashboard.html'">Home</button><button class="menu-item" type="button">Settings</button></nav>
  </section>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-button" id="search-toggle" type="button" aria-label="Search" aria-expanded="false" aria-controls="search-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
    </button>
    <button class="nav-button" id="files-toggle" type="button" aria-label="Files" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5z"></path><path d="M3.5 10h17"></path></svg>
    </button>
    <button class="nav-button" id="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
  </nav>
  <script>
    const folderSvg='<svg class="folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5z"/><path d="M3.5 10h17"/></svg>';
    const fileSvg='<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.8h8l4 4V20H6z"/><path d="M14 3.8V8h4"/></svg>';
    const storageKey="coolanas-files-v1";
    let items=[];
    try{const saved=localStorage.getItem(storageKey);items=saved?JSON.parse(saved):[];if(!Array.isArray(items))items=[];}catch(error){items=[];}
    items=items.map((item,index)=>({...item,id:item.id||("legacy-"+index),parentId:item.parentId||null}));
    const list=document.getElementById("files-list");
    const toolbar=document.getElementById("files-toolbar");
    const currentFolder=document.getElementById("current-folder");
    const viewer=document.getElementById("file-viewer");
    const viewerTitle=document.getElementById("viewer-title");
    const viewerContent=document.getElementById("viewer-content");
    let currentFolderId=null;
    const fileBlobs=new Map();
    const dbPromise=new Promise((resolve,reject)=>{
      const request=indexedDB.open("coolanas-file-content",1);
      request.onupgradeneeded=()=>request.result.createObjectStore("files");
      request.onsuccess=()=>resolve(request.result);
      request.onerror=()=>reject(request.error);
    });
    async function storeBlob(id,file){
      fileBlobs.set(id,file);
      try{const db=await dbPromise;await new Promise((resolve,reject)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put(file,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
      catch(error){console.warn("Could not save file contents in browser storage.",error);}
    }
    async function loadBlob(id){
      if(fileBlobs.has(id))return fileBlobs.get(id);
      try{const db=await dbPromise;return await new Promise((resolve,reject)=>{const req=db.transaction("files").objectStore("files").get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});}
      catch(error){return null;}
    }
    function saveItems(){try{localStorage.setItem(storageKey,JSON.stringify(items));}catch(error){console.warn("Could not save file list.",error);}}
    const addWrap=document.createElement("div");
    addWrap.className="add-wrap";
    addWrap.innerHTML='<button class="add-button" id="add-toggle" type="button" aria-label="Upload files" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><div class="add-menu" id="add-menu" hidden><button class="add-option" type="button" id="upload-option">Upload files</button><button class="add-option" type="button" id="upload-folder-option">Upload folder</button></div>';
    function visibleItems(){return items.filter(item=>(item.parentId||null)===currentFolderId);}
    function renderItems(){
      list.replaceChildren();
      const folder=items.find(item=>item.id===currentFolderId);
      toolbar.hidden=!currentFolderId;
      currentFolder.textContent=folder?folder.name:"";
      const ordered=visibleItems().sort((x,y)=>(x.type==="folder"?0:1)-(y.type==="folder"?0:1));
      for(const item of ordered){
        const card=document.createElement("button");
        card.className="file-card";card.type="button";card.setAttribute("role","listitem");card.dataset.id=item.id;
        card.innerHTML=item.type==="folder"?folderSvg:fileSvg;
        const name=document.createElement("span");name.className="file-name";name.textContent=item.name;
        card.append(name);
        card.addEventListener("click",()=>item.type==="folder"?openFolder(item.id):openFile(item));
        list.append(card);
      }
      list.append(addWrap);
      resetCardMotion();
    }
    function playFolderOpenSound(){
      try{
        const AudioContextClass=window.AudioContext||window.webkitAudioContext;
        if(!AudioContextClass)return;
        hoverAudioContext=hoverAudioContext||new AudioContextClass();
        if(hoverAudioContext.state==="suspended")hoverAudioContext.resume();
        const ctx=hoverAudioContext;
        const now=ctx.currentTime;
        const notes=[{frequency:220,start:0,duration:.14},{frequency:330,start:.09,duration:.2}];
        for(const note of notes){
          const oscillator=ctx.createOscillator();
          const gain=ctx.createGain();
          oscillator.type="sine";
          oscillator.frequency.setValueAtTime(note.frequency,now+note.start);
          gain.gain.setValueAtTime(.0001,now+note.start);
          gain.gain.exponentialRampToValueAtTime(.018,now+note.start+.012);
          gain.gain.exponentialRampToValueAtTime(.0001,now+note.start+note.duration);
          oscillator.connect(gain);gain.connect(ctx.destination);
          oscillator.start(now+note.start);oscillator.stop(now+note.start+note.duration+.01);
        }
      }catch(error){}
    }
    function openFolder(id){playFolderOpenSound();currentFolderId=id;renderItems();}
    document.getElementById("back-folder").addEventListener("click",()=>{
      currentFolderId=items.find(item=>item.id===currentFolderId)?.parentId||null;
      renderItems();
    });
    function addItem(type,name,parentId=currentFolderId,file=null){
      const id=crypto.randomUUID();
      items.push({id,type,name,parentId:parentId||null});
      if(file)storeBlob(id,file);
      saveItems();renderItems();
    }
    async function openFile(item){
      viewer.hidden=false;viewerTitle.textContent=item.name;viewerContent.textContent="Loading preview…";
      const file=await loadBlob(item.id);
      if(!file){viewerContent.textContent="This item has no stored file contents. Upload the file again to preview it.";return;}
      viewerContent.replaceChildren();
      const url=URL.createObjectURL(file);
      if(file.type.startsWith("image/")){const img=document.createElement("img");img.src=url;viewerContent.append(img);}
      else if(file.type==="application/pdf"){const frame=document.createElement("iframe");frame.src=url;viewerContent.append(frame);}
      else if(file.type.startsWith("text/")||/\.(txt|md|json|js|css|html|xml|csv|log)$/i.test(item.name)){viewerContent.textContent=await file.text();}
      else{viewerContent.textContent="Preview is unavailable for this file type. The file is stored in this browser.";}
    }
    function closeViewer(){viewer.hidden=true;viewerContent.replaceChildren();}
    document.getElementById("viewer-close").addEventListener("click",closeViewer);
    viewer.addEventListener("click",event=>{if(event.target===viewer)closeViewer();});
    document.addEventListener("keydown",event=>{if(event.key==="Escape")closeViewer();});
    renderItems();
    const addToggle=addWrap.querySelector("#add-toggle");
    const addMenu=addWrap.querySelector("#add-menu");
    addToggle.addEventListener("click",event=>{event.preventDefault();event.stopPropagation();addMenu.hidden=!addMenu.hidden;addToggle.setAttribute("aria-expanded",String(!addMenu.hidden));});
    document.addEventListener("click",event=>{if(!event.target.closest(".add-wrap")){addMenu.hidden=true;addToggle.setAttribute("aria-expanded","false");}});
    addMenu.addEventListener("click",event=>{
      const button=event.target.closest("#upload-option,#upload-folder-option");if(!button)return;
      event.preventDefault();event.stopPropagation();
      const picker=document.getElementById(button.id==="upload-option"?"file-picker":"folder-picker");
      addMenu.hidden=true;addToggle.setAttribute("aria-expanded","false");
      try{if(typeof picker.showPicker==="function")picker.showPicker();else picker.click();}catch(error){picker.click();}
    });
    async function importDirectoryFiles(files){
      const folders=new Map();
      for(const file of files){
        const parts=(file.webkitRelativePath||file.name).split("/");
        let parentId=currentFolderId;
        for(let i=0;i<parts.length-1;i++){
          const path=parts.slice(0,i+1).join("/");
          if(!folders.has(path)){
            const existing=items.find(x=>x.type==="folder"&&x.parentId===parentId&&x.name===parts[i]);
            const folder=existing||{id:crypto.randomUUID(),type:"folder",name:parts[i],parentId:parentId||null};
            if(!existing)items.push(folder);
            folders.set(path,folder.id);
          }
          parentId=folders.get(path);
        }
        const id=crypto.randomUUID();items.push({id,type:"file",name:parts[parts.length-1],parentId:parentId||null});await storeBlob(id,file);
      }
      saveItems();renderItems();
    }
    const picker=document.getElementById("file-picker");
    const folderPicker=document.getElementById("folder-picker");
    picker.addEventListener("change",async()=>{for(const file of picker.files)addItem("file",file.name,currentFolderId,file);picker.value="";});
    folderPicker.addEventListener("change",async()=>{await importDirectoryFiles([...folderPicker.files]);folderPicker.value="";});
    const dropHint=document.getElementById("drop-hint");let dragDepth=0;
    window.addEventListener("dragenter",event=>{if(!event.dataTransfer)return;event.preventDefault();dragDepth++;dropHint.hidden=false;});
    window.addEventListener("dragover",event=>{if(event.dataTransfer)event.preventDefault();});
    window.addEventListener("dragleave",event=>{event.preventDefault();dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)dropHint.hidden=true;});
    async function readEntry(entry,parentId=currentFolderId){
      if(entry.isFile)return new Promise(resolve=>entry.file(file=>resolve([{type:"file",name:file.name,file,parentId}]),()=>resolve([])));
      if(!entry.isDirectory)return [];
      const folder={id:crypto.randomUUID(),type:"folder",name:entry.name,parentId:parentId||null};
      const results=[folder],reader=entry.createReader();
      while(true){
        const batch=await new Promise(resolve=>reader.readEntries(resolve,()=>resolve([])));
        if(!batch.length)break;
        for(const child of batch)results.push(...await readEntry(child,folder.id));
      }
      return results;
    }
    window.addEventListener("drop",async event=>{
      event.preventDefault();dragDepth=0;dropHint.hidden=true;const dropped=[];
      for(const item of [...(event.dataTransfer?.items||[])]){
        if(item.kind!=="file")continue;
        const entry=item.webkitGetAsEntry?.();
        if(entry)dropped.push(...await readEntry(entry));
        else{const file=item.getAsFile?.();if(file)dropped.push({type:"file",name:file.name,file,parentId:currentFolderId});}
      }
      if(!dropped.length)for(const file of [...(event.dataTransfer?.files||[])])dropped.push({type:"file",name:file.name,file,parentId:currentFolderId});
      for(const item of dropped){
        const id=item.id||crypto.randomUUID();
        items.push({id,type:item.type,name:item.name,parentId:item.parentId||null});
        if(item.file)await storeBlob(id,item.file);
      }
      saveItems();renderItems();
    });
    function resetCardMotion(){
      list.querySelectorAll(".file-card").forEach(card=>{
        card.style.setProperty("--card-scale","1");
        card.style.setProperty("--card-z","1");
        card.classList.remove("is-pointer-near","is-pointer-hover");
      });
    }
    list.addEventListener("pointermove",event=>{
      if(event.pointerType!=="mouse")return;
      const cards=[...list.querySelectorAll(".file-card")];
      const hovered=event.target.closest(".file-card");
      cards.forEach(card=>{
        const rect=card.getBoundingClientRect();
        const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
        const distance=Math.hypot(event.clientX-cx,event.clientY-cy);
        const radius=230;
        const influence=Math.max(0,1-distance/radius);
        const scale=1+influence*.12;
        card.style.setProperty("--card-scale",scale.toFixed(3));
        card.style.setProperty("--card-z",String(Math.round(influence*4)+1));
        card.classList.toggle("is-pointer-near",influence>.03);
        card.classList.toggle("is-pointer-hover",card===hovered);
      });
    });
    list.addEventListener("pointerleave",resetCardMotion);
    let lastHoverSoundAt=0;
    let hoverAudioContext=null;
    function playCardTick(){
      const now=performance.now();
      if(now-lastHoverSoundAt<85)return;
      lastHoverSoundAt=now;
      try{
        const AudioContextClass=window.AudioContext||window.webkitAudioContext;
        if(!AudioContextClass)return;
        hoverAudioContext=hoverAudioContext||new AudioContextClass();
        if(hoverAudioContext.state==="suspended")hoverAudioContext.resume();
        const oscillator=hoverAudioContext.createOscillator();
        const gain=hoverAudioContext.createGain();
        oscillator.type="sine";
        oscillator.frequency.setValueAtTime(1050,hoverAudioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(760,hoverAudioContext.currentTime+.025);
        gain.gain.setValueAtTime(.0001,hoverAudioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(.018,hoverAudioContext.currentTime+.004);
        gain.gain.exponentialRampToValueAtTime(.0001,hoverAudioContext.currentTime+.035);
        oscillator.connect(gain);gain.connect(hoverAudioContext.destination);
        oscillator.start();oscillator.stop(hoverAudioContext.currentTime+.04);
      }catch(error){}
    }
    let lastHoveredCard=null;
    list.addEventListener("pointerover",event=>{
      if(event.pointerType&&event.pointerType!=="mouse")return;
      const card=event.target.closest(".file-card");
      if(card&&card!==lastHoveredCard){lastHoveredCard=card;playCardTick();}
    });
    list.addEventListener("pointerout",event=>{
      const next=event.relatedTarget?.closest?.(".file-card");
      if(!next)lastHoveredCard=null;
    });
    const toggles={search:document.getElementById("search-toggle"),menu:document.getElementById("menu-toggle")};
    const panels={search:document.getElementById("search-panel"),menu:document.getElementById("menu-panel")};
    function closePanels(){Object.entries(panels).forEach(([name,panel])=>{panel.hidden=true;toggles[name].setAttribute("aria-expanded","false");});}
    function togglePanel(name){const opening=panels[name].hidden;closePanels();if(opening){panels[name].hidden=false;toggles[name].setAttribute("aria-expanded","true");if(name==="search")panels[name].querySelector("input").focus();}}
    Object.entries(toggles).forEach(([name,button])=>{
      button.addEventListener("click",()=>togglePanel(name));
      button.addEventListener("pointermove",event=>{if(event.pointerType!=="mouse")return;const rect=button.getBoundingClientRect();const x=(event.clientX-rect.left)/rect.width-.5;const y=(event.clientY-rect.top)/rect.height-.5;button.style.setProperty("--shift-x",(x*8).toFixed(2)+"px");button.style.setProperty("--shift-y",(y*8).toFixed(2)+"px");});
      button.addEventListener("pointerleave",()=>{button.style.removeProperty("--shift-x");button.style.removeProperty("--shift-y");});
    });
    document.querySelectorAll("[data-close]").forEach(button=>button.addEventListener("click",closePanels));
    document.addEventListener("keydown",event=>{if(event.key==="Escape")closePanels();});
  </script>
</body>
</html>
