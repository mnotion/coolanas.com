<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff">
  <title>Files · mnotion</title>
  <style>
    *{box-sizing:border-box}
    @keyframes page-enter{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
    html,body{margin:0;min-height:100%;background:#f8f8f8;color:#202020;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{width:min(1120px,calc(100% - 48px));margin:0 auto;padding:26px 0 70px;animation:page-enter .28s cubic-bezier(.2,.7,.25,1) both}
    @media(prefers-reduced-motion:reduce){.shell{animation:none}}
    header{height:48px;display:flex;align-items:center;gap:13px;margin-bottom:38px}
    .back{width:36px;height:36px;display:grid;place-items:center;border:1px solid #e7e7e7;border-radius:11px;background:#fff;color:#444;text-decoration:none;transition:background .15s,transform .15s}
    .back:hover{background:#eee;transform:translateX(-2px)}
    .brand{font-size:14px;font-weight:650;letter-spacing:-.02em}
    .heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:25px}
    h1{font-size:29px;letter-spacing:-.045em;line-height:1.15;margin:0 0 5px;font-weight:650}
    .sub{margin:0;color:#888;font-size:13px}
    .actions{display:flex;gap:9px;align-items:center}
    .action{height:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 13px;border:1px solid #e3e3e3;border-radius:10px;background:#fff;color:#333;font:600 12px Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
    .action:hover{background:#f0f0f0;border-color:#d4d4d4}
    .action:active{transform:scale(.98)}
    .action.primary{background:#242424;color:#fff;border-color:#242424}
    .action.primary:hover{background:#414141}
    .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:23px}
    .crumbs{display:flex;align-items:center;gap:7px;min-width:0;color:#888;font-size:12px}
    .crumb{border:0;background:transparent;padding:4px 0;color:#777;font:inherit;cursor:pointer}
    .crumb:hover{color:#111}
    .crumb.current{color:#222;font-weight:600;cursor:default}
    .crumb-sep{color:#c2c2c2}
    .search-wrap{margin-left:auto;width:min(270px,45%);position:relative}
    .search{width:100%;height:36px;padding:0 12px 0 34px;border:1px solid #e7e7e7;border-radius:9px;background:#fff;outline:none;font:12px inherit}
    .search:focus{border-color:#aaa}
    .search-icon{position:absolute;left:11px;top:10px;color:#999;pointer-events:none}
    .section-label{margin:0 0 12px;font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:#999}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}
    .folder-card,.file-card{position:relative;min-width:0;border:1px solid #e9e9e9;border-radius:13px;background:#fff;text-align:left;transition:transform .16s,border-color .16s,box-shadow .16s}
    .folder-card{min-height:142px;padding:15px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
    .folder-card:hover,.file-card:hover{transform:translateY(-2px);border-color:#d8d8d8;box-shadow:0 7px 18px rgba(0,0,0,.045)}
    .folder-top{display:flex;align-items:flex-start;justify-content:space-between}
    .folder-art{width:42px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--folder-tint,#f0f0f0);color:var(--folder-color,#777)}
    .folder-art svg{width:23px;height:23px}
    .more{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#999;cursor:pointer;font-size:19px;line-height:1}
    .more:hover{background:#f2f2f2;color:#333}
    .folder-name{font-size:13px;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .folder-meta{font-size:11px;color:#999;margin-top:2px}
    .file-card{min-height:76px;padding:12px;display:flex;align-items:center;gap:11px}
    .file-icon{width:37px;height:42px;flex:none;display:grid;place-items:center;border:1px solid #eee;border-radius:8px;background:#fafafa;color:#888}
    .file-icon svg{width:19px;height:19px}
    .file-meta{min-width:0;flex:1}
    .file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:580}
    .file-size{font-size:11px;color:#999}
    .file-actions{display:flex;align-items:center}
    .empty{min-height:230px;border:1px dashed #dedede;border-radius:14px;background:rgba(255,255,255,.55);display:grid;place-items:center;text-align:center;padding:28px;grid-column:1/-1}
    .empty svg{width:38px;height:38px;color:#aaa;margin-bottom:10px}
    .empty-title{font-size:13px;font-weight:620;margin-bottom:4px}
    .empty-note{font-size:12px;color:#999}
    .hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    .drop-target{outline:2px solid #aaa;outline-offset:2px;background:#f4f4f4}
    @media(max-width:620px){.shell{width:calc(100% - 28px);padding-top:18px}.heading{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .action{flex:1}.toolbar{flex-wrap:wrap}.search-wrap{width:100%;margin-left:0}.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}.folder-card{min-height:130px;padding:12px}h1{font-size:25px}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <a class="back" href="dashboard.html" aria-label="Back to dashboard"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h11"/></svg></a>
      <div class="brand">mnotion</div>
    </header>
    <section>
      <div class="heading">
        <div><h1 id="page-title">Files</h1><p class="sub" id="page-subtitle">Keep everything organised in one place</p></div>
        <div class="actions">
          <button class="action" id="new-folder" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M12 11v6m-3-3h6"/></svg>New folder</button>
          <label class="action primary" for="picker"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>Add files</label>
          <input class="hidden" id="picker" type="file" multiple>
        </div>
      </div>
      <div class="toolbar">
        <nav class="crumbs" id="breadcrumbs" aria-label="Folder path"><span class="crumb current">All files</span></nav>
        <div class="search-wrap"><svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="search" id="filter" type="search" placeholder="Search this view…" autocomplete="off" aria-label="Search files and folders"></div>
      </div>
      <h2 class="section-label" id="section-label">Folders</h2>
      <div class="grid" id="folder-grid"></div>
      <h2 class="section-label" id="files-label" style="margin-top:28px">Files</h2>
      <div class="grid" id="file-grid"></div>
    </section>
  </main>
  <script>
    const picker=document.getElementById("picker"), filter=document.getElementById("filter");
    const folderGrid=document.getElementById("folder-grid"), fileGrid=document.getElementById("file-grid");
    const breadcrumbs=document.getElementById("breadcrumbs"), title=document.getElementById("page-title"), subtitle=document.getElementById("page-subtitle");
    const sectionLabel=document.getElementById("section-label"), filesLabel=document.getElementById("files-label");
    const palette=[["#e9e3d8","#8d7652"],["#e4e9e2","#71856e"],["#e6e4ee","#777093"],["#eee5e2","#a77d72"],["#e3eaf0","#70869a"]];
    const folders=[];
    let files=[],activeFolder=null;
    const formatSize=n=>n<1048576?Math.max(1,Math.round(n/1024))+" KB":(n/1048576).toFixed(1)+" MB";
    function makeEmpty(message,detail){const el=document.createElement("div");el.className="empty";el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5z"/><path d="M3.5 10h17"/></svg>';const wrap=document.createElement("div");const h=document.createElement("div");h.className="empty-title";h.textContent=message;const p=document.createElement("div");p.className="empty-note";p.textContent=detail;wrap.append(h,p);el.append(wrap);return el;}
    function addFile(file,folderId=activeFolder){files.push({file,folderId,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())});}
    function render(){
      const q=filter.value.trim().toLowerCase();
      const visibleFolders=activeFolder===null?folders.filter(f=>f.name.toLowerCase().includes(q)):[];
      const visibleFiles=files.filter(f=>f.folderId===activeFolder&&f.file.name.toLowerCase().includes(q));
      breadcrumbs.replaceChildren();
      const root=document.createElement("button");root.className="crumb"+(activeFolder===null?" current":"");root.textContent="All files";root.onclick=()=>{activeFolder=null;filter.value="";render();};breadcrumbs.append(root);
      if(activeFolder!==null){const sep=document.createElement("span");sep.className="crumb-sep";sep.textContent="/";const current=document.createElement("span");current.className="crumb current";current.textContent=folders.find(f=>f.id===activeFolder)?.name||"Folder";breadcrumbs.append(sep,current);}
      title.textContent=activeFolder===null?"Files":folders.find(f=>f.id===activeFolder)?.name||"Files";
      subtitle.textContent=activeFolder===null?"Keep everything organised in one place":"Files in this folder";
      sectionLabel.hidden=activeFolder!==null;folderGrid.hidden=activeFolder!==null;filesLabel.textContent=activeFolder===null?"Files":"Items";
      folderGrid.replaceChildren();fileGrid.replaceChildren();
      visibleFolders.forEach(folder=>{
        const card=document.createElement("button");card.type="button";card.className="folder-card";card.style.setProperty("--folder-tint",folder.tint);card.style.setProperty("--folder-color",folder.color);
        const top=document.createElement("div");top.className="folder-top";const art=document.createElement("div");art.className="folder-art";art.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>';
        const more=document.createElement("button");more.type="button";more.className="more";more.setAttribute("aria-label","Rename folder");more.textContent="···";more.onclick=e=>{e.stopPropagation();const next=prompt("Folder name",folder.name);if(next&&next.trim()){folder.name=next.trim();render();}};
        top.append(art,more);const bottom=document.createElement("div");const name=document.createElement("div");name.className="folder-name";name.textContent=folder.name;const meta=document.createElement("div");meta.className="folder-meta";const count=files.filter(x=>x.folderId===folder.id).length;meta.textContent=count+" "+(count===1?"item":"items");bottom.append(name,meta);card.append(top,bottom);card.onclick=()=>{activeFolder=folder.id;filter.value="";render();};card.addEventListener("dragover",e=>{e.preventDefault();card.classList.add("drop-target");});card.addEventListener("dragleave",()=>card.classList.remove("drop-target"));card.addEventListener("drop",e=>{e.preventDefault();card.classList.remove("drop-target");Array.from(e.dataTransfer.files||[]).forEach(file=>addFile(file,folder.id));render();});folderGrid.append(card);
      });
      if(activeFolder===null&&visibleFolders.length===0&&folders.length===0)folderGrid.append(makeEmpty("No folders yet","Create a folder to organise your files."));
      visibleFiles.forEach(entry=>{const card=document.createElement("article");card.className="file-card";const icon=document.createElement("div");icon.className="file-icon";icon.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h8l4 4V20H6z"/><path d="M14 3.5V8h4M9 13h6M9 16h6"/></svg>';const meta=document.createElement("div");meta.className="file-meta";const name=document.createElement("div");name.className="file-name";name.textContent=entry.file.name;const size=document.createElement("div");size.className="file-size";size.textContent=formatSize(entry.file.size);meta.append(name,size);card.append(icon,meta);fileGrid.append(card);});
      if(visibleFiles.length===0)fileGrid.append(makeEmpty(q?"No matching files":"No files here yet",activeFolder===null?"Add files or drop them into a folder.":"Add files to this folder."));
      filesLabel.hidden=activeFolder===null&&visibleFiles.length===0&&files.length===0&&q==="";
    }
    document.getElementById("new-folder").addEventListener("click",()=>{if(activeFolder!==null){alert("Folders can only be created at the top level.");return;}const name=prompt("Name your folder");if(!name||!name.trim())return;const [tint,color]=palette[folders.length%palette.length];folders.push({id:String(Date.now()),name:name.trim(),tint,color});render();});
    picker.addEventListener("change",()=>{Array.from(picker.files||[]).forEach(file=>addFile(file));picker.value="";render();});
    filter.addEventListener("input",render);
    ["dragenter","dragover"].forEach(type=>document.body.addEventListener(type,e=>{if(e.dataTransfer?.types?.includes("Files"))e.preventDefault();}));
    document.body.addEventListener("drop",e=>{if(e.target.closest(".folder-card"))return;e.preventDefault();Array.from(e.dataTransfer.files||[]).forEach(file=>addFile(file));render();});
    render();
  </script>
</body>
</html>
