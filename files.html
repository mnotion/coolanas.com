<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Files · mnotion</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0;background:#fff;color:#111;transition:background .18s ease}
    body{min-height:100vh;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;padding:24px 24px 100px}
    .add-wrap{position:relative;z-index:31;display:flex;align-items:center;justify-content:center;width:168px;min-height:176px;flex:none;border-radius:12px}
    .add-button{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(0,0,0,.06);border-radius:12px;background:#f1f2f3;color:#555;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.045);transition:background .15s,transform .15s}
    .add-button:hover{background:#e8e9eb;transform:scale(1.04)}
    .add-button svg{width:20px;height:20px}
    .add-menu{position:absolute;z-index:30;top:50px;left:0;width:170px;padding:5px;border:1px solid #eee;border-radius:11px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12)}
    .add-menu[hidden]{display:none}
    .add-option{display:block;width:100%;padding:10px;border:0;border-radius:7px;background:transparent;color:#222;text-align:left;font:13px/1.4 Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer}
    .add-option:hover{background:#f2f2f2}
    .files-list{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:18px;width:100%;margin:0;padding:0}
    .file-card{display:flex;flex-direction:column;align-items:center;gap:10px;width:168px;min-height:176px;padding:18px;border-radius:12px;color:#222;font-size:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.07)}
    .folder-icon{width:112px;height:112px;flex:none;color:#e3b52f}
    .file-icon{width:112px;height:112px;flex:none;color:#888}
    .file-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .drop-hint{position:fixed;inset:12px;z-index:20;display:grid;place-items:center;border:2px dashed #b9bdc2;border-radius:18px;background:rgba(245,246,247,.88);color:#555;font-size:16px;pointer-events:none}
    .drop-hint[hidden]{display:none}
    .bottom-nav{
      position:fixed;z-index:10;left:50%;bottom:20px;transform:translateX(-50%);
      width:min(260px,calc(100% - 24px));min-height:44px;padding:3px;
      display:grid;grid-template-columns:repeat(3,1fr);gap:3px;
      background:rgba(235,236,238,.9);border:1px solid rgba(0,0,0,.06);
      border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.055),inset 0 1px 0 rgba(255,255,255,.65);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)
    }
    .nav-button{
      display:flex;align-items:center;justify-content:center;min-height:36px;
      border:1px solid rgba(0,0,0,.045);border-radius:9px;
      background:rgba(255,255,255,.28);color:#555;cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
      position:relative;z-index:1;
      transition:transform .08s ease-out,background .16s ease,border-color .16s ease,box-shadow .16s ease;
      -webkit-tap-highlight-color:transparent
    }
    .bottom-nav:has(.nav-button:hover) .nav-button:not(:hover):not([aria-current="page"]){transform:scale(.94)}
    .nav-button:hover{z-index:2;transform:translate3d(var(--shift-x,0px),var(--shift-y,0px),0) scale(1.12);background:rgba(255,255,255,.72);border-color:rgba(0,0,0,.09);box-shadow:0 4px 12px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.8)}
    .nav-button:active{transform:translate3d(var(--shift-x,0px),var(--shift-y,0px),0) scale(1.06)}
    .nav-button svg{width:17px;height:17px}
    .nav-button[aria-current="page"]{color:#333;background:rgba(185,188,192,.48);border-color:rgba(0,0,0,.10);box-shadow:inset 0 1px 2px rgba(0,0,0,.07)}
    body:has(.bottom-nav:hover),body:has(.bottom-nav:focus-within){background:#d9d9d9}
    body:has(.bottom-nav:hover) main,body:has(.bottom-nav:focus-within) main{filter:brightness(.72) blur(2px)}
    .panel{position:fixed;z-index:9;left:50%;bottom:84px;transform:translateX(-50%);width:min(420px,calc(100% - 32px));padding:18px;border:1px solid rgba(255,255,255,.9);border-radius:18px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 34px rgba(0,0,0,.11),inset 0 1px 0 #fff}
    .panel[hidden]{display:none}
    .panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .panel-heading h2{margin:0;font-size:15px;font-weight:650}
    .close-button{width:30px;height:30px;border:0;border-radius:8px;background:rgba(0,0,0,.05);cursor:pointer;font-size:19px;line-height:1}
    .search-input{width:100%;height:42px;padding:0 12px;border:1px solid #ddd;border-radius:9px;outline:none;font:inherit;background:rgba(255,255,255,.85)}
    .menu-list{display:grid;gap:3px}
    .menu-item{display:block;width:100%;padding:11px;border:0;border-radius:8px;background:transparent;color:#222;text-align:left;font:500 13px Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer}
    .menu-item:hover{background:rgba(0,0,0,.05)}
    @media(max-width:480px){main{padding:16px 16px 90px}.bottom-nav{bottom:12px}.panel{bottom:76px}}
    @media(prefers-reduced-motion:reduce){html,body{transition:none}.nav-button{transition:none}.nav-button:hover,.nav-button:active,.bottom-nav:has(.nav-button:hover) .nav-button:not(:hover){transform:none}body:has(.bottom-nav:hover) main,body:has(.bottom-nav:focus-within) main{filter:none}}
  </style>
</head>
<body>
  <main aria-label="Files">
    <input id="file-picker" type="file" multiple style="position:fixed;left:-10000px;width:1px;height:1px;opacity:0">
    <input id="folder-picker" type="file" webkitdirectory multiple style="position:fixed;left:-10000px;width:1px;height:1px;opacity:0">
    <div class="files-list" id="files-list" role="list" aria-label="Files and folders"></div>
  </main>
  <div class="drop-hint" id="drop-hint" hidden>Drop files or folders to add them</div>
  <section class="panel" id="search-panel" aria-label="Search" hidden>
    <div class="panel-heading"><h2>Search</h2><button class="close-button" type="button" data-close aria-label="Close">×</button></div>
    <input class="search-input" type="search" placeholder="Search…" autocomplete="off">
  </section>
  <section class="panel" id="menu-panel" aria-label="Menu" hidden>
    <div class="panel-heading"><h2>Menu</h2><button class="close-button" type="button" data-close aria-label="Close">×</button></div>
    <nav class="menu-list"><button class="menu-item" type="button" onclick="location.href='dashboard.html'">Home</button><button class="menu-item" type="button">Settings</button></nav>
  </section>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-button" id="search-toggle" type="button" aria-label="Search" aria-expanded="false" aria-controls="search-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
    </button>
    <button class="nav-button" id="files-toggle" type="button" aria-label="Files" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5z"></path><path d="M3.5 10h17"></path></svg>
    </button>
    <button class="nav-button" id="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
  </nav>
  <script>
    const folderSvg='<svg class="folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5z"/><path d="M3.5 10h17"/></svg>';
    const fileSvg='<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.8h8l4 4V20H6z"/><path d="M14 3.8V8h4"/></svg>';
    const storageKey="coolanas-files-v1";
    let items=[];
    try{const saved=localStorage.getItem(storageKey);items=saved?JSON.parse(saved):[];if(!Array.isArray(items))items=[];}catch(error){items=[];}
    const list=document.getElementById("files-list");
    const addWrap=document.createElement("div");
    addWrap.className="add-wrap";
    addWrap.innerHTML='<button class="add-button" id="add-toggle" type="button" aria-label="Upload files" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><div class="add-menu" id="add-menu" hidden><button class="add-option" type="button" id="upload-option">Upload files</button><button class="add-option" type="button" id="upload-folder-option">Upload folder</button></div>';
    function saveItems(){try{localStorage.setItem(storageKey,JSON.stringify(items));}catch(error){console.warn("Browser storage unavailable; items remain until this page is closed.");}}
    function renderItems(){
      list.replaceChildren();
      const ordered=[...items].sort((a,b)=>(String(a.type).toLowerCase()==="folder"?0:1)-(String(b.type).toLowerCase()==="folder"?0:1));
      for(const item of ordered){
        const card=document.createElement("div");card.className="file-card";card.setAttribute("role","listitem");
        card.innerHTML=String(item.type).toLowerCase()==="folder"?folderSvg:fileSvg;
        const name=document.createElement("span");name.className="file-name";name.textContent=item.name;
        card.append(name);list.append(card);
      }
      list.append(addWrap);
    }
    function addItem(type,name){items.push({type,name:name||("Untitled "+type)});saveItems();renderItems();}
    renderItems();
    const addToggle=addWrap.querySelector("#add-toggle");
    const addMenu=addWrap.querySelector("#add-menu");
    addToggle.addEventListener("click",event=>{
      event.preventDefault();event.stopPropagation();
      addMenu.hidden=!addMenu.hidden;
      addToggle.setAttribute("aria-expanded",String(!addMenu.hidden));
    });
    document.addEventListener("click",event=>{
      if(!event.target.closest(".add-wrap")){addMenu.hidden=true;addToggle.setAttribute("aria-expanded","false");}
    });
    addMenu.addEventListener("click",event=>{
      const button=event.target.closest("#upload-option,#upload-folder-option");
      if(!button)return;
      event.preventDefault();event.stopPropagation();
      const picker=document.getElementById(button.id==="upload-option"?"file-picker":"folder-picker");
      addMenu.hidden=true;addToggle.setAttribute("aria-expanded","false");
      try{if(typeof picker.showPicker==="function")picker.showPicker();else picker.click();}
      catch(error){picker.click();}
    });
    function addPickedFiles(files){
      for(const file of files)addItem("file",file.name);
    }
    const picker=document.getElementById("file-picker");
    const folderPicker=document.getElementById("folder-picker");
    picker.addEventListener("change",()=>{addPickedFiles(picker.files);picker.value="";});
    folderPicker.addEventListener("change",()=>{
      const files=[...folderPicker.files];const roots=new Set();
      for(const file of files){const path=file.webkitRelativePath||file.name;const parts=path.split("/");if(parts.length>1)roots.add(parts[0]);}
      for(const root of roots)addItem("folder",root);
      addPickedFiles(files.map(file=>({name:file.webkitRelativePath||file.name})));
      folderPicker.value="";
    });
    const dropHint=document.getElementById("drop-hint");let dragDepth=0;
    window.addEventListener("dragenter",event=>{if(!event.dataTransfer)return;event.preventDefault();dragDepth++;dropHint.hidden=false;});
    window.addEventListener("dragover",event=>{if(event.dataTransfer)event.preventDefault();});
    window.addEventListener("dragleave",event=>{event.preventDefault();dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)dropHint.hidden=true;});
    function readEntry(entry){
      return new Promise(resolve=>{
        if(entry.isFile){entry.file(file=>resolve([{type:"file",name:file.name}]),()=>resolve([]));return;}
        if(entry.isDirectory){
          const reader=entry.createReader(),children=[];
          const readBatch=()=>reader.readEntries(async entries=>{
            if(!entries.length){resolve([{type:"folder",name:entry.name},...children]);return;}
            for(const child of entries)children.push(...await readEntry(child));
            readBatch();
          },()=>resolve([{type:"folder",name:entry.name},...children]));
          readBatch();return;
        }
        resolve([]);
      });
    }
    window.addEventListener("drop",async event=>{
      event.preventDefault();dragDepth=0;dropHint.hidden=true;
      const dropped=[];
      const transferItems=[...(event.dataTransfer?.items||[])];
      for(const item of transferItems){
        if(item.kind!=="file")continue;
        const entry=item.webkitGetAsEntry?.();
        if(entry?.isDirectory){
          dropped.push(...await readEntry(entry));
        }else{
          const file=item.getAsFile?.();
          if(file)dropped.push({type:"file",name:file.name});
          else if(entry?.isFile)dropped.push(...await readEntry(entry));
        }
      }
      if(!dropped.length){
        for(const file of [...(event.dataTransfer?.files||[])])dropped.push({type:"file",name:file.name});
      }
      items.push(...dropped);saveItems();renderItems();
    });
    const toggles={search:document.getElementById("search-toggle"),menu:document.getElementById("menu-toggle")};
    const panels={search:document.getElementById("search-panel"),menu:document.getElementById("menu-panel")};
    function closePanels(){Object.entries(panels).forEach(([name,panel])=>{panel.hidden=true;toggles[name].setAttribute("aria-expanded","false");});}
    function togglePanel(name){const opening=panels[name].hidden;closePanels();if(opening){panels[name].hidden=false;toggles[name].setAttribute("aria-expanded","true");if(name==="search")panels[name].querySelector("input").focus();}}
    Object.entries(toggles).forEach(([name,button])=>{
      button.addEventListener("click",()=>togglePanel(name));
      button.addEventListener("pointermove",event=>{if(event.pointerType!=="mouse")return;const rect=button.getBoundingClientRect();const x=(event.clientX-rect.left)/rect.width-.5;const y=(event.clientY-rect.top)/rect.height-.5;button.style.setProperty("--shift-x",(x*8).toFixed(2)+"px");button.style.setProperty("--shift-y",(y*8).toFixed(2)+"px");});
      button.addEventListener("pointerleave",()=>{button.style.removeProperty("--shift-x");button.style.removeProperty("--shift-y");});
    });
    document.querySelectorAll("[data-close]").forEach(button=>button.addEventListener("click",closePanels));
    document.addEventListener("keydown",event=>{if(event.key==="Escape")closePanels();});
  </script>
</body>
</html>
