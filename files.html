<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Files · mnotion</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0;background:#f7f7f7;color:#111;transition:background .18s ease}
    body{min-height:100vh;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;padding:24px 24px 100px}
    .add-wrap{position:relative;z-index:31;display:flex;align-items:center;justify-content:center;width:168px;min-height:176px;flex:none;border-radius:12px}
    .add-button{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(0,0,0,.06);border-radius:12px;background:#f1f2f3;color:#555;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.045);transition:background .15s,transform .15s}
    .add-button:hover{background:#e8e9eb;transform:scale(1.04)}
    .add-button svg{width:20px;height:20px}
    .add-menu{position:absolute;z-index:30;top:50px;left:0;width:170px;padding:5px;border:1px solid #eee;border-radius:11px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12)}
    .add-menu[hidden]{display:none}
    .add-option{display:block;width:100%;padding:10px;border:0;border-radius:7px;background:transparent;color:#222;text-align:left;font:13px/1.4 Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer}
    .add-option:hover{background:#f2f2f2}
    .files-list{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:18px;width:100%;margin:0;padding:0}
    .file-card{display:flex;flex-direction:column;align-items:center;gap:10px;width:168px;min-height:176px;padding:18px;border:0;border-radius:12px;background:#fff;color:#222;font:inherit;font-size:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.07);cursor:pointer;transform:scale(var(--card-scale,1));transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease;transform-origin:center;position:relative;z-index:var(--card-z,1)}
    .file-card:hover,.file-card.is-pointer-hover{background:#fafafa;box-shadow:0 5px 16px rgba(0,0,0,.10);}
    .file-card:focus-visible{outline:2px solid #aaa;outline-offset:3px}
    .file-card:focus:not(:focus-visible){outline:none}
    button,a,[role="button"],.file-card{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .file-card.is-pointer-near{box-shadow:0 4px 14px rgba(0,0,0,.085)}
    .file-card.is-selected{background:#e7f0ff!important;outline:2px solid #4388ed;outline-offset:-2px;box-shadow:0 3px 12px rgba(59,130,246,.18);z-index:9}
    body.has-selection::after{content:"";position:fixed;inset:0;z-index:8;background:rgba(12,14,20,.74);pointer-events:none}
    body.has-selection .add-wrap,body.has-selection .bottom-nav,body.has-selection .panel{filter:brightness(.28)}
    .file-card,.file-card *{-webkit-user-select:none;user-select:none}
    .file-card.is-selected{z-index:9}
    @keyframes coolanas-folder-jiggle{
      0%,100%{transform:rotate(-1.15deg)}
      50%{transform:rotate(1.15deg)}
    }
    .files-list.is-rearranging .file-card[data-type="folder"]:not(.is-being-dragged){
      animation:coolanas-folder-jiggle var(--folder-jiggle-duration,.5s) ease-in-out infinite;
      transform-origin:50% 55%;
      will-change:transform;
    }
    .files-list.is-rearranging .file-card[data-type="folder"] .settings-dot{display:none!important}
    .files-list.is-rearranging .file-card[data-type="folder"]:nth-child(even){animation-delay:-.11s}
    .files-list.is-rearranging .file-card{--card-scale:1!important}
    .file-card[draggable="true"]{cursor:grab}
    .file-card.is-being-dragged{opacity:.48;cursor:grabbing}
    .file-card.is-being-dragged:hover{background:#e5e7eb;box-shadow:none;transform:scale(1)!important}
    .file-card.is-being-dragged[data-type="folder"]:hover{background:#e5e7eb;box-shadow:inset 0 0 0 1px rgba(107,114,128,.08);transform:scale(1)!important}
    .file-card.is-being-dragged.is-pointer-hover,.file-card.is-being-dragged.is-pointer-near{box-shadow:none}
    .file-card.is-being-dragged[data-type="folder"]{
      opacity:1;
      background:#e5e7eb;
      outline:2px dashed #9ca3af;
      outline-offset:3px;
      border:1px dashed #9ca3af;
      box-shadow:inset 0 0 0 1px rgba(107,114,128,.08);
      animation:none!important;
      filter:grayscale(1);
    }
    .file-card.is-being-dragged[data-type="folder"]>*{opacity:.22}
    .file-card.is-being-dragged[data-type="folder"] .settings-dot{display:none!important}
    .file-card.is-drop-target{outline:2px dashed #3985ed;outline-offset:3px;background:#edf4ff;transform:scale(1.055);box-shadow:0 8px 22px rgba(59,130,246,.2);cursor:copy;transition:transform .14s ease,box-shadow .14s ease,background .14s ease}
    .file-card.is-selected .settings-dot{display:none}
    body.selection-drag-mode{overflow:hidden}
    body.selection-drag-mode main{touch-action:none;overscroll-behavior:contain}
    body.selection-drag-mode .files-list{touch-action:none}
    body.selection-drag-mode .selection-marquee{touch-action:none}

    .bottom-nav{z-index:10}

    .selection-marquee{position:fixed;z-index:40;pointer-events:none;border:1px solid #3985ed;background:rgba(59,130,246,.18);border-radius:2px}
.selection-actions{position:fixed;z-index:45;display:flex;align-items:center;gap:5px;padding:0;background:transparent;pointer-events:auto;transform:translate(8px,-50%)}
    .selection-actions[hidden]{display:none}
    .selection-action{border:0;border-radius:8px;padding:7px 10px;background:transparent;color:#fff;font:600 12px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer;text-shadow:0 1px 5px rgba(0,0,0,.35);transition:background .14s ease,transform .14s ease}
    .selection-action:hover{background:rgba(255,255,255,.17);transform:translateY(-1px)}
    .selection-action.danger{color:#ffb4b4}
    .selection-colors{display:flex;align-items:center;gap:7px;margin-left:3px}
    .selection-colors[hidden]{display:none}
    .selection-color{width:17px;height:17px;padding:0;border:1.5px solid rgba(255,255,255,.9);border-radius:50%;background:var(--swatch);cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.22);transition:transform .14s ease}
    .selection-color:hover{transform:scale(1.22)}

    .file-card{position:relative}
    .settings-dot{position:absolute;top:9px;right:9px;width:13px;height:13px;padding:0;border:0;border-radius:50%;background:#9ca3af;box-shadow:0 0 0 2px #fff;cursor:pointer;z-index:5;opacity:.92;transition:background .12s ease,transform .12s ease}
    .settings-dot:hover{background:#6b7280;transform:scale(1.15)}
    .settings-dot:focus-visible{outline:2px solid #6b7280;outline-offset:3px}
    .file-tag{margin-top:-5px;padding:3px 7px;border-radius:999px;background:#f0f1f3;color:#555;font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .files-toolbar{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 18px;color:#333}
    .files-toolbar[hidden]{display:none}
    .crumb-button{border:0;background:transparent;padding:5px 8px;border-radius:7px;font:inherit;cursor:pointer}
    .crumb-button:hover{background:#f1f1f1}
    .crumb-current{font-size:14px;color:#777}
    button:focus:not(:focus-visible){outline:none;box-shadow:none}
    button:focus-visible{outline:2px solid #777;outline-offset:3px}
    @media (hover:none) and (pointer:coarse){button:focus,button:focus-visible,a:focus,a:focus-visible,.file-card:focus,.file-card:focus-visible{outline:none!important;box-shadow:none!important}}
    .file-viewer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(20,20,20,.24);backdrop-filter:blur(5px)}
    .file-viewer[hidden]{display:none}
    .confirm-overlay{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
    .confirm-overlay[hidden]{display:none}
    .confirm-panel{width:min(420px,100%);padding:22px;border:1px solid rgba(0,0,0,.08);border-radius:16px;background:#fff;box-shadow:0 20px 65px rgba(0,0,0,.2)}
    .card-settings-panel{width:min(440px,100%);padding:24px}
    #card-settings-overlay{background:rgba(0,0,0,.28)}
    .settings-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
    .settings-header h2{margin:0;font-size:19px;font-weight:650;color:#171717}
    .settings-subtitle{margin:5px 0 0;color:#858585;font-size:12px}
    .settings-accordion{border-top:1px solid #eceef0}
    .settings-section{border-bottom:1px solid #eceef0}
    .settings-section>summary{min-height:58px;display:flex;align-items:center;gap:12px;list-style:none;cursor:pointer;user-select:none}
    .settings-section>summary::-webkit-details-marker{display:none}
    .settings-section-content{display:grid;grid-template-rows:0fr;opacity:0;overflow:hidden;padding:0!important;transition:grid-template-rows .28s cubic-bezier(.2,.8,.2,1),opacity .2s ease,padding .28s ease}
    .settings-section-content>*{min-height:0}
    .settings-section[open]>.settings-section-content{grid-template-rows:1fr;opacity:1;padding:0 0 18px!important}
    .settings-section>summary::after{content:"";width:8px;height:8px;margin-left:auto;border-right:1.7px solid #777;border-bottom:1.7px solid #777;transform:rotate(45deg);transition:transform .16s ease}
    .settings-section[open]>summary::after{transform:rotate(225deg)}
    .settings-section-title{font-size:14px;font-weight:600;color:#252525}
    .settings-section-value{margin-left:auto;color:#858b94;font-size:12px}
    .settings-section>summary:has(.settings-section-title)+.settings-section-content{padding:0 0 18px}
    .settings-section[open]>summary .settings-section-value{margin-left:auto}
    .color-options{display:flex;gap:12px;flex-wrap:wrap;padding:3px 2px}
    .color-choice{width:30px;height:30px;border:2px solid #fff;border-radius:50%;background:var(--swatch);box-shadow:0 0 0 1px #d1d5db;cursor:pointer;transition:transform .14s ease,box-shadow .14s ease}
    .color-choice:hover{transform:scale(1.1)}
    .color-choice.active{box-shadow:0 0 0 2px #2563eb}
    .settings-section-content .search-input{width:100%;box-sizing:border-box}
    .settings-delete-copy{margin:0 0 12px;color:#777;font-size:12px;line-height:1.5}
    .settings-footer{display:flex;justify-content:flex-end;margin-top:18px}
    .settings-danger-section .settings-section-title{color:#d9363e}

    .confirm-title{margin:0 0 8px;font-size:17px;font-weight:650;color:#171717}
    .confirm-message{margin:0;color:#666;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
    .confirm-item-name{color:#2563eb;font-weight:600}
    .confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
    .confirm-button{min-width:82px;padding:9px 15px;border:1px solid #e5e5e5;border-radius:9px;background:#f7f7f7;color:#333;font:inherit;font-size:13px;cursor:pointer}
    .confirm-button:hover{background:#eee}
    .confirm-button.danger{border-color:#d9363e;background:#d9363e;color:#fff}
    .confirm-button.danger:hover{background:#c52d35}

    .viewer-panel{width:min(900px,100%);height:min(720px,90vh);display:flex;flex-direction:column;overflow:hidden;border:1px solid #eee;border-radius:16px;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.18)}
    .viewer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #eee}
    .viewer-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .viewer-close{width:32px;height:32px;border:0;border-radius:8px;background:#f1f1f1;font-size:20px;cursor:pointer}
    .viewer-content{flex:1;min-height:0;overflow:auto;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}
    .viewer-content img,.viewer-content iframe{display:block;width:100%;height:100%;border:0;object-fit:contain}
    .folder-icon{width:112px;height:112px;flex:none;color:#e3b52f}
    .file-icon{width:112px;height:112px;flex:none;color:#888}
    .file-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .drop-hint{position:fixed;inset:12px;z-index:20;display:grid;place-items:center;border:2px dashed #b9bdc2;border-radius:18px;background:rgba(245,246,247,.88);color:#555;font-size:16px;pointer-events:none}
    .drop-hint[hidden]{display:none}
    .upload-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(245,246,247,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
    .upload-overlay[hidden]{display:none}
    .upload-card{width:min(360px,100%);padding:26px;border:1px solid rgba(0,0,0,.07);border-radius:18px;background:rgba(255,255,255,.96);box-shadow:0 18px 60px rgba(0,0,0,.14);text-align:center}
    .upload-spinner{width:34px;height:34px;margin:0 auto 16px;border:3px solid #e8e8e8;border-top-color:#555;border-radius:50%;animation:upload-spin .8s linear infinite}
    .upload-title{margin:0 0 5px;font-size:15px;font-weight:650;color:#222}
    .upload-detail{min-height:20px;margin:0;color:#777;font-size:12px;overflow-wrap:anywhere}
    .upload-progress{height:5px;margin-top:18px;overflow:hidden;border-radius:9px;background:#eee}
    .upload-progress-bar{width:0;height:100%;border-radius:9px;background:#555;transition:width .15s ease}
    .upload-actions{display:flex;justify-content:center;gap:8px;margin-top:18px}.upload-actions button{padding:8px 13px;border:1px solid #e1e1e1;border-radius:8px;background:#f7f7f7;color:#333;font:600 12px Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer}.upload-actions #upload-cancel{border-color:#e7caca;background:#fff7f7;color:#b42318}.upload-mini{position:fixed;z-index:79;left:50%;bottom:72px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;width:min(310px,calc(100% - 32px));padding:9px 12px;border:1px solid rgba(0,0,0,.08);border-radius:12px;background:rgba(255,255,255,.97);box-shadow:0 5px 20px rgba(0,0,0,.12);color:#333;font:600 11px Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer}.upload-mini[hidden]{display:none}.upload-mini-track{height:5px;flex:1;overflow:hidden;border-radius:8px;background:#eee}.upload-mini-bar{display:block;width:0;height:100%;border-radius:8px;background:#555;transition:width .15s ease}.upload-mini strong{min-width:30px;text-align:right;font-variant-numeric:tabular-nums}@media(max-width:480px){.upload-mini{bottom:64px}}
    @keyframes upload-spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.upload-spinner{animation-duration:2s}.upload-progress-bar{transition:none}}

    .bottom-nav{
      position:fixed;z-index:10;left:50%;bottom:20px;transform:translateX(-50%);
      width:min(300px,calc(100% - 24px));min-height:44px;padding:3px;
      display:grid;grid-template-columns:repeat(4,1fr);gap:3px;
      background:rgba(235,236,238,.9);border:1px solid rgba(0,0,0,.06);
      border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.055),inset 0 1px 0 rgba(255,255,255,.65);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)
    }
    .nav-button{
      display:flex;align-items:center;justify-content:center;min-height:36px;
      border:1px solid rgba(0,0,0,.045);border-radius:9px;
      background:rgba(255,255,255,.28);color:#555;cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
      position:relative;z-index:1;
      transition:transform .08s ease-out,background .16s ease,border-color .16s ease,box-shadow .16s ease;
      -webkit-tap-highlight-color:transparent
    }
    .bottom-nav:has(.nav-button:hover) .nav-button:not(:hover):not([aria-current="page"]){transform:scale(.94)}
    .nav-button:hover{z-index:2;transform:scale(1.08);background:rgba(255,255,255,.72);border-color:rgba(0,0,0,.09);box-shadow:0 2px 7px rgba(0,0,0,.06)}
    .nav-button:active{transform:translate3d(var(--shift-x,0px),var(--shift-y,0px),0) scale(1.06)}
    .nav-button svg{width:17px;height:17px}
    .nav-button[aria-current="page"]{color:#333;background:rgba(185,188,192,.48);border-color:rgba(0,0,0,.10);box-shadow:inset 0 1px 2px rgba(0,0,0,.07)}
    /* Keep the page compositor stable while hovering the navigation. */
    .panel{position:fixed;z-index:9;left:50%;bottom:84px;transform:translateX(-50%);width:min(420px,calc(100% - 32px));padding:18px;border:1px solid rgba(255,255,255,.9);border-radius:18px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 34px rgba(0,0,0,.11),inset 0 1px 0 #fff}
    .panel[hidden]{display:none}
    .panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .panel-heading h2{margin:0;font-size:15px;font-weight:650}
    .close-button{width:30px;height:30px;border:0;border-radius:8px;background:rgba(0,0,0,.05);cursor:pointer;font-size:19px;line-height:1}
    .search-input{width:100%;height:42px;padding:0 12px;border:1px solid #ddd;border-radius:9px;outline:none;font:inherit;background:rgba(255,255,255,.85)}
    .menu-list{display:grid;gap:3px}
    .menu-item{display:block;width:100%;padding:11px;border:0;border-radius:8px;background:transparent;color:#222;text-align:left;font:500 13px Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer}
    .menu-item:hover{background:rgba(0,0,0,.05)}
    @media(max-width:480px){main{padding:16px 16px 90px}.bottom-nav{bottom:12px}.panel{bottom:76px}}
    @media(prefers-reduced-motion:reduce){html,body{transition:none}.nav-button{transition:none}.nav-button:hover,.nav-button:active,.bottom-nav:has(.nav-button:hover) .nav-button:not(:hover){transform:none}body:has(.bottom-nav:hover) main,body:has(.bottom-nav:focus-within) main{filter:none}}

    html.dark-mode,html.dark-mode body{background:#151515!important;color:#eee!important;color-scheme:dark}
    html.dark-mode .file-card,html.dark-mode .panel,html.dark-mode .confirm-panel,html.dark-mode .viewer-panel,html.dark-mode .card-settings-panel{background:#262626!important;color:#eee!important;border-color:#444!important}
    html.dark-mode .file-name,html.dark-mode .viewer-head strong,html.dark-mode .panel-heading h2,html.dark-mode .confirm-title,html.dark-mode .settings-header h2,html.dark-mode .settings-section-title{color:#eee!important}
    html.dark-mode .bottom-nav{background:rgba(45,45,45,.94)!important;border-color:#555!important}
    html.dark-mode .nav-button{background:#303030!important;color:#eee!important;border-color:#555!important}
    html.dark-mode .add-button,html.dark-mode .add-menu,html.dark-mode .add-option,html.dark-mode .confirm-button,html.dark-mode .crumb-button,html.dark-mode .search-input,html.dark-mode .settings-section-content input{background:#303030!important;color:#eee!important;border-color:#555!important}
    html.dark-mode .file-tag{background:#3a3a3a!important;color:#ddd!important}
    html.dark-mode .upload-card{background:#292929!important;color:#eee!important;border-color:#555!important}
    html.dark-mode .upload-title{color:#eee!important}
    html.dark-mode .upload-mini{background:#292929!important;color:#eee!important;border-color:#555!important}
    html.dark-mode .viewer-content{color:#eee!important}
  </style>
</head>
<body>
  <main aria-label="Files">
    <input id="file-picker" type="file" multiple style="position:fixed;left:-10000px;width:1px;height:1px;opacity:0">
    <input id="folder-picker" type="file" webkitdirectory multiple style="position:fixed;left:-10000px;width:1px;height:1px;opacity:0">
    <div class="files-toolbar" id="files-toolbar" hidden><button class="crumb-button" id="back-folder" type="button">← Back</button><span class="crumb-current" id="current-folder"></span></div>
    <div class="files-list" id="files-list" role="list" aria-label="Files and folders"></div>
  </main>
  <div class="drop-hint" id="drop-hint" hidden>Drop files or folders to add them</div>
  <div class="selection-marquee" id="selection-marquee" hidden></div>
  <div class="selection-actions" id="selection-actions" hidden>
    <button class="selection-action danger" id="selection-delete" type="button">Delete</button>
    <button class="selection-action" id="selection-recolour" type="button">Recolour</button>
    <div class="selection-colors" id="selection-colors" hidden>
      <button class="selection-color" type="button" data-color="#e6b325" aria-label="Yellow" title="Yellow" style="--swatch:#e6b325"></button>
      <button class="selection-color" type="button" data-color="#3b82f6" aria-label="Blue" title="Blue" style="--swatch:#3b82f6"></button>
      <button class="selection-color" type="button" data-color="#22a06b" aria-label="Green" title="Green" style="--swatch:#22a06b"></button>
      <button class="selection-color" type="button" data-color="#a855f7" aria-label="Purple" title="Purple" style="--swatch:#a855f7"></button>
      <button class="selection-color" type="button" data-color="#ef4444" aria-label="Red" title="Red" style="--swatch:#ef4444"></button>
      <button class="selection-color" type="button" data-color="#6b7280" aria-label="Gray" title="Gray" style="--swatch:#6b7280"></button>

const pendingMutationDb=new Promise((resolve,reject)=>{
  const request=indexedDB.open("coolanas-files-sync",1);
  request.onupgradeneeded=()=>{
    const db=request.result;
    if(!db.objectStoreNames.contains("mutations"))db.createObjectStore("mutations",{keyPath:"id"});
  };
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error||new Error("Could not open the pending sync queue."));
});
async function pendingMutationTransaction(mode,work){
  const db=await pendingMutationDb;
  return new Promise((resolve,reject)=>{
    const transaction=db.transaction("mutations",mode);
    const store=transaction.objectStore("mutations");
    let result;
    try{result=work(store);}catch(error){reject(error);return;}
    transaction.oncomplete=()=>resolve(result?.result);
    transaction.onerror=()=>reject(transaction.error||new Error("Pending sync storage failed."));
    transaction.onabort=()=>reject(transaction.error||new Error("Pending sync transaction was aborted."));
  });
}
async function savePendingMutation(mutation){
  const db=await pendingMutationDb;
  await new Promise((resolve,reject)=>{
    const transaction=db.transaction("mutations","readwrite");
    const store=transaction.objectStore("mutations");
    const request=store.getAll();
    request.onsuccess=()=>{
      const existing=(request.result||[]).filter(entry=>entry.userId===mutation.userId&&entry.itemId===mutation.itemId);
      if(mutation.type==="delete"){
        existing.forEach(entry=>store.delete(entry.id));
        store.put(mutation);
        return;
      }
      if(existing.some(entry=>entry.type==="delete"))return;
      const metadata=existing.filter(entry=>entry.type==="metadata");
      if(metadata.length){
        const base=metadata[0];
        const merged={...base,changes:{...(base.changes||{}),...(mutation.changes||{})}};
        metadata.slice(1).forEach(entry=>store.delete(entry.id));
        store.put(merged);
      }else store.put(mutation);
    };
    request.onerror=()=>reject(request.error||new Error("Could not read queued file changes."));
    transaction.oncomplete=()=>resolve();
    transaction.onerror=()=>reject(transaction.error||new Error("Could not save pending file changes."));
    transaction.onabort=()=>reject(transaction.error||new Error("Pending file change was not saved."));
  });
}
async function readPendingMutations(){
  const db=await pendingMutationDb;
  return new Promise((resolve,reject)=>{
    const transaction=db.transaction("mutations","readonly");
    const request=transaction.objectStore("mutations").getAll();
    request.onsuccess=()=>resolve(request.result||[]);
    request.onerror=()=>reject(request.error||new Error("Could not read pending changes."));
  });
}

async function applyPendingToCache(){
  let pending=[];

  catch(error){console.warn("Could not restore pending file changes:",error.message);return;}
  for(const entry of pending){
    if(entry.type==="delete")removeCachedItems([entry.itemId]);
    else if(entry.type==="metadata"){
      const item=items.find(value=>value.id===entry.itemId);
      if(item)Object.assign(item,entry.changes);
    }
  }
}
async function queueFileMutation(type,itemId,changes){
  const mutation={id:crypto.randomUUID(),userId:user.id,type,itemId,changes:changes||{},createdAt:Date.now()};
  try{await savePendingMutation(mutation);}
  catch(error){
    if(type==="delete"){
      await filesAction("delete",{id:itemId});
      removeCachedItems([itemId]);
    }else{
      const result=await filesAction("update_metadata",{id:itemId,...(changes||{})});
      upsertItem(result.item);
    }
    renderItems();
    return;
  }
  if(type==="delete")removeCachedItems([itemId]);
  else{
    const item=items.find(value=>value.id===itemId);
    if(item)Object.assign(item,changes||{});
  }
  renderItems();
}
async function flushPendingMutations(){
  if(pendingFlushPromise)return pendingFlushPromise;
  pendingFlushPromise=(async()=>{
    const pending=(await readPendingMutations()).filter(entry=>entry.userId===user.id).sort((a,b)=>a.createdAt-b.createdAt).slice(0,100);
    if(!pending.length)return;
    let updatedItems=[];
    if(batchSyncSupported){
      try{
        const response=await filesAction("batch",{operations:pending.map(entry=>({type:entry.type,id:entry.itemId,changes:entry.changes}))});
        updatedItems=response.updatedItems||[];
        await removePendingMutations(pending.map(entry=>entry.id));
      }catch(batchError){
        if(batchError.message!=="Unknown action.")throw batchError;
        batchSyncSupported=false;
      }
    }
    if(!batchSyncSupported){
      for(const entry of pending){
        try{
          if(entry.type==="delete")await filesAction("delete",{id:entry.itemId});
          else{
            const response=await filesAction("update_metadata",{id:entry.itemId,...(entry.changes||{})});
            if(response.item)updatedItems.push(response.item);
          }
        }catch(legacyError){
          if(!/Item not found|File not found/i.test(legacyError.message))throw legacyError;
        }
        await removePendingMutations([entry.id]);
      }
    }
    for(const item of updatedItems)upsertItem(item);
    for(const entry of pending)if(entry.type==="delete")removeCachedItems([entry.itemId]);
    renderItems();
  })().catch(error=>{
    console.warn("File changes remain queued until the next sync:",error.message);
  }).finally(()=>{pendingFlushPromise=null;});
  return pendingFlushPromise;
}

function isEmptyCanvasTarget(target){

function setMarqueeRect(x,y){
  if(!marqueeStart)return;
  const left=Math.min(marqueeStart.x,x);
  const top=Math.min(marqueeStart.y,y);
  marquee.style.left=left+"px";
  marquee.style.top=top+"px";
  marquee.style.width=Math.abs(x-marqueeStart.x)+"px";
  marquee.style.height=Math.abs(y-marqueeStart.y)+"px";
}
function beginMarquee(x,y){
  selectedIds.clear();
  updateSelectionUi();
  marqueeStart={x,y};
  marquee.hidden=false;
  setMarqueeRect(x,y);
  document.body.classList.add("selection-drag-mode");
}
function updateMarquee(x,y){
  if(!marqueeStart)return;
  setMarqueeRect(x,y);
  const left=Math.min(marqueeStart.x,x);
  const top=Math.min(marqueeStart.y,y);
  const box={left,top,right:left+Math.abs(x-marqueeStart.x),bottom:top+Math.abs(y-marqueeStart.y)};
  selectedIds.clear();
  list.querySelectorAll(".file-card").forEach(card=>{
    const rect=card.getBoundingClientRect();
    if(rect.left<box.right&&rect.right>box.left&&rect.top<box.bottom&&rect.bottom>box.top){
      selectedIds.add(card.dataset.id);
    }
  });
  updateSelectionUi();
}
function finishMarquee(){
  if(!marqueeStart)return;
  marqueeStart=null;
  marquee.hidden=true;
  document.body.classList.remove("selection-drag-mode");

}
function isDoubleTap(previous,x,y,pointerType){
  return !!previous&&previous.pointerType===pointerType&&
    Date.now()-previous.time<=DOUBLE_TAP_WINDOW&&
    Math.hypot(previous.x-x,previous.y-y)<=DOUBLE_TAP_DISTANCE;
}

// Mouse and pen: a second press on empty space starts the drag-selection rectangle.
main.addEventListener("pointerdown",event=>{
  if(event.pointerType==="touch"||event.button!==0)return;
  if(!isEmptyCanvasTarget(event.target)){
    previousPointerTap=null;
    pointerTapCandidate=null;
    return;
  }
  if(isDoubleTap(previousPointerTap,event.clientX,event.clientY,event.pointerType)){
    event.preventDefault();
    previousPointerTap=null;
    pointerTapCandidate=null;
    activePointerMarquee={pointerId:event.pointerId};
    beginMarquee(event.clientX,event.clientY);
    try{main.setPointerCapture(event.pointerId);}catch{}
    return;
  }
  pointerTapCandidate={pointerId:event.pointerId,pointerType:event.pointerType,x:event.clientX,y:event.clientY,moved:false};
});
document.addEventListener("pointermove",event=>{
  if(activePointerMarquee&&activePointerMarquee.pointerId===event.pointerId){
    event.preventDefault();
    updateMarquee(event.clientX,event.clientY);
    return;
  }
  if(pointerTapCandidate&&pointerTapCandidate.pointerId===event.pointerId&&
     Math.hypot(event.clientX-pointerTapCandidate.x,event.clientY-pointerTapCandidate.y)>GESTURE_MOVE_THRESHOLD){
    pointerTapCandidate.moved=true;
  }
});
document.addEventListener("pointerup",event=>{
  if(activePointerMarquee&&activePointerMarquee.pointerId===event.pointerId){
    finishMarquee();
    activePointerMarquee=null;
    return;
  }
  if(pointerTapCandidate&&pointerTapCandidate.pointerId===event.pointerId){
    const tap=pointerTapCandidate;
    pointerTapCandidate=null;
    if(!tap.moved){
      if(selectedIds.size)clearSelection();
      previousPointerTap={x:tap.x,y:tap.y,time:Date.now(),pointerType:tap.pointerType};
    }else previousPointerTap=null;
  }
});
document.addEventListener("pointercancel",event=>{
  if(activePointerMarquee&&activePointerMarquee.pointerId===event.pointerId){
    finishMarquee();
    activePointerMarquee=null;
  }
  if(pointerTapCandidate?.pointerId===event.pointerId)pointerTapCandidate=null;
  previousPointerTap=null;
});

// Touch: single taps still scroll normally. Only the second tap arms marquee dragging.
main.addEventListener("touchstart",event=>{
  if(event.touches.length!==1)return;
  const touch=event.changedTouches[0];
  if(!isEmptyCanvasTarget(event.target)){
    previousTouchTap=null;
    touchTapCandidate=null;
    return;
  }
  if(previousTouchTap&&Date.now()-previousTouchTap.time<=DOUBLE_TAP_WINDOW&&
     Math.hypot(previousTouchTap.x-touch.clientX,previousTouchTap.y-touch.clientY)<=DOUBLE_TAP_DISTANCE){
    event.preventDefault();
    previousTouchTap=null;
    touchTapCandidate=null;
    activeTouchMarqueeId=touch.identifier;
    beginMarquee(touch.clientX,touch.clientY);
    return;
  }
  touchTapCandidate={identifier:touch.identifier,x:touch.clientX,y:touch.clientY,moved:false};
},{passive:false});
main.addEventListener("touchmove",event=>{
  if(activeTouchMarqueeId!==null){
    const touch=[...event.touches].find(value=>value.identifier===activeTouchMarqueeId);
    if(touch){
      event.preventDefault();
      updateMarquee(touch.clientX,touch.clientY);
    }
    return;
  }
  if(touchTapCandidate){
    const touch=[...event.touches].find(value=>value.identifier===touchTapCandidate.identifier);
    if(touch&&Math.hypot(touch.clientX-touchTapCandidate.x,touch.clientY-touchTapCandidate.y)>GESTURE_MOVE_THRESHOLD){
      touchTapCandidate.moved=true;
    }
  }
},{passive:false});
main.addEventListener("touchend",event=>{
  if(activeTouchMarqueeId!==null&&[...event.changedTouches].some(touch=>touch.identifier===activeTouchMarqueeId)){
    event.preventDefault();
    activeTouchMarqueeId=null;
    finishMarquee();
    return;
  }
  if(touchTapCandidate&&[...event.changedTouches].some(touch=>touch.identifier===touchTapCandidate.identifier)){
    const tap=touchTapCandidate;
    touchTapCandidate=null;
    if(!tap.moved){
      if(selectedIds.size)clearSelection();
      previousTouchTap={x:tap.x,y:tap.y,time:Date.now()};
    }else previousTouchTap=null;
  }
},{passive:false});
main.addEventListener("touchcancel",()=>{
  touchTapCandidate=null;
  previousTouchTap=null;
  if(activeTouchMarqueeId!==null){
    activeTouchMarqueeId=null;
    finishMarquee();
  }
},{passive:true});
function renderItems(){
  list.replaceChildren();
  const folder=items.find(item=>item.id===currentFolderId);
  toolbar.hidden=!currentFolderId;
  currentFolder.textContent=folder?.name||"";
  const ordered=visibleItems().sort((a,b)=>{
    const type=(a.item_type==="folder"?0:1)-(b.item_type==="folder"?0:1);
    return type||(Number(a.sort_order||0)-Number(b.sort_order||0))||a.name.localeCompare(b.name);
  });
  for(const item of ordered){
    const card=document.createElement("div");
    card.className="file-card";
    card.tabIndex=0;
    card.draggable=true;
    card.dataset.id=item.id;

    card.innerHTML=item.item_type==="folder"?folderSvg:fileSvg;
    const icon=card.querySelector("svg");
    if(item.item_type==="folder"&&item.folder_color)icon.style.color=item.folder_color;
    const settings=document.createElement("button");
    settings.type="button";
    settings.className="settings-dot";
    settings.title="Item settings";

    settings.addEventListener("click",event=>{event.stopPropagation();openCardSettings(item);});
    const name=document.createElement("span");
    name.className="file-name";
    name.textContent=item.name;
    card.append(settings,name);
    if(item.tag){
      const tag=document.createElement("span");
      tag.className="file-tag";
      tag.textContent=item.tag;
      card.append(tag);
    }
    card.addEventListener("click",event=>{
      if(card.dataset.dragged==="true"){
        card.dataset.dragged="false";
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if(selectedIds.size)clearSelection();
      if(item.item_type==="folder")openFolder(item.id);else openFile(item);
    });
    card.addEventListener("keydown",event=>{
      if(event.key==="Enter"){
        event.preventDefault();
        if(item.item_type==="folder")openFolder(item.id);else openFile(item);
      }
    });
    card.addEventListener("dragstart",event=>{
      // Dragging any selected card carries the entire marquee selection.
      internalDragIds=selectedIds.has(item.id)&&selectedIds.size?[...selectedIds]:[item.id];
      if(!selectedIds.has(item.id)&&selectedIds.size)clearSelection();
      card.dataset.dragged="true";
      event.dataTransfer.effectAllowed="move";
      event.dataTransfer.setData("application/x-coolanas-items",JSON.stringify(internalDragIds));
      event.dataTransfer.setData("text/plain",internalDragIds.join(","));
      requestAnimationFrame(()=>{
        card.classList.add("is-being-dragged");
        list.classList.add("is-rearranging");
      });
    });
    card.addEventListener("dragend",()=>{
      internalDragIds=[];
      list.classList.remove("is-rearranging");
      list.querySelectorAll(".is-being-dragged,.is-drop-target").forEach(node=>node.classList.remove("is-being-dragged","is-drop-target"));
    });
    card.addEventListener("dragover",event=>{
      if(internalDragIds.length&&item.item_type==="folder"&&!internalDragIds.includes(item.id)){
        event.preventDefault();
        event.dataTransfer.dropEffect="move";
        card.classList.add("is-drop-target");
      }else if(event.dataTransfer.types.includes("Files")){
        event.preventDefault();
        event.dataTransfer.dropEffect="copy";
        if(item.item_type==="folder")card.classList.add("is-drop-target");
      }
    });
    card.addEventListener("dragleave",()=>card.classList.remove("is-drop-target"));
    card.addEventListener("drop",async event=>{
      event.preventDefault();
      card.classList.remove("is-drop-target");
      if(internalDragIds.length){
        const ids=[...internalDragIds];
        if(item.item_type==="folder")await moveItems(ids,item.id);
        else await reorderBefore(ids,item.id);
        return;
      }
      if(event.dataTransfer.files?.length){
        const target=item.item_type==="folder"?item.id:currentFolderId;
        await handleExternalDrop(event.dataTransfer,target);
      }
    });
    list.append(card);
  }
  list.append(addWrap);
  updateSelectionUi();
  resetCardMotion();
}

const retryableUploadStatuses=new Set([408,429,500,502,503,504]);
function retryDelay(response,attempt){
  const retryAfter=response.headers.get("Retry-After");
  if(retryAfter){
    const seconds=Number(retryAfter);
    const requestedDelay=Number.isFinite(seconds)?seconds*1000:Date.parse(retryAfter)-Date.now();
    if(Number.isFinite(requestedDelay)&&requestedDelay>0)return Math.min(requestedDelay,30000);
  }
  return Math.min(1000*2**(attempt-1)+Math.random()*250,15000);
}
async function uploadToBackblaze(uploadUrl,contentType,file,signal){
  const maxAttempts=5;
  for(let attempt=1;attempt<=maxAttempts;attempt++){
    const response=await fetch(uploadUrl,{method:"PUT",headers:{"Content-Type":contentType},body:file,signal});
    if(response.ok)return;
    if(!retryableUploadStatuses.has(response.status)||attempt===maxAttempts){
      if(response.status===503)throw new Error("Backblaze is temporarily unavailable (HTTP 503) after "+attempt+" attempts. Please try the upload again.");
      if(response.status===429)throw new Error("Backblaze asked us to slow down (HTTP 429) after "+attempt+" attempts. Please try the upload again.");
      throw new Error("Backblaze rejected this file (HTTP "+response.status+").");
    }
    await new Promise((resolve,reject)=>{const timer=setTimeout(resolve,retryDelay(response,attempt));signal?.addEventListener("abort",()=>{clearTimeout(timer);reject(new DOMException("Upload cancelled","AbortError"));},{once:true});});
  }
}
async function saveFile(file,parentId,name=file.name,signal){
  const created=await filesAction("create_upload",{parentId,name,contentType:file.type||"application/octet-stream"});
  try{
    await uploadToBackblaze(created.uploadUrl,created.contentType,file,signal);
    await filesAction("finish_upload",{id:created.item.id});
    upsertItem(created.item);
  }catch(error){
    try{await filesAction("delete",{id:created.item.id});}catch{}
    throw error;
  }
}
async function uploadEntries(entries,parentId=currentFolderId){
  if(!entries.length)return;
  clearSelection();
  uploadTitle.textContent="Uploading files";
  activeUploadController=new AbortController();
  const signal=activeUploadController.signal;
  uploadMinimised=false;uploadCancelled=false;uploadMini.hidden=true;
  let done=0,processed=0,skipped=0;
  const failedUploads=[];
  setUploadProgress(0,entries.length,"Preparing "+entries.length+" item(s)…");
  const folderIds=new Map();
  try{
    const prepared=[];
    const plannedFolderFiles=new Set();
    for(const entry of entries){
      if(signal.aborted)throw new DOMException("Upload cancelled","AbortError");
      const displayName=entry.path||entry.file.name;
      const parts=(entry.path||entry.file.name).split("/").filter(Boolean);
      if(!parts.length)continue;
      let parent=parentId;
      for(let index=0;index<parts.length-1;index++){
        if(signal.aborted)throw new DOMException("Upload cancelled","AbortError");
        const key=(parent||"root")+":"+parts.slice(0,index+1).join("/");
        if(!folderIds.has(key)){
          let folder=items.find(item=>item.item_type==="folder"&&item.parent_id===parent&&item.name===parts[index]);
          if(!folder){
            const response=await filesAction("create_folder",{parentId:parent,name:parts[index]});
            folder=response.item;upsertItem(folder);
          }
          folderIds.set(key,folder.id);
        }
        parent=folderIds.get(key);
      }
      const fileName=parts[parts.length-1],isFolderImport=displayName.includes("/");
      const plannedKey=(parent||"root")+":"+fileName;
      if(isFolderImport&&(items.some(item=>item.item_type==="file"&&item.parent_id===parent&&item.name===fileName)||plannedFolderFiles.has(plannedKey))){
        skipped++;processed++;setUploadProgress(processed,entries.length,"Skipped existing file "+fileName);continue;
      }
      if(isFolderImport)plannedFolderFiles.add(plannedKey);
      prepared.push({entry,parent,fileName,displayName});
    }
    let nextUpload=0;
    async function uploadWorker(){
      while(!signal.aborted){
        const index=nextUpload++;
        if(index>=prepared.length)return;
        const task=prepared[index];
        setUploadProgress(processed,entries.length,task.displayName);
        try{await saveFile(task.entry.file,task.parent,task.fileName,signal);done++;}
        catch(error){if(error.name==="AbortError"||signal.aborted)return;failedUploads.push(task.displayName+": "+error.message);}
        processed++;
        setUploadProgress(processed,entries.length,"Processed "+processed+" of "+entries.length+" · uploaded "+done);
      }
    }
    await Promise.all(Array.from({length:Math.min(3,prepared.length)},()=>uploadWorker()));
    renderItems();
    if(failedUploads.length){
      const shownFailures=failedUploads.slice(0,8).join("\n");
      const remaining=failedUploads.length>8?"\n…and "+(failedUploads.length-8)+" more failed file(s).":"";
      alert("Upload finished: "+done+" of "+entries.length+" files uploaded; "+skipped+" existing file(s) skipped. Failed files:\n"+shownFailures+remaining+"\nFiles that uploaded successfully are saved.");
    }
    if(signal.aborted){await loadItems().catch(()=>{});}
  }catch(error){
    await loadItems().catch(()=>{});
    if(!signal.aborted)alert("Upload stopped after "+processed+" of "+entries.length+" files. "+error.message+" Files that uploaded successfully are saved.");
  }finally{hideUploadProgress();}
}

async function readDirectoryEntry(entry,path,output){
  if(entry.isFile){
    const file=await new Promise((resolve,reject)=>entry.file(resolve,reject));
    output.push({file,path:path+entry.name});
    return;
  }
  if(entry.isDirectory){
    const reader=entry.createReader();
    while(true){
      const batch=await new Promise((resolve,reject)=>reader.readEntries(resolve,reject));
      if(!batch.length)break;
      for(const child of batch)await readDirectoryEntry(child,path+entry.name+"/",output);
    }
  }
}
async function extractDroppedEntries(dataTransfer){
  const output=[];
  const items=[...(dataTransfer.items||[])].filter(item=>item.kind==="file");
  const entries=items.map(item=>item.webkitGetAsEntry?.()).filter(Boolean);
  if(entries.length){
    for(const entry of entries)await readDirectoryEntry(entry,"",output);
  }else{
    for(const file of [...(dataTransfer.files||[])])output.push({file,path:file.name});
  }
  return output;
}

}

async function topLevelIds(ids){
  const selected=new Set(ids);
  return ids.filter(id=>{
    let parent=items.find(item=>item.id===id)?.parent_id;
    while(parent){
      if(selected.has(parent))return false;
      parent=items.find(item=>item.id===parent)?.parent_id||null;
    }
    return true;
  });
}
async function moveItems(ids,targetParentId){
  const roots=await topLevelIds(ids);
  if(!roots.length)return;
  try{
    await filesAction("move",{ids:roots,targetParentId});
    let nextSortOrder=Math.max(0,...items.filter(item=>item.parent_id===targetParentId).map(item=>Number(item.sort_order)||0));
    for(const id of roots){
      const item=items.find(entry=>entry.id===id);
      if(!item||item.parent_id===targetParentId)continue;
      item.parent_id=targetParentId;
      item.sort_order=nextSortOrder+=10;
    }
    clearSelection();
    renderItems();
  }catch(error){alert("Could not move the selected items. "+error.message);}
}
async function reorderBefore(ids,targetId){
  const target=items.find(item=>item.id===targetId);
  if(!target)return;
  const parentId=target.parent_id;
  const ordered=items.filter(item=>item.parent_id===parentId)
    .sort((a,b)=>(Number(a.sort_order||0)-Number(b.sort_order||0))||a.name.localeCompare(b.name));
  const moving=await topLevelIds(ids);
  if(!moving.length||moving.some(id=>items.find(item=>item.id===id)?.parent_id!==parentId)){
    return;
  }
  const remaining=ordered.filter(item=>!moving.includes(item.id));
  const insertAt=remaining.findIndex(item=>item.id===targetId);
  remaining.splice(Math.max(0,insertAt),0,...moving.map(id=>items.find(item=>item.id===id)).filter(Boolean));
  try{
    await filesAction("reorder",{ids:remaining.map(item=>item.id),targetParentId:parentId});
    remaining.forEach((item,index)=>{item.sort_order=(index+1)*10;});
    clearSelection();
    renderItems();
  }catch(error){alert(error.message);}
}


async function openFile(item){
  viewer.hidden=false;
  viewerTitle.textContent=item.name;
  viewerContent.textContent="Loading preview…";
  try{
    const result=await filesAction("download",{id:item.id});
    const response=await fetch(result.downloadUrl);
    if(!response.ok)throw new Error("Backblaze download failed ("+response.status+").");
    const data=await response.blob();
    if(objectUrl)URL.revokeObjectURL(objectUrl);
    objectUrl=URL.createObjectURL(data);
    viewerContent.replaceChildren();
    if(data.type.startsWith("image/")){
      const img=document.createElement("img");img.src=objectUrl;viewerContent.append(img);
    }else if(data.type==="application/pdf"){
      const frame=document.createElement("iframe");frame.src=objectUrl;viewerContent.append(frame);
    }else if(data.type.startsWith("text/")||/\.(txt|md|json|js|css|html|xml|csv|log)$/i.test(item.name)){
      viewerContent.textContent=await data.text();
    }else{
      const message=document.createElement("p");message.textContent="Preview is unavailable for this file type.";
      const download=document.createElement("a");download.href=objectUrl;download.download=item.name;download.textContent="Download file";
      viewerContent.replaceChildren(message,download);
    }
  }catch(error){viewerContent.textContent=error.message;}
}
function closeViewer(){
  viewer.hidden=true;
  viewerContent.replaceChildren();
  if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;}
}
document.getElementById("viewer-close").addEventListener("click",closeViewer);
viewer.addEventListener("click",event=>{if(event.target===viewer)closeViewer();});
document.addEventListener("keydown",event=>{
  if(event.key==="Escape"){
    closeNavPanels();
    clearSelection();
    closeCardSettings();
    closeDeleteConfirmation();
  }
});
let migrated={migrated:0,userFolder:""};
try{migrated=await filesAction("migrate_prefix");}
catch(error){console.warn("Existing file prefix migration could not finish:",error.message);}
await loadItems();
flushPendingMutations();

  </script></body>
