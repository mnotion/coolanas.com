<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Files · mnotion</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0;background:#f7f7f7;color:#111;transition:background .18s ease}
    body{min-height:100vh;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;padding:24px 24px 100px}
    .add-wrap{position:relative;z-index:31;display:flex;align-items:center;justify-content:center;width:168px;min-height:176px;flex:none;border-radius:12px}
    .add-button{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(0,0,0,.06);border-radius:12px;background:#f1f2f3;color:#555;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.045);transition:background .15s,transform .15s}
    .add-button:hover{background:#e8e9eb;transform:scale(1.04)}
    .add-button svg{width:20px;height:20px}
    .add-menu{position:absolute;z-index:30;top:50px;left:0;width:170px;padding:5px;border:1px solid #eee;border-radius:11px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12)}
    .add-menu[hidden]{display:none}
    .add-option{display:block;width:100%;padding:10px;border:0;border-radius:7px;background:transparent;color:#222;text-align:left;font:13px/1.4 Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer}
    .add-option:hover{background:#f2f2f2}
    .upload-status{width:100%;margin:0 0 14px;color:#555;font-size:13px;text-align:center}
    .upload-status[hidden]{display:none}
    .files-list{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:18px;width:100%;margin:0;padding:0}
    .file-card{display:flex;flex-direction:column;align-items:center;gap:10px;width:168px;min-height:176px;padding:18px;border:0;border-radius:12px;background:#fff;color:#222;font:inherit;font-size:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.07);cursor:pointer;transform:scale(var(--card-scale,1));transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease;transform-origin:center;position:relative;z-index:var(--card-z,1)}
    .file-card:hover,.file-card.is-pointer-hover{background:#fafafa;box-shadow:0 5px 16px rgba(0,0,0,.10);}
    .file-card:focus-visible{outline:2px solid #aaa;outline-offset:3px}
    .file-card.is-pointer-near{box-shadow:0 4px 14px rgba(0,0,0,.085)}
    .file-card.is-selected{background:#eaf2ff;outline:2px solid #4b91f1;outline-offset:-2px;box-shadow:0 3px 12px rgba(59,130,246,.16)}
    .file-card,.file-card *{-webkit-user-select:none;user-select:none}
    .file-card.is-selected{z-index:9}
    @keyframes coolanas-folder-jiggle{
      0%,100%{transform:rotate(-1.15deg)}
      50%{transform:rotate(1.15deg)}
    }
    .files-list.is-rearranging .file-card[data-type="folder"]:not(.is-being-dragged){
      animation:coolanas-folder-jiggle var(--folder-jiggle-duration,.5s) ease-in-out infinite;
      transform-origin:50% 55%;
      will-change:transform;
    }
    .files-list.is-rearranging .file-card[data-type="folder"] .settings-dot{display:none!important}
    .files-list.is-rearranging .file-card[data-type="folder"]:nth-child(even){animation-delay:-.11s}
    .files-list.is-rearranging .file-card{--card-scale:1!important}
    .file-card[draggable="true"]{cursor:grab}
    .file-card.is-being-dragged{opacity:.48;cursor:grabbing}
    .file-card.is-being-dragged:hover{background:#e5e7eb;box-shadow:none;transform:scale(1)!important}
    .file-card.is-being-dragged[data-type="folder"]:hover{background:#e5e7eb;box-shadow:inset 0 0 0 1px rgba(107,114,128,.08);transform:scale(1)!important}
    .file-card.is-being-dragged.is-pointer-hover,.file-card.is-being-dragged.is-pointer-near{box-shadow:none}
    .file-card.is-being-dragged[data-type="folder"]{
      opacity:1;
      background:#e5e7eb;
      outline:2px dashed #9ca3af;
      outline-offset:3px;
      border:1px dashed #9ca3af;
      box-shadow:inset 0 0 0 1px rgba(107,114,128,.08);
      animation:none!important;
      filter:grayscale(1);
    }
    .file-card.is-being-dragged[data-type="folder"]>*{opacity:.22}
    .file-card.is-being-dragged[data-type="folder"] .settings-dot{display:none!important}
    .file-card.is-drop-target{outline:2px dashed #3985ed;outline-offset:3px;background:#edf4ff;transform:scale(1.055);box-shadow:0 8px 22px rgba(59,130,246,.2);cursor:copy;transition:transform .14s ease,box-shadow .14s ease,background .14s ease}
    .file-card.is-selected .settings-dot{display:none}
    body.has-selection::after{content:"";position:fixed;inset:0;z-index:8;background:rgba(10,12,18,.78);pointer-events:none}
    body.selection-drag-mode{overflow:hidden}
    body.selection-drag-mode main{touch-action:none;overscroll-behavior:contain}
    body.selection-drag-mode .files-list{touch-action:none}
    body.selection-drag-mode .selection-marquee{touch-action:none}

    .bottom-nav{z-index:10}

    .selection-marquee{position:fixed;z-index:40;pointer-events:none;border:1px solid #3985ed;background:rgba(59,130,246,.16);border-radius:2px}

    .file-card{position:relative}
    .settings-dot{position:absolute;top:9px;right:9px;width:13px;height:13px;padding:0;border:0;border-radius:50%;background:#9ca3af;box-shadow:0 0 0 2px #fff;cursor:pointer;z-index:5;opacity:.92;transition:background .12s ease,transform .12s ease}
    .settings-dot:hover{background:#6b7280;transform:scale(1.15)}
    .settings-dot:focus-visible{outline:2px solid #6b7280;outline-offset:3px}
    .file-tag{margin-top:-5px;padding:3px 7px;border-radius:999px;background:#f0f1f3;color:#555;font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .files-toolbar{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 18px;color:#333}
    .files-toolbar[hidden]{display:none}
    .crumb-button{border:0;background:transparent;padding:5px 8px;border-radius:7px;font:inherit;cursor:pointer}
    .crumb-button:hover{background:#f1f1f1}
    .crumb-current{font-size:14px;color:#777}
    .file-viewer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(20,20,20,.24);backdrop-filter:blur(5px)}
    .file-viewer[hidden]{display:none}
    .confirm-overlay{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
    .confirm-overlay[hidden]{display:none}
    .confirm-panel{width:min(420px,100%);padding:22px;border:1px solid rgba(0,0,0,.08);border-radius:16px;background:#fff;box-shadow:0 20px 65px rgba(0,0,0,.2)}
    .card-settings-panel{width:min(440px,100%);padding:24px}
    #card-settings-overlay{background:rgba(0,0,0,.28)}
    .settings-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
    .settings-header h2{margin:0;font-size:19px;font-weight:650;color:#171717}
    .settings-subtitle{margin:5px 0 0;color:#858585;font-size:12px}
    .settings-accordion{border-top:1px solid #eceef0}
    .settings-section{border-bottom:1px solid #eceef0}
    .settings-section>summary{min-height:58px;display:flex;align-items:center;gap:12px;list-style:none;cursor:pointer;user-select:none}
    .settings-section>summary::-webkit-details-marker{display:none}
    .settings-section-content{display:grid;grid-template-rows:0fr;opacity:0;overflow:hidden;padding:0!important;transition:grid-template-rows .28s cubic-bezier(.2,.8,.2,1),opacity .2s ease,padding .28s ease}
    .settings-section-content>*{min-height:0}
    .settings-section[open]>.settings-section-content{grid-template-rows:1fr;opacity:1;padding:0 0 18px!important}
    .settings-section>summary::after{content:"";width:8px;height:8px;margin-left:auto;border-right:1.7px solid #777;border-bottom:1.7px solid #777;transform:rotate(45deg);transition:transform .16s ease}
    .settings-section[open]>summary::after{transform:rotate(225deg)}
    .settings-section-title{font-size:14px;font-weight:600;color:#252525}
    .settings-section-value{margin-left:auto;color:#858b94;font-size:12px}
    .settings-section>summary:has(.settings-section-title)+.settings-section-content{padding:0 0 18px}
    .settings-section[open]>summary .settings-section-value{margin-left:auto}
    .color-options{display:flex;gap:12px;flex-wrap:wrap;padding:3px 2px}
    .color-choice{width:30px;height:30px;border:2px solid #fff;border-radius:50%;background:var(--swatch);box-shadow:0 0 0 1px #d1d5db;cursor:pointer;transition:transform .14s ease,box-shadow .14s ease}
    .color-choice:hover{transform:scale(1.1)}
    .color-choice.active{box-shadow:0 0 0 2px #2563eb}
    .settings-section-content .search-input{width:100%;box-sizing:border-box}
    .settings-delete-copy{margin:0 0 12px;color:#777;font-size:12px;line-height:1.5}
    .settings-footer{display:flex;justify-content:flex-end;margin-top:18px}
    .settings-danger-section .settings-section-title{color:#d9363e}

    .confirm-title{margin:0 0 8px;font-size:17px;font-weight:650;color:#171717}
    .confirm-message{margin:0;color:#666;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
    .confirm-item-name{color:#2563eb;font-weight:600}
    .confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
    .confirm-button{min-width:82px;padding:9px 15px;border:1px solid #e5e5e5;border-radius:9px;background:#f7f7f7;color:#333;font:inherit;font-size:13px;cursor:pointer}
    .confirm-button:hover{background:#eee}
    .confirm-button.danger{border-color:#d9363e;background:#d9363e;color:#fff}
    .confirm-button.danger:hover{background:#c52d35}

    .viewer-panel{width:min(900px,100%);height:min(720px,90vh);display:flex;flex-direction:column;overflow:hidden;border:1px solid #eee;border-radius:16px;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.18)}
    .viewer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #eee}
    .viewer-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .viewer-close{width:32px;height:32px;border:0;border-radius:8px;background:#f1f1f1;font-size:20px;cursor:pointer}
    .viewer-content{flex:1;min-height:0;overflow:auto;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}
    .viewer-content img,.viewer-content iframe{display:block;width:100%;height:100%;border:0;object-fit:contain}
    .folder-icon{width:112px;height:112px;flex:none;color:#e3b52f}
    .file-icon{width:112px;height:112px;flex:none;color:#888}
    .file-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .drop-hint{position:fixed;inset:12px;z-index:20;display:grid;place-items:center;border:2px dashed #b9bdc2;border-radius:18px;background:rgba(245,246,247,.88);color:#555;font-size:16px;pointer-events:none}
    .drop-hint[hidden]{display:none}
    .upload-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(245,246,247,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
    .upload-overlay[hidden]{display:none}
    .upload-card{width:min(360px,100%);padding:26px;border:1px solid rgba(0,0,0,.07);border-radius:18px;background:rgba(255,255,255,.96);box-shadow:0 18px 60px rgba(0,0,0,.14);text-align:center}
    .upload-spinner{width:34px;height:34px;margin:0 auto 16px;border:3px solid #e8e8e8;border-top-color:#555;border-radius:50%;animation:upload-spin .8s linear infinite}
    .upload-title{margin:0 0 5px;font-size:15px;font-weight:650;color:#222}
    .upload-detail{min-height:20px;margin:0;color:#777;font-size:12px;overflow-wrap:anywhere}
    .upload-progress{height:5px;margin-top:18px;overflow:hidden;border-radius:9px;background:#eee}
    .upload-progress-bar{width:0;height:100%;border-radius:9px;background:#555;transition:width .15s ease}
    @keyframes upload-spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.upload-spinner{animation-duration:2s}.upload-progress-bar{transition:none}}

    .bottom-nav{
      position:fixed;z-index:10;left:50%;bottom:20px;transform:translateX(-50%);
      width:min(260px,calc(100% - 24px));min-height:44px;padding:3px;
      display:grid;grid-template-columns:repeat(3,1fr);gap:3px;
      background:rgba(235,236,238,.9);border:1px solid rgba(0,0,0,.06);
      border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.055),inset 0 1px 0 rgba(255,255,255,.65);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)
    }
    .nav-button{
      display:flex;align-items:center;justify-content:center;min-height:36px;
      border:1px solid rgba(0,0,0,.045);border-radius:9px;
      background:rgba(255,255,255,.28);color:#555;cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
      position:relative;z-index:1;
      transition:transform .08s ease-out,background .16s ease,border-color .16s ease,box-shadow .16s ease;
      -webkit-tap-highlight-color:transparent
    }
    .bottom-nav:has(.nav-button:hover) .nav-button:not(:hover):not([aria-current="page"]){transform:scale(.94)}
    .nav-button:hover{z-index:2;transform:scale(1.08);background:rgba(255,255,255,.72);border-color:rgba(0,0,0,.09);box-shadow:0 2px 7px rgba(0,0,0,.06)}
    .nav-button:active{transform:translate3d(var(--shift-x,0px),var(--shift-y,0px),0) scale(1.06)}
    .nav-button svg{width:17px;height:17px}
    .nav-button[aria-current="page"]{color:#333;background:rgba(185,188,192,.48);border-color:rgba(0,0,0,.10);box-shadow:inset 0 1px 2px rgba(0,0,0,.07)}
    /* Keep the page compositor stable while hovering the navigation. */
    .panel{position:fixed;z-index:9;left:50%;bottom:84px;transform:translateX(-50%);width:min(420px,calc(100% - 32px));padding:18px;border:1px solid rgba(255,255,255,.9);border-radius:18px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 34px rgba(0,0,0,.11),inset 0 1px 0 #fff}
    .panel[hidden]{display:none}
    .panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .panel-heading h2{margin:0;font-size:15px;font-weight:650}
    .close-button{width:30px;height:30px;border:0;border-radius:8px;background:rgba(0,0,0,.05);cursor:pointer;font-size:19px;line-height:1}
    .search-input{width:100%;height:42px;padding:0 12px;border:1px solid #ddd;border-radius:9px;outline:none;font:inherit;background:rgba(255,255,255,.85)}
    .menu-list{display:grid;gap:3px}
    .menu-item{display:block;width:100%;padding:11px;border:0;border-radius:8px;background:transparent;color:#222;text-align:left;font:500 13px Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer}
    .menu-item:hover{background:rgba(0,0,0,.05)}
    @media(max-width:480px){main{padding:16px 16px 90px}.bottom-nav{bottom:12px}.panel{bottom:76px}}
    @media(prefers-reduced-motion:reduce){html,body{transition:none}.nav-button{transition:none}.nav-button:hover,.nav-button:active,.bottom-nav:has(.nav-button:hover) .nav-button:not(:hover){transform:none}body:has(.bottom-nav:hover) main,body:has(.bottom-nav:focus-within) main{filter:none}}
  </style>
</head>
<body>
  <main aria-label="Files">
    <input id="file-picker" type="file" multiple style="position:fixed;left:-10000px;width:1px;height:1px;opacity:0">
    <input id="folder-picker" type="file" webkitdirectory multiple style="position:fixed;left:-10000px;width:1px;height:1px;opacity:0">
    <div class="files-toolbar" id="files-toolbar" hidden><button class="crumb-button" id="back-folder" type="button">← Back</button><span class="crumb-current" id="current-folder"></span></div>
    <div class="upload-status" id="upload-status" role="status" aria-live="polite" hidden></div>
    <div class="files-list" id="files-list" role="list" aria-label="Files and folders"></div>
  </main>
  <div class="drop-hint" id="drop-hint" hidden>Drop files or folders to add them</div>
  <div class="selection-marquee" id="selection-marquee" hidden></div>
  <div class="upload-overlay" id="upload-overlay" hidden aria-live="polite" aria-busy="true"><div class="upload-card"><div class="upload-spinner" aria-hidden="true"></div><p class="upload-title" id="upload-title">Uploading files</p><p class="upload-detail" id="upload-detail">Preparing…</p><div class="upload-progress"><div class="upload-progress-bar" id="upload-progress-bar"></div></div></div></div>
  <div class="file-viewer" id="file-viewer" hidden><section class="viewer-panel"><header class="viewer-head"><strong id="viewer-title"></strong><button class="viewer-close" id="viewer-close" type="button" aria-label="Close">×</button></header><div class="viewer-content" id="viewer-content"></div></section></div>
  <div class="confirm-overlay" id="card-settings-overlay" hidden>
    <section class="confirm-panel card-settings-panel" role="dialog" aria-modal="true" aria-labelledby="card-settings-title">
      <div class="settings-header"><div><h2 id="card-settings-title">Card settings</h2></div><button class="close-button" id="card-settings-close" type="button" aria-label="Close">×</button></div>
      <div class="settings-accordion">
        <details class="settings-section" id="folder-color-section">
          <summary><span class="settings-section-title">Folder colour</span></summary>
          <div class="settings-section-content">
            <div class="color-options" id="folder-color-options">
              <button type="button" class="color-choice" data-color="#e6b325" aria-label="Yellow" title="Yellow" style="--swatch:#e6b325"></button>
              <button type="button" class="color-choice" data-color="#3b82f6" aria-label="Blue" title="Blue" style="--swatch:#3b82f6"></button>
              <button type="button" class="color-choice" data-color="#22a06b" aria-label="Green" title="Green" style="--swatch:#22a06b"></button>
              <button type="button" class="color-choice" data-color="#a855f7" aria-label="Purple" title="Purple" style="--swatch:#a855f7"></button>
              <button type="button" class="color-choice" data-color="#ef4444" aria-label="Red" title="Red" style="--swatch:#ef4444"></button>
              <button type="button" class="color-choice" data-color="#6b7280" aria-label="Gray" title="Gray" style="--swatch:#6b7280"></button>
            </div>
          </div>
        </details>
        <details class="settings-section" id="tag-section">
          <summary><span class="settings-section-title">Tag</span></summary>
          <div class="settings-section-content"><input class="search-input" id="card-tag-input" type="text" maxlength="32" placeholder="Add a tag"></div>
        </details>
        <details class="settings-section settings-danger-section" id="delete-section">
          <summary><span class="settings-section-title">Delete item</span></summary>
          <div class="settings-section-content"><p class="settings-delete-copy">This will delete this item and its contents, if it is a folder.</p><button class="confirm-button danger" id="card-settings-delete" type="button">Delete item</button></div>
        </details>
      </div>
      <div class="settings-footer"><button class="confirm-button" id="card-settings-cancel" type="button">Done</button></div>
    </section>
  </div>
  <div class="confirm-overlay" id="confirm-overlay" hidden><section class="confirm-panel" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message"><h2 class="confirm-title" id="confirm-title">Delete item?</h2><p class="confirm-message" id="confirm-message"></p><div class="confirm-actions"><button class="confirm-button" id="confirm-cancel" type="button">Cancel</button><button class="confirm-button danger" id="confirm-delete" type="button">Delete</button></div></section></div>
  <section class="panel" id="search-panel" aria-label="Search" hidden>
    <div class="panel-heading"><h2>Search</h2><button class="close-button" type="button" data-close aria-label="Close">×</button></div>
    <input class="search-input" id="files-search-input" type="search" placeholder="Search files in this folder…" autocomplete="off">
  </section>
  <section class="panel" id="menu-panel" aria-label="Menu" hidden>
    <div class="panel-heading"><h2>Menu</h2><button class="close-button" type="button" data-close aria-label="Close">×</button></div>
    <nav class="menu-list"><button class="menu-item" id="menu-home" type="button">Home</button><button class="menu-item" id="signout" type="button">Sign out</button></nav>
  </section>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-button" id="search-toggle" type="button" aria-label="Search" aria-expanded="false" aria-controls="search-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
    </button>
    <button class="nav-button" id="files-toggle" type="button" aria-label="Files" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5z"></path><path d="M3.5 10h17"></path></svg>
    </button>
    <button class="nav-button" id="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu-panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
  </nav>

    const SUPABASE_URL="https://nacwftrsdpglzrhasmit.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY="sb_publishable_4OLO5cw2lr_l90MECEAG0A_MJY1NQQF";
    const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2.119.0");
    const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const {data:{session}}=await supabase.auth.getSession();
    if(!session){location.replace("index.html");throw new Error("Sign-in required");}
    const user=session.user;
    const folderSvg='<svg class="folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5z"/><path d="M3.5 10h17"/></svg>';
    const fileSvg='<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.8h8l4 4V20H6z"/><path d="M14 3.8V8h4"/></svg>';
    const filesFunction="coolanas-files-b2";
    const list=document.getElementById("files-list");
    const toolbar=document.getElementById("files-toolbar");
    const currentFolder=document.getElementById("current-folder");
    const viewer=document.getElementById("file-viewer");
    const viewerTitle=document.getElementById("viewer-title");
    const viewerContent=document.getElementById("viewer-content");
    let items=[],currentFolderId=null,searchQuery="";
    const status=document.createElement("p");
    status.style.cssText="width:100%;text-align:center;color:#777;font-size:13px";
    async function filesAction(action,payload={}){
      const {data,error}=await supabase.functions.invoke(filesFunction,{body:{action,...payload}});
      if(error)throw error;
      if(data?.error)throw new Error(data.error);
      return data;
    }
    async function loadItems(){
      const data=await filesAction("list");
      items=data.items||[];renderItems();
    }
    function visibleItems(){return items.filter(x=>x.parent_id===currentFolderId&&x.name.toLocaleLowerCase().includes(searchQuery));}
    function renderItems(){
      list.replaceChildren();
      const folder=items.find(x=>x.id===currentFolderId);
      toolbar.hidden=!currentFolderId;currentFolder.textContent=folder?.name||"";
      const ordered=visibleItems().sort((x,y)=>(x.item_type==="folder"?0:1)-(y.item_type==="folder"?0:1));
      for(const item of ordered){
        const card=document.createElement("div");card.className="file-card";card.tabIndex=0;card.dataset.id=item.id;
        card.innerHTML=item.item_type==="folder"?folderSvg:fileSvg;
        const name=document.createElement("span");name.className="file-name";name.textContent=item.name;
        const share=document.createElement("button");share.type="button";share.className="share-toggle";share.textContent=item.is_shared?"Shared":"Share";
        share.style.cssText="margin-top:4px;padding:4px 9px;border:1px solid #e5e5e5;border-radius:7px;background:#fafafa;color:#666;font:11px system-ui;cursor:pointer";
        share.addEventListener("click",async e=>{e.stopPropagation();await setShared(item,!item.is_shared);});
        card.append(name,share);
        card.addEventListener("click",()=>item.item_type==="folder"?openFolder(item.id):openFile(item));
        card.addEventListener("keydown",e=>{if(e.key==="Enter")item.item_type==="folder"?openFolder(item.id):openFile(item);});
        list.append(card);
      }
      list.append(addWrap);resetCardMotion();
    }
    async function setShared(item,shared){
      try{await filesAction("set_shared",{id:item.id,shared});await loadItems();}
      catch(error){alert(error.message);}
    }
    function openFolder(id){currentFolderId=id;renderItems();}
    document.getElementById("back-folder").addEventListener("click",()=>{currentFolderId=items.find(x=>x.id===currentFolderId)?.parent_id||null;renderItems();});
    const addWrap=document.createElement("div");addWrap.className="add-wrap";
    addWrap.innerHTML='<button class="add-button" id="add-toggle" type="button" aria-label="Upload files" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><div class="add-menu" id="add-menu" hidden><button class="add-option" type="button" id="upload-option">Upload files</button><button class="add-option" type="button" id="upload-folder-option">Upload folder</button></div>';
    const addToggle=addWrap.querySelector("#add-toggle"),addMenu=addWrap.querySelector("#add-menu");
    addToggle.addEventListener("click",e=>{e.stopPropagation();addMenu.hidden=!addMenu.hidden;addToggle.setAttribute("aria-expanded",String(!addMenu.hidden));});
    document.addEventListener("click",e=>{if(!e.target.closest(".add-wrap")){addMenu.hidden=true;addToggle.setAttribute("aria-expanded","false");}});
    addMenu.addEventListener("click",e=>{
      const button=e.target.closest("#upload-option,#upload-folder-option");if(!button)return;
      const picker=document.getElementById(button.id==="upload-option"?"file-picker":"folder-picker");
      addMenu.hidden=true;addToggle.setAttribute("aria-expanded","false");picker.click();
    });
    async function saveFile(file,parentId,name=file.name){
      const created=await filesAction("create_upload",{parentId,name,contentType:file.type||"application/octet-stream"});
      try{
        const response=await fetch(created.uploadUrl,{method:"PUT",headers:{"Content-Type":created.contentType},body:file});
        if(!response.ok)throw new Error("Backblaze upload failed ("+response.status+"). Check the bucket CORS settings.");
        await filesAction("finish_upload",{id:created.item.id});
      }catch(error){
        throw new Error(error.message+" The file record may need cleanup before retrying.");
      }
    }
    async function uploadFolder(files){
      const folders=new Map();
      for(const file of files){
        const parts=(file.webkitRelativePath||file.name).split("/");
        let parent=currentFolderId;
        for(let i=0;i<parts.length-1;i++){
          const key=parts.slice(0,i+1).join("/");
          if(!folders.has(key)){
            let folder=items.find(x=>x.item_type==="folder"&&x.parent_id===parent&&x.name===parts[i]);
            if(!folder){
              const created=await filesAction("create_folder",{parentId:parent,name:parts[i]});
              folder=created.item;items.push(folder);
            }
            folders.set(key,folder.id);
          }
          parent=folders.get(key);
        }
        await saveFile(file,parent,parts.at(-1));
      }
      await loadItems();
    }
    const picker=document.getElementById("file-picker"),folderPicker=document.getElementById("folder-picker");
    picker.addEventListener("change",async()=>{try{for(const file of picker.files)await saveFile(file,currentFolderId);await loadItems();}catch(e){alert(e.message);}picker.value="";});
    folderPicker.addEventListener("change",async()=>{try{await uploadFolder([...folderPicker.files]);}catch(e){alert(e.message);}folderPicker.value="";});
    async function openFile(item){
      viewer.hidden=false;viewerTitle.textContent=item.name;viewerContent.textContent="Loading preview…";
      try{
      const result=await filesAction("download",{id:item.id});
      const response=await fetch(result.downloadUrl);
      if(!response.ok)throw new Error("Backblaze download failed ("+response.status+").");
      const data=await response.blob();
      const url=URL.createObjectURL(data);viewerContent.replaceChildren();
      if(data.type.startsWith("image/")){const img=document.createElement("img");img.src=url;viewerContent.append(img);}
      else if(data.type==="application/pdf"){const frame=document.createElement("iframe");frame.src=url;viewerContent.append(frame);}
      else if(data.type.startsWith("text/")||/\.(txt|md|json|js|css|html|xml|csv|log)$/i.test(item.name)){viewerContent.textContent=await data.text();}
      else viewerContent.textContent="Preview is unavailable for this file type.";
      }catch(error){viewerContent.textContent=error.message;}
    }
    function closeViewer(){viewer.hidden=true;viewerContent.replaceChildren();}
    document.getElementById("viewer-close").addEventListener("click",closeViewer);
    viewer.addEventListener("click",e=>{if(e.target===viewer)closeViewer();});
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeViewer();});
    function resetCardMotion(){list.querySelectorAll(".file-card").forEach(card=>{card.style.setProperty("--card-scale","1");card.style.setProperty("--card-z","1");});}
    list.addEventListener("pointermove",e=>{
      if(e.pointerType!=="mouse")return;
      const cards=[...list.querySelectorAll(".file-card")],hovered=e.target.closest(".file-card");
      if(!hovered){resetCardMotion();return;}
      const r=hovered.getBoundingClientRect(),hx=r.left+r.width/2,hy=r.top+r.height/2;
      const nearest=cards.filter(x=>x!==hovered).map(card=>({card,d:Math.hypot(card.getBoundingClientRect().left+card.offsetWidth/2-hx,card.getBoundingClientRect().top+card.offsetHeight/2-hy)})).sort((x,y)=>x.d-y.d);
      hovered.style.setProperty("--card-scale","1.09");hovered.style.setProperty("--card-z","5");
      nearest.forEach((x,i)=>{x.card.style.setProperty("--card-scale",String(Math.max(.82,1-.025*(i+1))));});
    });
    list.addEventListener("pointerleave",resetCardMotion);
    const navSearch=document.getElementById("search-toggle");
    const navFiles=document.getElementById("files-toggle");
    const navMenu=document.getElementById("menu-toggle");
    const searchPanel=document.getElementById("search-panel");
    const menuPanel=document.getElementById("menu-panel");
    const searchInput=document.getElementById("files-search-input");
    function closeNavPanels(){
      searchPanel.hidden=true;
      menuPanel.hidden=true;
      navSearch.setAttribute("aria-expanded","false");
      navMenu.setAttribute("aria-expanded","false");
    }
    function toggleNavPanel(panel,button){
      const shouldOpen=panel.hidden;
      closeNavPanels();
      if(shouldOpen){
        panel.hidden=false;
        button.setAttribute("aria-expanded","true");
        panel.querySelector("input")?.focus();
      }
    }
    navSearch.addEventListener("click",()=>toggleNavPanel(searchPanel,navSearch));
    navFiles.addEventListener("click",()=>{closeNavPanels();window.scrollTo({top:0,behavior:"smooth"});});
    navMenu.addEventListener("click",()=>toggleNavPanel(menuPanel,navMenu));
    document.querySelectorAll(".panel [data-close]").forEach(button=>button.addEventListener("click",closeNavPanels));
    document.getElementById("menu-home").addEventListener("click",()=>location.assign("dashboard.html"));
    searchInput.addEventListener("input",()=>{
      searchQuery=searchInput.value.trim().toLocaleLowerCase();
      renderItems();
    });
    document.getElementById("signout")?.addEventListener("click",async()=>{await supabase.auth.signOut();location.replace("index.html");});
    document.addEventListener("keydown",event=>{if(event.key==="Escape")closeNavPanels();});
    await loadItems();
  </script></body>
</html>
