name: Development checks

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check exhibitions page JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("exhibitions.html").read_text()
          match = re.search(r'<script type="module">\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit("Could not find exhibitions page module script")
          Path("/tmp/exhibitions-inline.mjs").write_text(match.group(1))
          PY
          node --check /tmp/exhibitions-inline.mjs
      - name: Check Coolanas Mail JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("coming-soon.html").read_text()
          match = re.search(r'<script type="module">\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit("Could not find Coolanas Mail module script")
          Path("/tmp/coolanas-mail-inline.mjs").write_text(match.group(1))
          PY
          node --check /tmp/coolanas-mail-inline.mjs
      - name: Type-check B2 Edge Function
        run: deno check --no-lock supabase/functions/coolanas-files-b2/index.ts
