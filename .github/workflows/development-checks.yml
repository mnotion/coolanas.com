name: Development checks

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check exhibitions page JavaScript syntax
        run: node --check --input-type=module < js/exhibitions.js
      - name: Check Coolanas Mail JavaScript syntax
        run: node --check --input-type=module < js/coming-soon.js
      - name: Type-check B2 Edge Function
        run: deno check --no-lock supabase/functions/coolanas-files-b2/index.ts
